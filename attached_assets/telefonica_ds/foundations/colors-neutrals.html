<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Cool grey scale — text, borders, surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page)}
  .row{display:flex;gap:8px}
  .sw{flex:1;text-align:center}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-default)}
  .name{margin-top:7px;font:var(--fw-medium) 11px/1.2 var(--font-sans);color:var(--text-primary)}
  .hex{font:var(--fw-regular) 10.5px/1.5 var(--font-mono);color:var(--text-secondary);text-transform:uppercase}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tf-grey-50)"></div><div class="name">50</div><div class="hex">F8F8FB</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-100)"></div><div class="name">100</div><div class="hex">F1F1F5</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-200)"></div><div class="name">200</div><div class="hex">E4E4EA</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-300)"></div><div class="name">300</div><div class="hex">D0D0D8</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-400)"></div><div class="name">400</div><div class="hex">A6A6B0</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-500)"></div><div class="name">500</div><div class="hex">7C7C88</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-600)"></div><div class="name">600</div><div class="hex">5A5A66</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-700)"></div><div class="name">700</div><div class="hex">3B3B46</div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-grey-900)"></div><div class="name">900</div><div class="hex">1B1B25</div></div>
  </div>
</body></html>
