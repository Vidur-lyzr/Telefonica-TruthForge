<!-- @dsCard group="Colors" viewport="700x172" name="Semantic — Status" subtitle="Success · Warning · Error · Info, each with a tint" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
  .chip{height:52px}
  .tint{height:28px}
  .meta{padding:7px 10px}
  .name{font:var(--fw-medium) 13px/1.3 var(--font-sans);color:var(--text-primary)}
  .hex{font:var(--fw-regular) 11px/1.5 var(--font-mono);color:var(--text-secondary);text-transform:uppercase}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tf-success)"></div><div class="tint" style="background:var(--tf-success-bg)"></div><div class="meta"><div class="name">Success</div><div class="hex">#1AB759</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-warning)"></div><div class="tint" style="background:var(--tf-warning-bg)"></div><div class="meta"><div class="name">Warning</div><div class="hex">#FFB800</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-error)"></div><div class="tint" style="background:var(--tf-error-bg)"></div><div class="meta"><div class="name">Error</div><div class="hex">#FF4133</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-info)"></div><div class="tint" style="background:var(--tf-info-bg)"></div><div class="meta"><div class="name">Info</div><div class="hex">#0066FF</div></div></div>
  </div>
</body></html>
