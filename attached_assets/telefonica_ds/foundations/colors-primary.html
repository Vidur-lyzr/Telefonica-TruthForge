<!-- @dsCard group="Colors" viewport="700x168" name="Primary — Brand Blue" subtitle="#0066FF corporate blue + interaction states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
  .chip{height:80px}
  .meta{padding:8px 10px}
  .name{font:var(--fw-medium) 13px/1.3 var(--font-sans);color:var(--text-primary)}
  .hex{font:var(--fw-regular) 11.5px/1.5 var(--font-mono);color:var(--text-secondary);text-transform:uppercase}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tf-blue-tint)"></div><div class="meta"><div class="name">Tint</div><div class="hex">#E6F0FF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-blue-light)"></div><div class="meta"><div class="name">Light</div><div class="hex">#4D94FF</div></div></div>
    <div class="sw" style="flex:1.6"><div class="chip" style="background:var(--tf-blue)"></div><div class="meta"><div class="name">Primary · Blue</div><div class="hex">#0066FF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-blue-hover)"></div><div class="meta"><div class="name">Hover</div><div class="hex">#0047B3</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-blue-active)"></div><div class="meta"><div class="name">Active</div><div class="hex">#00308A</div></div></div>
  </div>
</body></html>
