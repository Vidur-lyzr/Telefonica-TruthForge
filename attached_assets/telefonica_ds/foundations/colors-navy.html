<!-- @dsCard group="Colors" viewport="700x168" name="Corporate Deep Blue" subtitle="Navy family for full-bleed dark sections & footers" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-page)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
  .chip{height:80px}
  .meta{padding:8px 10px}
  .name{font:var(--fw-medium) 13px/1.3 var(--font-sans);color:var(--text-primary)}
  .hex{font:var(--fw-regular) 11.5px/1.5 var(--font-mono);color:var(--text-secondary);text-transform:uppercase}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--tf-navy-tint)"></div><div class="meta"><div class="name">Navy Tint</div><div class="hex">#0A2A5E</div></div></div>
    <div class="sw" style="flex:1.6"><div class="chip" style="background:var(--tf-navy)"></div><div class="meta"><div class="name">Deep Navy</div><div class="hex">#001B41</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-navy-2)"></div><div class="meta"><div class="name">Near-black</div><div class="hex">#04122E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--tf-white);border-right:1px solid var(--border-default)"></div><div class="meta"><div class="name">On-navy text</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body></html>
