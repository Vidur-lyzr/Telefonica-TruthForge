<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body{margin:0;padding:22px;background:var(--surface-page)}
  .wrap{display:flex;flex-direction:column;gap:16px}
  .lbl{font:var(--fw-bold) 11px/1 var(--font-mono);color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .inv{background:var(--tf-blue);border-radius:var(--radius-lg);padding:14px 16px;display:flex;gap:12px;align-items:center}
</style></head><body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton } = window.TelefNicaDesignSystem_29ea10;
const Arrow = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
const Search = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>;
const Plus = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;
function Demo(){
  return (
    <div className="wrap">
      <div><div className="lbl">Variants</div><div className="row">
        <Button variant="primary">Primary</Button>
        <Button variant="secondary">Secondary</Button>
        <Button variant="danger">Danger</Button>
        <Button variant="link">Link</Button>
      </div></div>
      <div><div className="lbl">Sizes &amp; icon</div><div className="row">
        <Button size="sm">Small</Button>
        <Button size="md" iconRight={<Arrow/>}>Discover</Button>
        <Button size="lg">Large</Button>
        <Button variant="secondary" iconLeft={<Plus/>}>Add line</Button>
      </div></div>
      <div><div className="lbl">States &amp; icon buttons</div><div className="row">
        <Button loading>Loading</Button>
        <Button disabled>Disabled</Button>
        <IconButton label="Search" variant="ghost"><Search/></IconButton>
        <IconButton label="Add" variant="solid"><Plus/></IconButton>
        <IconButton label="Search" variant="outline"><Search/></IconButton>
        <div className="inv">
          <Button variant="inverse" size="sm">Inverse</Button>
          <IconButton label="Search" variant="ghost" style={{color:'#fff'}}><Search/></IconButton>
        </div>
      </div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
