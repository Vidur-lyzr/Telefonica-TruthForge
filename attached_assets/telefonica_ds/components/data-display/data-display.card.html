<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, Tag, Badge, Avatar, Button } = window.TelefNicaDesignSystem_29ea10;
function Demo(){

        description="Ultra-low-latency coverage now reaches 2,000 towns and cities."
        footer={<Button variant="link">Read more →</Button>} href="#" />
      <div>
        <div className="lbl">Tags</div>
        <div className="row">
          <Tag variant="promo">New</Tag>
          <Tag variant="success" dot>Active</Tag>
          <Tag variant="warning">Pending</Tag>
          <Tag variant="error">Overdue</Tag>
          <Tag variant="info">Info</Tag>

        <div className="lbl">Badges</div>

          <span style={{position:'relative',display:'inline-flex'}}>
            <span style={{width:40,height:40,borderRadius:12,background:'var(--tf-grey-100)',display:'inline-block'}}></span>

        <div className="row">

          <Avatar initials="TF" size="md" />
          <Avatar initials="MO" size="lg" />
          <Avatar initials="O2" size="xl" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
