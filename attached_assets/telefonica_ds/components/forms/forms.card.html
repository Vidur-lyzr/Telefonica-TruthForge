<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body{margin:0;padding:22px;background:var(--surface-page)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:14px}
  .controls{display:flex;flex-direction:column;gap:12px}
</style></head><body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TextField, Select, Checkbox, Radio, Switch } = window.TelefNicaDesignSystem_29ea10;
function Demo(){
  const [tab,setTab]=React.useState('contract');
  return (
    <div className="grid">
      <div className="stack">
        <TextField label="Full name" defaultValue="Ana García" />
        <TextField label="Email" type="email" placeholder="you@telefonica.com" helperText="We'll send your invoice here." required />
        <TextField label="Password" type="password" defaultValue="abc" error helperText="Must be at least 8 characters." />
        <Select label="Country" defaultValue="ES">
          <option value="ES">Spain</option>
          <option value="BR">Brazil</option>
          <option value="DE">Germany</option>
          <option value="UK">United Kingdom</option>
        </Select>
      </div>
      <div className="controls">
        <Checkbox label="I accept the terms & conditions" defaultChecked />
        <Checkbox label="Send me offers" />
        <Checkbox label="Disabled option" disabled />
        <div style={{height:1,background:'var(--border-default)',margin:'2px 0'}}></div>
        <Radio name="plan" label="Contract" checked={tab==='contract'} onChange={()=>setTab('contract')} />
        <Radio name="plan" label="Prepay" checked={tab==='prepay'} onChange={()=>setTab('prepay')} />
        <div style={{height:1,background:'var(--border-default)',margin:'2px 0'}}></div>
        <Switch label="Auto-renew each month" defaultChecked />
        <Switch label="Roaming (off)" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
