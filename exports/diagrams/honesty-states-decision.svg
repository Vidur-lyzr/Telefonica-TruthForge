<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1414" viewBox="0 0 2100 1414">
<rect x="0" y="0" width="2100" height="1414" fill="#FFFFFF"/><rect x="70" y="44" width="56" height="6" rx="3" fill="#0066FF"/><text x="70" y="76" font-family="Hanken Grotesk" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0066FF">HUB SSOT · HONESTY STATES</text><text x="70" y="118" font-family="Hanken Grotesk" font-size="38" font-weight="800" fill="#031A34">How the answer status is decided — before composition</text><text x="70" y="162" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">The five states are decided deterministically, in this order, before the model writes a word. Blocked and empty outcomes carry no snippets — only a classification label — so a refusal can never leak</text>
<text x="70" y="189" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">the content it refuses to show.</text><rect x="110" y="256" width="980" height="170" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="134" y="296" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GATE 1</text><text x="134" y="320" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Does any material clear the coverage gate?</text><text x="134" y="352" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Retrieval candidates must cover at least 33% of the query's idf mass. If nothing does — even among blocked</text>
<text x="134" y="374" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">material — there is no evidence at all. A context-aware turn router gives follow-up turns one second chance by</text>
<text x="134" y="396" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">re-entering the same governed retrieval with a resolved topical query.</text><rect x="1470" y="278" width="560" height="126" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1494" y="320" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">no_evidence</text><text x="1494" y="352" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">An honest empty-handed refusal. No model call, no snippets,</text>
<text x="1494" y="374" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">localised copy in ES/EN/DE/PT. The Hub never guesses.</text><line x1="1100" y1="341" x2="1451" y2="341" stroke="#6E7894" stroke-width="2.5"/><path d="M 1451 334.5 L 1460 341 L 1451 347.5 Z" fill="#6E7894"/><rect x="1181.9" y="307" width="196.20000000000002" height="24" rx="12" fill="#FFFFFF" stroke="#6E7894" stroke-width="1.3"/><text x="1280" y="323" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#6E7894">nothing relevant at all</text><line x1="200" y1="426" x2="200" y2="491" stroke="#0066FF" stroke-width="2.5"/><path d="M 193.5 491 L 200 500 L 206.5 491 Z" fill="#0066FF"/><rect x="214" y="451" width="58" height="24" rx="12" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="243" y="467" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">else</text><rect x="110" y="500" width="980" height="148" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="134" y="540" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GATE 2</text><text x="134" y="564" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Is any relevant material within the persona's clearance and area?</text><text x="134" y="596" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Relevant chunks exist, but every one of them is above the persona's clearance or outside its area scope. The</text>
<text x="134" y="618" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">block names the failing axis (clearance or area) without revealing anything about the content.</text><rect x="1470" y="511" width="560" height="126" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1494" y="553" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">permission_blocked</text><text x="1494" y="585" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Refused before any model call, with zero citations and zero</text>
<text x="1494" y="607" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">snippets — only the classification and the blocking axis.</text><line x1="1100" y1="574" x2="1451" y2="574" stroke="#D73241" stroke-width="2.5"/><path d="M 1451 567.5 L 1460 574 L 1451 580.5 Z" fill="#D73241"/><rect x="1178.2" y="540" width="203.60000000000002" height="24" rx="12" fill="#FFFFFF" stroke="#D73241" stroke-width="1.3"/><text x="1280" y="556" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#D73241">relevant, none permitted</text><line x1="200" y1="648" x2="200" y2="713" stroke="#0066FF" stroke-width="2.5"/><path d="M 193.5 713 L 200 722 L 206.5 713 Z" fill="#0066FF"/><rect x="214" y="673" width="58" height="24" rx="12" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="243" y="689" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">else</text><rect x="110" y="722" width="980" height="148" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="134" y="762" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GATE 3</text><text x="134" y="786" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Do the top two permitted sources contradict each other?</text><text x="134" y="818" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Machine-checkable assertions (same metric + same period, different value) are compared across the top two</text>
<text x="134" y="840" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">permitted sources only. A disagreement is surfaced, never silently reconciled.</text><rect x="1470" y="733" width="560" height="126" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1494" y="775" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">conflict</text><text x="1494" y="807" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Both sources are shown side by side with their values,</text>
<text x="1494" y="829" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">versions and owners, plus a resolution path. No model call.</text><line x1="1100" y1="796" x2="1451" y2="796" stroke="#B0740B" stroke-width="2.5"/><path d="M 1451 789.5 L 1460 796 L 1451 802.5 Z" fill="#B0740B"/><rect x="1185.6" y="762" width="188.8" height="24" rx="12" fill="#FFFFFF" stroke="#B0740B" stroke-width="1.3"/><text x="1280" y="778" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#B0740B">top-2 sources disagree</text><line x1="200" y1="870" x2="200" y2="935" stroke="#0066FF" stroke-width="2.5"/><path d="M 193.5 935 L 200 944 L 206.5 935 Z" fill="#0066FF"/><rect x="214" y="895" width="58" height="24" rx="12" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="243" y="911" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">else</text><rect x="110" y="944" width="980" height="148" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="134" y="984" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GATE 4</text><text x="134" y="1008" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Is the best evidence still the current version?</text><text x="134" y="1040" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Expired documents are hard-dropped at rerank. If the best remaining source has been superseded by a newer</text>
<text x="134" y="1062" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">version, the answer is still composed — but flagged as historic with a pointer to the current document.</text><rect x="1470" y="944" width="560" height="148" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1494" y="986" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">historic</text><text x="1494" y="1018" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">An answered response carrying an explicit historic flag, note</text>
<text x="1494" y="1040" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">and pointer — old truth is labelled, never passed off as</text>
<text x="1494" y="1062" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">current.</text><line x1="1100" y1="1018" x2="1451" y2="1018" stroke="#B0740B" stroke-width="2.5"/><path d="M 1451 1011.5 L 1460 1018 L 1451 1024.5 Z" fill="#B0740B"/><rect x="1185.6" y="984" width="188.8" height="24" rx="12" fill="#FFFFFF" stroke="#B0740B" stroke-width="1.3"/><text x="1280" y="1000" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#B0740B">best source superseded</text><line x1="200" y1="1092" x2="200" y2="1157" stroke="#0066FF" stroke-width="2.5"/><path d="M 193.5 1157 L 200 1166 L 206.5 1157 Z" fill="#0066FF"/><rect x="214" y="1117" width="58" height="24" rx="12" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="243" y="1133" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">else</text><rect x="110" y="1166" width="980" height="148" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="134" y="1206" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">COMPOSE</text><text x="134" y="1230" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Only now does Claude write</text><text x="134" y="1262" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">The model receives only the permitted, current, consistent chunks and must cite every claim. Markers are verified</text>
<text x="134" y="1284" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">and renumbered after composition; the retrieval audit entry is finalised with the outcome.</text><rect x="1470" y="1177" width="560" height="126" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1494" y="1219" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">answered</text><text x="1494" y="1251" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">A cited answer where every claim is bound to a governed source</text>
<text x="1494" y="1273" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">the persona is cleared to read.</text><line x1="1100" y1="1240" x2="1451" y2="1240" stroke="#008535" stroke-width="2.5"/><path d="M 1451 1233.5 L 1460 1240 L 1451 1246.5 Z" fill="#008535"/><rect x="1178.2" y="1206" width="203.60000000000002" height="24" rx="12" fill="#FFFFFF" stroke="#008535" stroke-width="1.3"/><text x="1280" y="1222" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#008535">clean permitted evidence</text><text x="70" y="1374" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">Statuses: answered · no_evidence · permission_blocked · conflict · historic — decided deterministically in the ask agent, upstream of composition.</text><text x="2030" y="1374" text-anchor="end" font-family="Hanken Grotesk" font-size="13.5" font-weight="700" fill="#0066FF">Telefónica · Hub SSoT</text>
</svg>