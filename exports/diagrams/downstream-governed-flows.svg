<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="762" viewBox="0 0 2520 762">
<rect x="0" y="0" width="2520" height="762" fill="#FFFFFF"/><rect x="70" y="44" width="56" height="6" rx="3" fill="#0066FF"/><text x="70" y="76" font-family="Hanken Grotesk" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0066FF">HUB SSOT · DOWNSTREAM GOVERNANCE</text><text x="70" y="118" font-family="Hanken Grotesk" font-size="38" font-weight="800" fill="#031A34">The same guarantees downstream — generation, export, review</text><text x="70" y="162" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">Everything built on top of retrieval re-applies the same rules server-side: permissions resolve before retrieval, destination confidentiality caps what the model can see, deterministic rules outrank the model, and approvals are</text>
<text x="70" y="189" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">server-authoritative.</text><rect x="70" y="250" width="562" height="276" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="94" y="290" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GENERATE · AUDIENCE GATE</text><text x="94" y="314" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Destination caps retrieval before the model</text><circle cx="105" cy="334" r="11" fill="#0066FF"/><text x="105" y="338.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text><text x="126" y="338" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Audience chosen: internal or external</text><circle cx="105" cy="368" r="11" fill="#0066FF"/><text x="105" y="372.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text><text x="126" y="372" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">External caps ALL retrieval — body and guidance — to public</text>
<text x="126" y="390" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">before the model</text><circle cx="105" cy="418" r="11" fill="#0066FF"/><text x="105" y="422.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text><text x="126" y="422" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Prior cited docs are re-validated; anything above the gate</text>
<text x="126" y="440" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">becomes a visible exclusion</text><circle cx="105" cy="468" r="11" fill="#0066FF"/><text x="105" y="472.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text><text x="126" y="472" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">KPI figures are re-derived server-side at the gated clearance</text><rect x="676" y="250" width="562" height="276" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="700" y="290" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">BRAND GUARDIAN · TWO-PASS</text><text x="700" y="314" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Deterministic rules outrank the model</text><circle cx="711" cy="334" r="11" fill="#0066FF"/><text x="711" y="338.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text><text x="732" y="338" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Pass 1: deterministic rules (no emoji, uncited figures,</text>
<text x="732" y="356" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">unapproved superlatives, required disclaimers)</text><circle cx="711" cy="384" r="11" fill="#0066FF"/><text x="711" y="388.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text><text x="732" y="388" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Error-severity rule hits decide the block status — outside the</text>
<text x="732" y="406" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">model</text><circle cx="711" cy="434" r="11" fill="#0066FF"/><text x="711" y="438.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text><text x="732" y="438" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Pass 2: the LLM can only ADD findings against the brand rules</text><circle cx="711" cy="468" r="11" fill="#0066FF"/><text x="711" y="472.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text><text x="732" y="472" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">The model can never override a deterministic block</text><rect x="1282" y="250" width="562" height="276" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1306" y="290" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">SCHEDULED DRAFTS · APPROVAL</text><text x="1306" y="314" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Nothing recurring publishes itself</text><circle cx="1317" cy="334" r="11" fill="#0066FF"/><text x="1317" y="338.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text><text x="1338" y="338" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Scheduled runs compose drafts into a review folder, never</text>
<text x="1338" y="356" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">publish</text><circle cx="1317" cy="384" r="11" fill="#0066FF"/><text x="1317" y="388.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text><text x="1338" y="388" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Approval is keyed server-side by draft id + content hash</text><circle cx="1317" cy="418" r="11" fill="#0066FF"/><text x="1317" y="422.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text><text x="1338" y="422" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Any edit changes the hash and voids the approval</text><circle cx="1317" cy="452" r="11" fill="#0066FF"/><text x="1317" y="456.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text><text x="1338" y="456" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Client approval flags are never trusted</text><rect x="1888" y="250" width="562" height="276" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1912" y="290" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">EXPORT · FINAL GATES</text><text x="1912" y="314" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">The exporter re-checks everything</text><circle cx="1923" cy="334" r="11" fill="#0066FF"/><text x="1923" y="338.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text><text x="1944" y="338" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Guardian re-run at export time — a blocked draft cannot leave</text><circle cx="1923" cy="368" r="11" fill="#0066FF"/><text x="1923" y="372.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text><text x="1944" y="372" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Citation confidentiality re-derived from the server corpus,</text>
<text x="1944" y="390" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">never from client labels</text><circle cx="1923" cy="418" r="11" fill="#0066FF"/><text x="1923" y="422.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text><text x="1944" y="422" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">External destination refused if any cited source is not public</text><circle cx="1923" cy="452" r="11" fill="#0066FF"/><text x="1923" y="456.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text><text x="1944" y="456" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Internal-only sections, spokesperson guidance and Q&amp;A internal</text>
<text x="1944" y="474" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">notes stripped for external outputs</text><rect x="70" y="564" width="2380" height="114" rx="16" fill="#E5F0FF"/><text x="94" y="594" font-family="Hanken Grotesk" font-size="13" font-weight="800" letter-spacing="2" fill="#0066FF">SHARED FOUNDATIONS</text><rect x="94" y="614" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="624" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">One access resolver — every flow decides access through the same area × clearance rule as Ask</text><rect x="1260" y="614" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="624" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Fail closed — a citation whose source document is missing is treated as inaccessible</text><rect x="94" y="654" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="664" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Server-authoritative — gates re-derive truth from the governed corpus; client labels are never trusted</text><rect x="1260" y="654" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="664" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Generated outputs re-enter the corpus as governed documents, clamped to their most restrictive source</text><text x="70" y="722" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">Each column is an actual code path: the generate agent's destination gate, the Brand Guardian two-pass agent, the schedule runner's approval registry and the export service's gate chain.</text><text x="2450" y="722" text-anchor="end" font-family="Hanken Grotesk" font-size="13.5" font-weight="700" fill="#0066FF">Telefónica · Hub SSoT</text>
</svg>