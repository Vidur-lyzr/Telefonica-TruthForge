<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="755" viewBox="0 0 2520 755">
<rect x="0" y="0" width="2520" height="755" fill="#FFFFFF"/><rect x="70" y="44" width="56" height="6" rx="3" fill="#0066FF"/><text x="70" y="76" font-family="Hanken Grotesk" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0066FF">HUB SSOT · CORPUS &amp; INDEX</text><text x="70" y="118" font-family="Hanken Grotesk" font-size="38" font-weight="800" fill="#031A34">Documents to index — embeddings once, tags after</text><text x="70" y="162" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">The index is built so that governance and taxonomy live entirely in metadata. Vectors are computed once and never again: access-label changes and strategy re-tags are payload updates, not re-ingestion, re-embedding or redeployment.</text><rect x="70" y="223" width="424" height="296" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="94" y="263" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">1 · GOVERNED DOCUMENTS</text><text x="94" y="287" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">The data universe</text><text x="94" y="319" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Internal (A), external (B) and SSoT-generated</text>
<text x="94" y="341" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">(E) documents, each carrying the full</text>
<text x="94" y="363" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">mandatory metadata: country, brand, legal</text>
<text x="94" y="385" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">entity, period, type, confidentiality, owner</text>
<text x="94" y="407" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">and validity. External sources are filtered</text>
<text x="94" y="429" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">before ingestion, never dumped.</text><line x1="502" y1="371" x2="541" y2="371" stroke="#0066FF" stroke-width="2.5"/><path d="M 541 364.5 L 550 371 L 541 377.5 Z" fill="#0066FF"/><rect x="558" y="223" width="424" height="296" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="582" y="263" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">2 · CHUNKS</text><text x="582" y="287" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Retrieval units with provenance</text><text x="582" y="319" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Each document is split into chunks with a</text>
<text x="582" y="341" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">heading and a breadcrumb back to the exact</text>
<text x="582" y="363" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">location in the source (document, section,</text>
<text x="582" y="385" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">slide), so every citation can point to a real</text>
<text x="582" y="407" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">place.</text><line x1="990" y1="371" x2="1029" y2="371" stroke="#0066FF" stroke-width="2.5"/><path d="M 1029 364.5 L 1038 371 L 1029 377.5 Z" fill="#0066FF"/><rect x="1046" y="223" width="424" height="296" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1070" y="263" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">3 · EMBEDDINGS — COMPUTED ONCE</text><text x="1070" y="287" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Taxonomy-agnostic vectors</text><text x="1070" y="319" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Each chunk gets a dense semantic vector and a</text>
<text x="1070" y="341" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">sparse BM25 vector from the same multilingual</text>
<text x="1070" y="363" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">tokenizer (accent folding, ES/DE/PT synonym</text>
<text x="1070" y="385" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">map). Vectors encode only the text — no tags,</text>
<text x="1070" y="407" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">no labels.</text><line x1="1478" y1="371" x2="1517" y2="371" stroke="#0066FF" stroke-width="2.5"/><path d="M 1517 364.5 L 1526 371 L 1517 377.5 Z" fill="#0066FF"/><rect x="1534" y="223" width="424" height="296" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1558" y="263" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">4 · PAYLOAD TAGS — APPLIED AFTER</text><text x="1558" y="287" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Governance lives in metadata</text><text x="1558" y="319" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Confidentiality, area scope, axis</text>
<text x="1558" y="341" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">assignments, topics and the taxonomy version</text>
<text x="1558" y="363" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">are attached to each point as payload — after</text>
<text x="1558" y="385" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">embedding. These payload fields are exactly</text>
<text x="1558" y="407" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">what the early-binding query filters on.</text><line x1="1966" y1="371" x2="2005" y2="371" stroke="#0066FF" stroke-width="2.5"/><path d="M 2005 364.5 L 2014 371 L 2005 377.5 Z" fill="#0066FF"/><rect x="2022" y="223" width="424" height="296" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="2046" y="263" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">5 · CHANGE = PAYLOAD UPDATE</text><text x="2046" y="287" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">No re-embedding, ever</text><text x="2046" y="319" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">A source label change (sensitivity sync) or a</text>
<text x="2046" y="341" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">strategy re-tag is a payload-only update on</text>
<text x="2046" y="363" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">existing points. The index commits first,</text>
<text x="2046" y="385" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">then the local taxonomy version — vectors are</text>
<text x="2046" y="407" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">never recomputed.</text><rect x="2046" y="411" width="76.4" height="25" rx="12.5" fill="#008535" fill-opacity="0.12" stroke="#008535" stroke-width="1.2"/><text x="2059" y="428" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#008535">re-tag</text><text x="2134.4" y="428" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="rgba(255,255,255,0.75)">metadata only</text><rect x="2046" y="445" width="110" height="25" rx="12.5" fill="#008535" fill-opacity="0.12" stroke="#008535" stroke-width="1.2"/><text x="2059" y="462" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#008535">label sync</text><text x="2168" y="462" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="rgba(255,255,255,0.75)">metadata only</text><rect x="70" y="557" width="2380" height="114" rx="16" fill="#E5F0FF"/><text x="94" y="587" font-family="Hanken Grotesk" font-size="13" font-weight="800" letter-spacing="2" fill="#0066FF">WHY THIS SHAPE</text><rect x="94" y="607" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="617" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Early binding needs labels in the index — payload tags are what the access filters match on</text><rect x="1260" y="607" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="617" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Re-tagging without re-embedding — vectors are agnostic to taxonomy, so strategy changes stay configuration</text><rect x="94" y="647" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="657" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Live-ingested documents persist their full governed payload, so a restart rebuilds the corpus from the index</text><rect x="1260" y="647" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="657" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">One tokenizer at seed and query time — cross-language matching carries into the index unchanged</text><text x="70" y="715" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">Each stage is an actual code path: the corpus model, chunk registry, seed pipeline, sparse/dense encoders and the payload-update operations in the vector-store adapter.</text><text x="2450" y="715" text-anchor="end" font-family="Hanken Grotesk" font-size="13.5" font-weight="700" fill="#0066FF">Telefónica · Hub SSoT</text>
</svg>