<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="826" viewBox="0 0 2520 826">
<rect x="0" y="0" width="2520" height="826" fill="#FFFFFF"/><rect x="70" y="44" width="56" height="6" rx="3" fill="#0066FF"/><text x="70" y="76" font-family="Hanken Grotesk" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0066FF">HUB SSOT · ASK WORKFLOW</text><text x="70" y="118" font-family="Hanken Grotesk" font-size="38" font-weight="800" fill="#031A34">The complete Ask RAG pipeline — question to cited answer</text><text x="70" y="162" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">Every governance decision is made deterministically, in order, BEFORE the model boundary. The LLM only ever composes prose from chunks the persona was already permitted to read — it never filters, never decides access, and never sees</text>
<text x="70" y="189" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">blocked content.</text><rect x="70" y="282" width="343" height="308" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="94" y="322" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">1 · IDENTITY</text><text x="94" y="346" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Persona resolved first</text><text x="94" y="378" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">The roleId resolves to area +</text>
<text x="94" y="400" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">clearance (the user axis). A</text>
<text x="94" y="422" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">retrieval audit entry is opened</text>
<text x="94" y="444" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">before any data is touched.</text>
<text x="94" y="466" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Permission is re-resolved on every</text>
<text x="94" y="488" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">conversation turn.</text><line x1="421" y1="436" x2="460" y2="436" stroke="#0066FF" stroke-width="2.5"/><path d="M 460 429.5 L 469 436 L 460 442.5 Z" fill="#0066FF"/><rect x="477" y="282" width="343" height="308" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="501" y="322" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">2 · GOVERNED RETRIEVAL</text><text x="501" y="346" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Filters inside the search</text><text x="501" y="378" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Hybrid retrieval (dense + sparse</text>
<text x="501" y="400" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">BM25, RRF fusion) with clearance</text>
<text x="501" y="422" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">and area injected as must-filters</text>
<text x="501" y="444" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">into the query itself. A</text>
<text x="501" y="466" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">blocked-side probe returns ids only</text>
<text x="501" y="488" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">— never snippets.</text><line x1="828" y1="436" x2="867" y2="436" stroke="#0066FF" stroke-width="2.5"/><path d="M 867 429.5 L 876 436 L 867 442.5 Z" fill="#0066FF"/><rect x="884" y="282" width="343" height="308" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="908" y="322" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">3 · RELEVANCE GATE</text><text x="908" y="346" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Coverage, not raw score</text><text x="908" y="378" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">A chunk counts as relevant only if</text>
<text x="908" y="400" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">it covers at least 33% of the</text>
<text x="908" y="422" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">query's idf mass (COVERAGE_MIN).</text>
<text x="908" y="444" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Generic brand words cannot make an</text>
<text x="908" y="466" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">unrelated document look like an</text>
<text x="908" y="488" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">answer.</text><line x1="1235" y1="436" x2="1274" y2="436" stroke="#0066FF" stroke-width="2.5"/><path d="M 1274 429.5 L 1283 436 L 1274 442.5 Z" fill="#0066FF"/><rect x="1291" y="282" width="343" height="308" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1315" y="322" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">4 · STATUS DECISION</text><text x="1315" y="346" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Deterministic honesty states</text><text x="1315" y="378" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Decided before any model call, with</text>
<text x="1315" y="400" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">no snippets attached:</text><rect x="1315" y="404" width="118.4" height="25" rx="12.5" fill="#6E7894" fill-opacity="0.12" stroke="#6E7894" stroke-width="1.2"/><text x="1328" y="421" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#6E7894">no_evidence</text><text x="1445.4" y="421" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="rgba(255,255,255,0.75)">no model call</text><rect x="1315" y="438" width="177.20000000000002" height="25" rx="12.5" fill="#D73241" fill-opacity="0.12" stroke="#D73241" stroke-width="1.2"/><text x="1328" y="455" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#D73241">permission_blocked</text><text x="1504.2" y="455" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="rgba(255,255,255,0.75)">no model call</text><rect x="1315" y="472" width="93.2" height="25" rx="12.5" fill="#B0740B" fill-opacity="0.12" stroke="#B0740B" stroke-width="1.2"/><text x="1328" y="489" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#B0740B">conflict</text><text x="1420.2" y="489" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="rgba(255,255,255,0.75)">no model call</text><rect x="1315" y="506" width="93.2" height="25" rx="12.5" fill="#B0740B" fill-opacity="0.12" stroke="#B0740B" stroke-width="1.2"/><text x="1328" y="523" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#B0740B">historic</text><text x="1420.2" y="523" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="rgba(255,255,255,0.75)">flagged, not hidden</text><line x1="1642" y1="436" x2="1681" y2="436" stroke="#0066FF" stroke-width="2.5"/><path d="M 1681 429.5 L 1690 436 L 1681 442.5 Z" fill="#0066FF"/><rect x="1698" y="282" width="343" height="308" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1722" y="322" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#0066FF">5 · COMPOSITION</text><text x="1722" y="346" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Claude writes from permitted</text>
<text x="1722" y="370" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">evidence only</text><text x="1722" y="402" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">The model receives only permitted</text>
<text x="1722" y="424" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">chunks plus governed side-channel</text>
<text x="1722" y="446" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">facts (numeric zone, knowledge</text>
<text x="1722" y="468" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">graph) and must cite every claim</text>
<text x="1722" y="490" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">with [S#] markers.</text><line x1="2049" y1="436" x2="2088" y2="436" stroke="#0066FF" stroke-width="2.5"/><path d="M 2088 429.5 L 2097 436 L 2088 442.5 Z" fill="#0066FF"/><rect x="2105" y="282" width="343" height="308" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="2129" y="322" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#0066FF">6 · CITATION INTEGRITY + AUDIT</text><text x="2129" y="346" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Markers verified, audit</text>
<text x="2129" y="370" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">closed</text><text x="2129" y="402" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Citation markers are parsed</text>
<text x="2129" y="424" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">(including composites like [S1,</text>
<text x="2129" y="446" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">S2]), hallucinated markers</text>
<text x="2129" y="468" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">stripped, and the rest renumbered</text>
<text x="2129" y="490" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">contiguously. The audit entry is</text>
<text x="2129" y="512" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">finalised with the outcome.</text><rect x="2129" y="516" width="93.2" height="25" rx="12.5" fill="#008535" fill-opacity="0.12" stroke="#008535" stroke-width="1.2"/><text x="2142" y="533" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#008535">answered</text><text x="2234.2" y="533" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">every claim cited and permitted</text><line x1="1666" y1="236" x2="1666" y2="620" stroke="#D73241" stroke-width="2.5" stroke-dasharray="8 7"/><text x="1666" y="258" text-anchor="middle" font-family="Hanken Grotesk" font-size="14.5" font-weight="800" letter-spacing="1.6" fill="#D73241">LLM BOUNDARY</text><text x="1666" y="642" text-anchor="middle" font-family="Hanken Grotesk" font-size="13.5" font-weight="500" fill="#D73241">No content crosses this line unless the persona is cleared to read it</text><rect x="70" y="628" width="2380" height="114" rx="16" fill="#E5F0FF"/><text x="94" y="658" font-family="Hanken Grotesk" font-size="13" font-weight="800" letter-spacing="2" fill="#0066FF">WHERE EACH GUARANTEE LIVES</text><rect x="94" y="678" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="688" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Early binding — access filters are part of the vector search, not a post-filter (stage 2)</text><rect x="1260" y="678" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="688" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">The LLM never filters — refusals return before the model boundary, with no snippets (stage 4)</text><rect x="94" y="718" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="728" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">No false relevance — the coverage gate starves red-herring matches (stage 3)</text><rect x="1260" y="718" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="728" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Citation integrity — text markers and citation chips can never desync (stage 6)</text><text x="70" y="786" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">Each stage is an actual code path: governance resolver, governed retrieval front door, coverage gate, status decision and citation pipeline in the ask agent.</text><text x="2450" y="786" text-anchor="end" font-family="Hanken Grotesk" font-size="13.5" font-weight="700" fill="#0066FF">Telefónica · Hub SSoT</text>
</svg>