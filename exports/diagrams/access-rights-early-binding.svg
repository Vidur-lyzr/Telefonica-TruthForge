<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="1095" viewBox="0 0 2520 1095">
<rect x="0" y="0" width="2520" height="1095" fill="#FFFFFF"/><rect x="70" y="44" width="56" height="6" rx="3" fill="#0066FF"/><text x="70" y="76" font-family="Hanken Grotesk" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0066FF">PC2 · ACCESS RIGHTS</text><text x="70" y="118" font-family="Hanken Grotesk" font-size="38" font-weight="800" fill="#031A34">Access rights — early-binding access control</text><text x="70" y="162" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">Access = the intersection of two axes (user axis × document axis), applied at index / retrieval time — never filtered by the agent or the LLM. If a user lacks permission, a chunk never enters the model context.</text><line x1="136" y1="219" x2="136" y2="423" stroke="#DDDDDD" stroke-width="2"/><text transform="rotate(-90 96 321)" x="96" y="321" text-anchor="middle" font-family="Hanken Grotesk" font-size="15" font-weight="800" letter-spacing="2.4" fill="#031A34">RFP TARGET</text><text transform="rotate(-90 122 321)" x="122" y="321" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="400" fill="#6E7894">what PC2 requires</text><line x1="136" y1="521" x2="136" y2="773" stroke="#DDDDDD" stroke-width="2"/><text transform="rotate(-90 96 647)" x="96" y="647" text-anchor="middle" font-family="Hanken Grotesk" font-size="15" font-weight="800" letter-spacing="2.4" fill="#031A34">HUB SSOT DEMO</text><text transform="rotate(-90 122 647)" x="122" y="647" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="400" fill="#6E7894">current implementation</text><rect x="240" y="213" width="390" height="216" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="264" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">USER AXIS</text><text x="264" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Entra ID groups</text><text x="264" y="309" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">The user's area and profile</text>
<text x="264" y="331" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">(Communication, Brand, Cabinet plus</text>
<text x="264" y="353" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">subgroups) come from directory group</text>
<text x="264" y="375" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">membership.</text><rect x="240" y="515" width="390" height="264" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="264" y="557" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Personas / roles</text><text x="264" y="589" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">The persona's roleId resolves to area +</text>
<text x="264" y="611" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">clearance, e.g. Communications Director</text>
<text x="264" y="633" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">maps to Comunicación with confidential</text>
<text x="264" y="655" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">clearance.</text><line x1="638" y1="321" x2="677" y2="321" stroke="#0066FF" stroke-width="2.5"/><path d="M 677 314.5 L 686 321 L 677 327.5 Z" fill="#0066FF"/><line x1="638" y1="647" x2="677" y2="647" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 677 640.5 L 686 647 L 677 653.5 Z" fill="#9AA6B8"/><line x1="435" y1="435" x2="435" y2="509" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 429.5 501 L 435 509 L 440.5 501 Z" fill="#0066FF"/><rect x="396.4" y="459" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="435" y="476.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="694" y="213" width="390" height="216" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="718" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">DOCUMENT AXIS</text><text x="718" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Sensitivity labels (Purview / MIP)</text><text x="718" y="309" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Each document carries a confidentiality</text>
<text x="718" y="331" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">level inherited from the Microsoft</text>
<text x="718" y="353" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">source: public, private or confidential,</text>
<text x="718" y="375" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">plus group.</text><rect x="694" y="515" width="390" height="264" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="718" y="557" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Corpus confidentiality labels</text><text x="718" y="589" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Every governed document is labelled</text>
<text x="718" y="611" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">public, private, confidential or</text>
<text x="718" y="633" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">off_the_record, and carries its area</text>
<text x="718" y="655" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">scope (Comunicación, Marca, Gabinete).</text><line x1="1092" y1="321" x2="1131" y2="321" stroke="#0066FF" stroke-width="2.5"/><path d="M 1131 314.5 L 1140 321 L 1131 327.5 Z" fill="#0066FF"/><line x1="1092" y1="647" x2="1131" y2="647" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 1131 640.5 L 1140 647 L 1131 653.5 Z" fill="#9AA6B8"/><line x1="889" y1="435" x2="889" y2="509" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 883.5 501 L 889 509 L 894.5 501 Z" fill="#0066FF"/><rect x="850.4" y="459" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="889" y="476.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="1148" y="213" width="390" height="216" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1172" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">EARLY BINDING</text><text x="1172" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Intersection inside the index</text>
<text x="1172" y="301" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">query</text><text x="1172" y="333" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Both axes intersect at retrieval time:</text>
<text x="1172" y="355" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">permissions are part of the search</text>
<text x="1172" y="377" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">itself, not a post-filter applied by the</text>
<text x="1172" y="399" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">agent.</text><rect x="1148" y="515" width="390" height="264" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1172" y="557" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Filters inside the vector search</text><text x="1172" y="589" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Clearance and area become payload</text>
<text x="1172" y="611" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">must-filters injected into the Qdrant</text>
<text x="1172" y="633" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">hybrid query (dense + sparse, RRF fusion)</text>
<text x="1172" y="655" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">— the governance filter is the query.</text><line x1="1546" y1="321" x2="1585" y2="321" stroke="#0066FF" stroke-width="2.5"/><path d="M 1585 314.5 L 1594 321 L 1585 327.5 Z" fill="#0066FF"/><line x1="1546" y1="647" x2="1585" y2="647" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 1585 640.5 L 1594 647 L 1585 653.5 Z" fill="#9AA6B8"/><line x1="1343" y1="435" x2="1343" y2="509" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 1337.5 501 L 1343 509 L 1348.5 501 Z" fill="#0066FF"/><rect x="1304.4" y="459" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="1343" y="476.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="1602" y="213" width="390" height="216" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1626" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">NO CONTEXT ENTRY</text><text x="1626" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Unpermitted chunks never reach the</text>
<text x="1626" y="301" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">model</text><text x="1626" y="333" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Even if retrieval finds a chunk, without</text>
<text x="1626" y="355" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">permission it does not enter the context.</text>
<text x="1626" y="377" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">The agent / LLM never decides or filters.</text><rect x="1602" y="515" width="390" height="264" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1626" y="557" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Blocked hits are ids only</text><text x="1626" y="589" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Unpermitted chunks are never returned by</text>
<text x="1626" y="611" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">the search. A blocked-side probe yields</text>
<text x="1626" y="633" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">ids only — used solely to label a</text>
<text x="1626" y="655" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">refusal, never snippets — and a</text>
<text x="1626" y="677" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">live-label re-check fails closed.</text><line x1="2000" y1="321" x2="2039" y2="321" stroke="#0066FF" stroke-width="2.5"/><path d="M 2039 314.5 L 2048 321 L 2039 327.5 Z" fill="#0066FF"/><line x1="2000" y1="647" x2="2039" y2="647" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 2039 640.5 L 2048 647 L 2039 653.5 Z" fill="#9AA6B8"/><line x1="1797" y1="435" x2="1797" y2="509" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 1791.5 501 L 1797 509 L 1802.5 501 Z" fill="#0066FF"/><rect x="1758.4" y="459" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="1797" y="476.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="2056" y="213" width="390" height="216" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="2080" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GOVERNED OUTCOME</text><text x="2080" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Answer or honest refusal</text><text x="2080" y="309" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">The user receives evidence they are</text>
<text x="2080" y="331" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">permitted to see, or an explicit refusal</text>
<text x="2080" y="353" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">— decided upstream of the model.</text><rect x="2056" y="515" width="390" height="264" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="2080" y="557" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Decision before any model call</text><text x="2080" y="589" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Refusals return before any Claude call</text>
<text x="2080" y="611" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">and carry no snippets — only a</text>
<text x="2080" y="633" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">classification label.</text><rect x="2080" y="637" width="93.2" height="25" rx="12.5" fill="#008535" fill-opacity="0.12" stroke="#008535" stroke-width="1.2"/><text x="2093" y="654" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#008535">answered</text><text x="2185.2" y="654" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">cited, permitted evidence</text><rect x="2080" y="671" width="177.20000000000002" height="25" rx="12.5" fill="#D73241" fill-opacity="0.12" stroke="#D73241" stroke-width="1.2"/><text x="2093" y="688" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#D73241">permission_blocked</text><text x="2269.2" y="688" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">no model call</text><rect x="2080" y="705" width="118.4" height="25" rx="12.5" fill="#6E7894" fill-opacity="0.12" stroke="#6E7894" stroke-width="1.2"/><text x="2093" y="722" font-family="Hanken Grotesk" font-size="13.5" font-weight="600" fill="#6E7894">no_evidence</text><text x="2210.4" y="722" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">no model call</text><line x1="2251" y1="435" x2="2251" y2="509" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 2245.5 501 L 2251 509 L 2256.5 501 Z" fill="#0066FF"/><rect x="2212.4" y="459" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="2251" y="476.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="70" y="817" width="2380" height="194" rx="16" fill="#E5F0FF"/><text x="94" y="847" font-family="Hanken Grotesk" font-size="13" font-weight="800" letter-spacing="2" fill="#0066FF">TARGET ↔ DEMO MAPPING</text><rect x="94" y="867" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="877" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Entra ID groups ↔ demo personas / roles (roleId → area + clearance)</text><rect x="1260" y="867" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="877" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Purview / MIP sensitivity labels ↔ corpus levels public · private · confidential · off_the_record</text><rect x="94" y="907" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="917" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">ACL enforced in the search index ↔ clearance + area payload filters inside the Qdrant query</text><rect x="1260" y="907" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="917" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">“The agent/LLM never filters” ↔ permission_blocked / no_evidence returned before the Claude call</text><text x="70" y="1055" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">Every demo component corresponds to an actual code path in the Hub SSoT implementation (governance resolver, governed retrieval front door, ask agent).</text><text x="2450" y="1055" text-anchor="end" font-family="Hanken Grotesk" font-size="13.5" font-weight="700" fill="#0066FF">Telefónica · Hub SSoT</text>
</svg>