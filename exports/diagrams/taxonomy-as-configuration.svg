<svg xmlns="http://www.w3.org/2000/svg" width="2520" height="1105" viewBox="0 0 2520 1105">
<rect x="0" y="0" width="2520" height="1105" fill="#FFFFFF"/><rect x="70" y="44" width="56" height="6" rx="3" fill="#0066FF"/><text x="70" y="76" font-family="Hanken Grotesk" font-size="15" font-weight="700" letter-spacing="2.4" fill="#0066FF">PC2 · TAXONOMY / TAGGING</text><text x="70" y="118" font-family="Hanken Grotesk" font-size="38" font-weight="800" fill="#031A34">Taxonomy and tagging — configuration, not code</text><text x="70" y="162" font-family="Hanken Grotesk" font-size="19" font-weight="400" fill="#6E7894">Two taxonomy layers, versioned as configuration and applied after embedding. Embeddings are taxonomy-agnostic, so re-tagging never requires re-ingestion, re-embedding, redeployment — or IT.</text><line x1="136" y1="219" x2="136" y2="475" stroke="#DDDDDD" stroke-width="2"/><text transform="rotate(-90 96 347)" x="96" y="347" text-anchor="middle" font-family="Hanken Grotesk" font-size="15" font-weight="800" letter-spacing="2.4" fill="#031A34">RFP TARGET</text><text transform="rotate(-90 122 347)" x="122" y="347" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="400" fill="#6E7894">what PC2 requires</text><line x1="136" y1="573" x2="136" y2="783" stroke="#DDDDDD" stroke-width="2"/><text transform="rotate(-90 96 678)" x="96" y="678" text-anchor="middle" font-family="Hanken Grotesk" font-size="15" font-weight="800" letter-spacing="2.4" fill="#031A34">HUB SSOT DEMO</text><text transform="rotate(-90 122 678)" x="122" y="678" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="400" fill="#6E7894">current implementation</text><rect x="240" y="213" width="390" height="268" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="264" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">TWO LAYERS</text><text x="264" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Deterministic + derived</text><text x="264" y="309" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Deterministic: what the document IS —</text>
<text x="264" y="331" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">market, brand, owner, confidentiality,</text>
<text x="264" y="353" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">validity. Derived: what it SAYS — plan</text>
<text x="264" y="375" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">axes, topics, entities; the layer that</text>
<text x="264" y="397" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">changes with strategy.</text><rect x="240" y="567" width="390" height="222" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="264" y="609" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Document metadata</text><text x="264" y="641" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Deterministic fields live on every</text>
<text x="264" y="663" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">governed doc (country, brand, owner,</text>
<text x="264" y="685" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">confidentiality, validity). Derived tags</text>
<text x="264" y="707" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">are axisIds + topics — the part a re-tag</text>
<text x="264" y="729" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">rewrites.</text><line x1="638" y1="347" x2="677" y2="347" stroke="#0066FF" stroke-width="2.5"/><path d="M 677 340.5 L 686 347 L 677 353.5 Z" fill="#0066FF"/><line x1="638" y1="678" x2="677" y2="678" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 677 671.5 L 686 678 L 677 684.5 Z" fill="#9AA6B8"/><line x1="435" y1="487" x2="435" y2="561" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 429.5 553 L 435 561 L 440.5 553 Z" fill="#0066FF"/><rect x="396.4" y="511" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="435" y="528.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="694" y="213" width="390" height="268" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="718" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">TAGS AS CONFIGURATION</text><text x="718" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Versioned metadata, applied after</text>
<text x="718" y="301" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">embedding</text><text x="718" y="333" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Tags don't live in the code: they are</text>
<text x="718" y="355" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">configuration, versioned, applied after</text>
<text x="718" y="377" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">embedding. Embeddings are calculated once</text>
<text x="718" y="399" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">and stay agnostic to the taxonomy.</text><rect x="694" y="567" width="390" height="222" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="718" y="609" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Versioned taxonomy store</text><text x="718" y="641" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Taxonomy versions are governance</text>
<text x="718" y="663" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">configuration (seed corpus = v4; each</text>
<text x="718" y="685" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">applied edit creates v5, v6, …) with</text>
<text x="718" y="707" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">actor, note and audit trail. Chunks and</text>
<text x="718" y="729" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">vectors stay untouched.</text><line x1="1092" y1="347" x2="1131" y2="347" stroke="#0066FF" stroke-width="2.5"/><path d="M 1131 340.5 L 1140 347 L 1131 353.5 Z" fill="#0066FF"/><line x1="1092" y1="678" x2="1131" y2="678" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 1131 671.5 L 1140 678 L 1131 684.5 Z" fill="#9AA6B8"/><line x1="889" y1="487" x2="889" y2="561" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 883.5 553 L 889 561 L 894.5 553 Z" fill="#0066FF"/><rect x="850.4" y="511" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="889" y="528.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="1148" y="213" width="390" height="268" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1172" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GOVERNED RE-TAG FLOW</text><text x="1172" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">Strategy edited from a governance</text>
<text x="1172" y="301" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">panel</text><circle cx="1183" cy="321" r="11" fill="#0066FF"/><text x="1183" y="325.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text><text x="1204" y="325" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Editing — the strategy change</text><circle cx="1183" cy="355" r="11" fill="#0066FF"/><text x="1183" y="359.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text><text x="1204" y="359" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Mapping table of affected documents</text><circle cx="1183" cy="389" r="11" fill="#0066FF"/><text x="1183" y="393.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text><text x="1204" y="393" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Assisted zero-shot re-classification</text><circle cx="1183" cy="423" r="11" fill="#0066FF"/><text x="1183" y="427.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text><text x="1204" y="427" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="rgba(255,255,255,0.9)">Human validation</text><rect x="1148" y="567" width="390" height="222" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1172" y="609" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">The same four steps in the demo</text><circle cx="1183" cy="629" r="11" fill="#E5F0FF"/><text x="1183" y="633.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#0066FF">1</text><text x="1204" y="633" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="#031A34">Axis edit in the governance panel</text><circle cx="1183" cy="663" r="11" fill="#E5F0FF"/><text x="1183" y="667.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#0066FF">2</text><text x="1204" y="667" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="#031A34">Candidate mapping table per axis</text><circle cx="1183" cy="697" r="11" fill="#E5F0FF"/><text x="1183" y="701.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#0066FF">3</text><text x="1204" y="701" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="#031A34">Claude-assisted re-tag proposals</text><circle cx="1183" cy="731" r="11" fill="#E5F0FF"/><text x="1183" y="735.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="700" fill="#0066FF">4</text><text x="1204" y="735" font-family="Hanken Grotesk" font-size="14.5" font-weight="500" fill="#031A34">Human accepts / rejects each proposal</text><line x1="1546" y1="347" x2="1585" y2="347" stroke="#0066FF" stroke-width="2.5"/><path d="M 1585 340.5 L 1594 347 L 1585 353.5 Z" fill="#0066FF"/><line x1="1546" y1="678" x2="1585" y2="678" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 1585 671.5 L 1594 678 L 1585 684.5 Z" fill="#9AA6B8"/><line x1="1343" y1="487" x2="1343" y2="561" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 1337.5 553 L 1343 561 L 1348.5 553 Z" fill="#0066FF"/><rect x="1304.4" y="511" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="1343" y="528.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="1602" y="213" width="390" height="268" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="1626" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">METADATA-ONLY UPDATE</text><text x="1626" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">No re-ingestion · no re-embedding</text>
<text x="1626" y="301" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">· no redeploy · no IT</text><text x="1626" y="333" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Re-tagging existing data is a back-end</text>
<text x="1626" y="355" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">metadata operation — nothing is</text>
<text x="1626" y="377" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">re-ingested, re-embedded or redeployed.</text><rect x="1602" y="567" width="390" height="222" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="1626" y="609" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Payload update in the vector store</text><text x="1626" y="641" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">Accepted re-tags become set_payload</text>
<text x="1626" y="663" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">updates on axisIds, topics and</text>
<text x="1626" y="685" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">taxonomyVersion in Qdrant — vectors are</text>
<text x="1626" y="707" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">never recomputed. The index commits</text>
<text x="1626" y="729" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">first; only then is the version committed</text>
<text x="1626" y="751" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">locally.</text><line x1="2000" y1="347" x2="2039" y2="347" stroke="#0066FF" stroke-width="2.5"/><path d="M 2039 340.5 L 2048 347 L 2039 353.5 Z" fill="#0066FF"/><line x1="2000" y1="678" x2="2039" y2="678" stroke="#9AA6B8" stroke-width="2.5"/><path d="M 2039 671.5 L 2048 678 L 2039 684.5 Z" fill="#9AA6B8"/><line x1="1797" y1="487" x2="1797" y2="561" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 1791.5 553 L 1797 561 L 1802.5 553 Z" fill="#0066FF"/><rect x="1758.4" y="511" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="1797" y="528.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="2056" y="213" width="390" height="268" rx="16" fill="#031A34" stroke="#031A34" stroke-width="1.5"/><text x="2080" y="253" font-family="Hanken Grotesk" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#99C2FF">GOVERNED TRUTH</text><text x="2080" y="277" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">A governance operation, not a</text>
<text x="2080" y="301" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#FFFFFF">technical project</text><text x="2080" y="333" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">Changing the strategy is a configuration</text>
<text x="2080" y="355" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">change, validated by humans — not a</text>
<text x="2080" y="377" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="rgba(255,255,255,0.82)">redeployment or an IT project.</text><rect x="2056" y="567" width="390" height="222" rx="16" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/><text x="2080" y="609" font-family="Hanken Grotesk" font-size="18" font-weight="700" fill="#0066FF">Human validation is the gate</text><text x="2080" y="641" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">The agent can propose re-tags, but only</text>
<text x="2080" y="663" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">human-accepted decisions become overrides</text>
<text x="2080" y="685" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">in a committed taxonomy version — with an</text>
<text x="2080" y="707" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">audit entry recording what was applied</text>
<text x="2080" y="729" font-family="Hanken Grotesk" font-size="15.5" font-weight="400" fill="#031A34">and what was rejected.</text><line x1="2251" y1="487" x2="2251" y2="561" stroke="#0066FF" stroke-width="2" stroke-dasharray="5 5"/><path d="M 2245.5 553 L 2251 561 L 2256.5 553 Z" fill="#0066FF"/><rect x="2212.4" y="511" width="77.19999999999999" height="26" rx="13" fill="#FFFFFF" stroke="#0066FF" stroke-width="1.3"/><text x="2251" y="528.5" text-anchor="middle" font-family="Hanken Grotesk" font-size="12.5" font-weight="600" fill="#0066FF">maps to</text><rect x="70" y="827" width="2380" height="194" rx="16" fill="#E5F0FF"/><text x="94" y="857" font-family="Hanken Grotesk" font-size="13" font-weight="800" letter-spacing="2" fill="#0066FF">TARGET ↔ DEMO MAPPING</text><rect x="94" y="877" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="887" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Governance panel ↔ demo taxonomy panel (axis edit, proposal review, apply)</text><rect x="1260" y="877" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="887" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Assisted zero-shot re-classification ↔ Claude-assisted re-tag proposals over the candidate mapping</text><rect x="94" y="917" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="116" y="927" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Tags applied after embedding ↔ Qdrant set_payload on axisIds / topics — vectors untouched</text><rect x="1260" y="917" width="10" height="10" rx="2.5" fill="#0066FF"/><text x="1282" y="927" font-family="Hanken Grotesk" font-size="15.5" font-weight="500" fill="#031A34">Versioned taxonomy rollout ↔ taxonomy vN commit, persisted and re-applied at boot, with audit entry</text><text x="70" y="1065" font-family="Hanken Grotesk" font-size="13.5" font-weight="400" fill="#6E7894">Every demo component corresponds to an actual code path in the Hub SSoT implementation (governance engine, re-tag agent, vector-store payload updates).</text><text x="2450" y="1065" text-anchor="end" font-family="Hanken Grotesk" font-size="13.5" font-weight="700" fill="#0066FF">Telefónica · Hub SSoT</text>
</svg>