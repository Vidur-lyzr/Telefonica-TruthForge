openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hub SSoT — governed, agentic Single Source of Truth for Telefónica
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ask
    description: Cited agentic question answering
  - name: knowledge
    description: Governed knowledge corpus, axes, roles
  - name: admin
    description: Administration backend — profiles, users, schedules, audit
  - name: kpis
    description: Governed KPI / objective tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ask:
    post:
      operationId: ask
      tags: [ask]
      summary: Ask a question over the governed knowledge core
      description: >
        Runs the Hub SSoT agent. Resolves the user's permission scope, retrieves
        permission-filtered evidence, and composes a cited answer — or returns an
        honest "no evidence" or "permission blocked" result. The model never sees
        a chunk the user cannot access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [ask]
      summary: Suggested starter questions
      description: Example questions, including ones that showcase no-evidence, permission blocks, and historic flags.
      responses:
        "200":
          description: Suggested questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedQuery"

  /axes:
    get:
      operationId: listAxes
      tags: [knowledge]
      summary: The five Transform & Grow strategic axes
      responses:
        "200":
          description: Strategic axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicAxis"

  /roles:
    get:
      operationId: listRoles
      tags: [knowledge]
      summary: Selectable permission scopes (demo personas)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /documents:
    get:
      operationId: listDocuments
      tags: [knowledge]
      summary: Governed corpus documents with their metadata contract
      responses:
        "200":
          description: Corpus documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorpusDocument"

  /corpus/stats:
    get:
      operationId: getCorpusStats
      tags: [knowledge]
      summary: Corpus governance overview (counts and breakdowns)
      description: >
        Governance overview of the corpus. When roleId is supplied, counts and
        breakdowns are filtered to what the persona's clearance may see
        (fail-closed). When omitted, the full governed corpus is reported.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Optional persona id to scope stats by clearance
      responses:
        "200":
          description: Corpus statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusStats"

  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [knowledge]
      summary: Preview counts for the four Home app cards
      description: >
        Returns one live preview number per app (Generate, KPIs, Planning, Ask),
        scoped to what the active persona's clearance may see (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"

  /radar:
    get:
      operationId: listRadar
      tags: [knowledge]
      summary: Permission-aware radar of what changed
      description: >
        Things that moved — external signals, knowledge events, and the
        persona's own queue — filtered to the persona's clearance (fail-closed)
        and ordered most-recent-first.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Radar items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarItem"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [knowledge]
      summary: A single document with its extracted chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/profiles:
    get:
      operationId: listAdminProfiles
      tags: [admin]
      summary: The four platform access profiles and their scopes
      responses:
        "200":
          description: Access profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProfile"

  /admin/users:
    get:
      operationId: listPlatformUsers
      tags: [admin]
      summary: Registered platform users with area, profile and confidentiality tier
      responses:
        "200":
          description: Platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"

  /admin/schedules:
    get:
      operationId: listScheduledDocuments
      tags: [admin]
      summary: Recurring document schedules (source-resolved status)
      responses:
        "200":
          description: Scheduled documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledDocument"

  /admin/audit:
    get:
      operationId: listAuditEntries
      tags: [admin]
      summary: Read-only audit trail of permission changes and scheduled runs
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /kpis/query:
    post:
      operationId: queryKpis
      tags: [kpis]
      summary: Governed KPI cards for the active persona and filters
      description: >
        Returns the KPI cards a persona is cleared to see, scoped by clearance and
        area, with the selected reporting period applied. A KPI whose internal
        evidence is above the persona's clearance is withheld (fail closed). Also
        returns the available filter facets across the persona's visible KPIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiQueryInput"
      responses:
        "200":
          description: KPI cards and facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiQueryResult"

  /kpis/ask:
    post:
      operationId: askKpis
      tags: [kpis]
      summary: Ask a question over the KPIs currently in view
      description: >
        Runs the KPI-scoped agent. Retrieval is seeded from the evidence behind the
        KPIs in view (internal source chunks and external mentions), permission
        filtered before the model, and returns a cited answer — or an honest
        no-evidence / permission-blocked result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /kpis/detail:
    post:
      operationId: getKpiDetail
      tags: [kpis]
      summary: Drill-down detail for a single KPI
      description: >
        Returns the time series, breakdowns and composing sources for one KPI,
        scoped to the active persona. Withheld (403) if the persona is not cleared
        for the KPI or its evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiDetailInput"
      responses:
        "200":
          description: KPI detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"
        "403":
          description: Not permitted or not found for this persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/overview:
    get:
      operationId: getPlanningOverview
      tags: [planning]
      summary: Planning surface overview (connected source calendars + anchor date)
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningOverview"

  /planning/events:
    get:
      operationId: listPlanningEvents
      tags: [planning]
      summary: Permission-scoped calendar events for a range and filters
      description: >
        Returns events the active persona is cleared to see. Events above the
        persona's clearance are returned as redacted "busy/blocked" stubs with
        no detail.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: axis
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningEvent"

  /planning/event:
    get:
      operationId: getPlanningEvent
      tags: [planning]
      summary: A single event with its overlapping siblings
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningEventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/insights:
    get:
      operationId: getPlanningInsights
      tags: [planning]
      summary: Conflicts, gaps, predictions and external signals for a range
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: axis
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningInsights"

  /planning/ask:
    post:
      operationId: planningAsk
      tags: [planning]
      summary: Scoped natural-language question over the governed calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningAskInput"
      responses:
        "200":
          description: Cited planning answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningAskResult"

  /planning/forecast:
    post:
      operationId: planningForecast
      tags: [planning]
      summary: Generate a cited 10-day forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningForecastInput"
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningForecast"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AskTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: user | assistant
        content:
          type: string

    AskFilters:
      type: object
      description: Retrieval scope applied BEFORE retrieval. Absent/empty means "all data".
      properties:
        market:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        period:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        axis:
          type: ["string", "null"]

    AskAttachment:
      type: object
      description: Working-context document. Never enters the corpus unless ingest is true.
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
        ingest:
          type: boolean

    AskInput:
      type: object
      required: [question, area, roleId]
      properties:
        question:
          type: string
          minLength: 1
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        roleId:
          type: string
          description: The active permission scope / persona id
        history:
          type: array
          description: Prior conversation turns, oldest first.
          items:
            $ref: "#/components/schemas/AskTurn"
        filters:
          oneOf:
            - $ref: "#/components/schemas/AskFilters"
            - type: "null"
        attachment:
          oneOf:
            - $ref: "#/components/schemas/AskAttachment"
            - type: "null"

    AskResult:
      type: object
      required: [status, answer, citations, historic, axisIds]
      properties:
        status:
          type: string
          description: answered | no_evidence | permission_blocked | conflict
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        historic:
          type: boolean
        historicNote:
          type: ["string", "null"]
        historicPointer:
          type: ["string", "null"]
          description: Pointer to the current/superseding series when the answer is historic.
        permissionNote:
          type: ["string", "null"]
        conflictNote:
          type: ["string", "null"]
        resolutionPath:
          type: ["string", "null"]
          description: Where to resolve a conflict, e.g. "wiki".
        lowConfidence:
          type: boolean
        lowConfidenceNote:
          type: ["string", "null"]
        corroborationCount:
          type: ["integer", "null"]
          description: Number of permitted sources that agree on the headline figure.
        corroborationNote:
          type: ["string", "null"]
        axisIds:
          type: array
          items:
            type: string
        numeric:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
        adjacentDatum:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
          description: Closest adjacent/historic datum offered on a no-evidence result.
        relatedEntities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        suggestedNext:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedNext"
        retrievalModes:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalMode"
        attachmentAck:
          type: ["string", "null"]

    SuggestedNext:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        rationale:
          type: ["string", "null"]

    RetrievalMode:
      type: object
      required: [mode, label, used]
      properties:
        mode:
          type: string
          description: semantic | agentic | graph | keyword
        label:
          type: string
        used:
          type: boolean
        detail:
          type: ["string", "null"]

    Citation:
      type: object
      required: [id, docId, docTitle, sourceLoc, version, owner, confidence, confidentiality, validity, snippet]
      properties:
        id:
          type: string
          description: Marker referenced in the answer, e.g. S1
        docId:
          type: string
        docTitle:
          type: string
        sourceLoc:
          type: string
          description: Human-readable location, e.g. "Q1 2026 Results › slide 12"
        version:
          type: string
        owner:
          type: string
        validUntil:
          type: ["string", "null"]
        confidence:
          type: number
        relevance:
          type: ["number", "null"]
          description: Retrieval relevance score (idf coverage) for this source.
        corroboration:
          type: ["integer", "null"]
          description: How many permitted sources agree with this source's headline figure.
        confidentiality:
          type: string
          description: public | internal | confidential | restricted
        validity:
          type: string
          description: approved | historic | review | superseded
        conflicting:
          type: boolean
          description: True when this source materially disagrees with another cited source.
        snippet:
          type: string
        value:
          type: ["string", "null"]
          description: Optional headline figure for numeric evidence
        period:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        topics:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string

    NumericFact:
      type: object
      required: [label, value, unit, period, source]
      properties:
        label:
          type: string
        value:
          type: string
        unit:
          type: string
        period:
          type: string
        source:
          type: string

    AdminProfile:
      type: object
      required: [id, label, scope, detail]
      properties:
        id:
          type: string
          description: superadmin | admin | editor | audit
        label:
          type: string
        scope:
          type: string
        detail:
          type: string

    PlatformUser:
      type: object
      required: [id, name, email, area, profileId, clearance]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        profileId:
          type: string
          description: superadmin | admin | editor | audit
        clearance:
          type: string
          description: public | internal | confidential | restricted

    ScheduledDocument:
      type: object
      required: [id, template, frequency, languages, owner, reviewFolder, sourceDocId, status]
      properties:
        id:
          type: string
        template:
          type: string
        frequency:
          type: string
        languages:
          type: array
          items:
            type: string
        owner:
          type: string
        reviewFolder:
          type: string
        sourceDocId:
          type: ["string", "null"]
        sourceTitle:
          type: ["string", "null"]
        status:
          type: string
          description: active | paused | orphaned

    AuditEntry:
      type: object
      required: [id, actor, action, target, kind, timestamp, detail]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        kind:
          type: string
          description: permission | user | schedule | run
        timestamp:
          type: string
        detail:
          type: string

    GraphEntity:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: market | brand | executive | axis
        relation:
          type: ["string", "null"]

    SuggestedQuery:
      type: object
      required: [id, text, kind]
      properties:
        id:
          type: string
        text:
          type: string
        kind:
          type: string
          description: cited | no_evidence | permission | historic

    StrategicAxis:
      type: object
      required: [id, name, color, description]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        description:
          type: string

    Role:
      type: object
      required: [id, label, clearance, area, description]
      properties:
        id:
          type: string
        label:
          type: string
        clearance:
          type: string
          description: public | internal | confidential | restricted
        area:
          type: string
        description:
          type: string

    CorpusDocument:
      type: object
      required:
        [id, title, country, brand, entity, quarter, type, confidentiality, owner, validity, language, topics, axisIds, summary, chunkCount]
      properties:
        id:
          type: string
        title:
          type: string
        country:
          type: string
        brand:
          type: string
        entity:
          type: string
        quarter:
          type: string
        type:
          type: string
        confidentiality:
          type: string
        owner:
          type: string
        validity:
          type: string
        validUntil:
          type: ["string", "null"]
        language:
          type: string
        topics:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string
        summary:
          type: string
        chunkCount:
          type: integer

    CorpusDocumentDetail:
      type: object
      required: [document, chunks]
      properties:
        document:
          $ref: "#/components/schemas/CorpusDocument"
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"

    DocumentChunk:
      type: object
      required: [id, breadcrumb, heading, text]
      properties:
        id:
          type: string
        breadcrumb:
          type: string
        heading:
          type: string
        text:
          type: string

    CountBucket:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer

    AxisCount:
      type: object
      required: [axisId, count]
      properties:
        axisId:
          type: string
        count:
          type: integer

    CorpusStats:
      type: object
      required:
        [totalDocuments, totalChunks, quarantined, validatedPercent, lastUpdated, byCountry, byType, byConfidentiality, byValidity, byAxis, byLanguage]
      properties:
        totalDocuments:
          type: integer
        totalChunks:
          type: integer
        quarantined:
          type: integer
        validatedPercent:
          type: integer
          description: Percentage of visible documents whose validity is approved
        lastUpdated:
          type: string
          description: ISO timestamp of the most recent visible knowledge event
        byCountry:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byType:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byConfidentiality:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byValidity:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byAxis:
          type: array
          items:
            $ref: "#/components/schemas/AxisCount"
        byLanguage:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"

    KpiSource:
      type: object
      required: [id, label, kind, weight, confidence, conflict, accessible]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          description: internal | external
        weight:
          type: number
        docId:
          type: ["string", "null"]
        docTitle:
          type: ["string", "null"]
        sourceLoc:
          type: ["string", "null"]
        snippet:
          type: ["string", "null"]
        version:
          type: ["string", "null"]
        owner:
          type: ["string", "null"]
        confidentiality:
          type: ["string", "null"]
        validity:
          type: ["string", "null"]
        confidence:
          type: number
        conflict:
          type: boolean
        accessible:
          type: boolean

