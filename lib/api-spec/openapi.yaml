      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityFeedbackBody"
      responses:
        "200":
          description: Stored feedback entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityFeedbackEntry"
        "403":
          description: Persona lacks the use_modules capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listQualityFeedback
      tags: [quality]
      summary: Feedback entries with embedded triage state (L3 queue)
      description: >
        Newest first. Retrieval traces are omitted from the list — fetch one
        entry via /quality/feedback-item for the full trace. Requires
        view_audit (partial).
      parameters:
        - name: viewerRoleId
          in: query
          required: true
          schema:
            type: string
          description: Acting persona — must hold the view_audit capability
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityFeedbackPage"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quality/feedback-item:
    get:
      operationId: getQualityFeedbackItem
      tags: [quality]
      summary: One feedback entry including its snapshotted retrieval trace
      parameters:
        - name: viewerRoleId
          in: query
          required: true
          schema:
            type: string
        - name: feedbackId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feedback entry with retrieval trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityFeedbackDetail"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown feedback id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quality/goldens:
    get:
      operationId: listQualityGoldens
      tags: [quality]
      summary: The weekly golden question set (L1)
      description: >
        Every golden is grounded in the governed corpus - persona, language,
        expected governance status and (for answered goldens) the documents
        that must be cited. Requires view_audit (partial).
      parameters:
        - name: viewerRoleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Golden set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGoldenSet"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quality/runs:
    get:
      operationId: listQualityRuns
      tags: [quality]
      summary: Evaluation run history and the weekly schedule anchor (L1 scorecard)
      description: >
        Run summaries newest first (results omitted - fetch one run via
        /quality/run), plus the next scheduled weekly eval time. Requires
        view_audit (partial).
      parameters:
        - name: viewerRoleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityRunsPage"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: startQualityRun
      tags: [quality]
      summary: Start a manual golden-set evaluation run
      description: >
        Replays the full golden set through the real Ask agent (concurrency 2)
        and scores accuracy, citation correctness, hallucination rate and
        latency percentiles. Returns 202 immediately - poll /quality/run.
        Refused while another run is in flight. Requires approve_sensitive
        (full).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityRunStartBody"
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityRunStarted"
        "403":
          description: Persona lacks the approve_sensitive capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another evaluation run is already in flight (code run_in_flight)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quality/run:
    get:
      operationId: getQualityRun
      tags: [quality]
      summary: One evaluation run with its full per-golden results
      parameters:
        - name: viewerRoleId
          in: query
          required: true
          schema:
            type: string
        - name: runId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityEvalRun"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quality/feedback/classify:
    post:
      operationId: classifyQualityFeedback
      tags: [quality]
      summary: Triage a feedback item - error class and corrective action (L3)
      description: >
        Classifies an open feedback item (retrieval miss, stale source, bad
        citation, model error, permission gap, or not an error) and records
        the corrective action taken. Requires approve_sensitive (full).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityClassifyBody"
      responses:
        "200":
          description: Updated feedback entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityFeedbackEntry"
        "403":
          description: Persona lacks the approve_sensitive capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown feedback id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /quality/reeval:
    post:
      operationId: startQualityReeval
      tags: [quality]
      summary: Launch a re-evaluation run to close a triaged feedback item (L3)
      description: >
        Starts a full golden-set run linked to a classified feedback item.
        When the run completes, the item is marked resolved and the run's
        scorecard documents whether the corrective action held. Returns 202 -
        poll /quality/run. Requires approve_sensitive (full).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityReevalBody"
      responses:
        "202":
          description: Re-evaluation run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityRunStarted"
        "403":
          description: Persona lacks the approve_sensitive capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown feedback id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Item not yet classified, or another run is in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    BrandTemplateSection:
      type: object
      required: [key, label, kind, perAxis]
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
        perAxis:
          type: boolean
    BrandTemplateDisclaimer:
      type: object
      required: [id, name, text]
      properties:
        id:
          type: string
        name:
          type: string
        text:
          type: string
    BrandTemplate:
      type: object
      required:
        [id, shape, name, description, purpose, format, owner, version, validity, clearance, sections, disclaimers]
      properties:
        id:
          type: string
        shape:
          type: string
        name:
          type: string
        description:
          type: string
        purpose:
          type: string
        format:
          type: string
        owner:
          type: string
        version:
          type: string
        validity:
          type: string
          description: approved | historic | review | superseded
        clearance:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateSection"
        disclaimers:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateDisclaimer"
    BrandTemplateSummary:
      type: object
      required:
        [id, shape, name, description, purpose, format, owner, version, validity, clearance, sectionCount]
      properties:
        id:
          type: string
        shape:
          type: string
        name:
          type: string
        description:
          type: string
        purpose:
          type: string
        format:
          type: string
        owner:
          type: string
        version:
          type: string
        validity:
          type: string
          description: approved | historic | review | superseded
        clearance:
          type: string
        sectionCount:
          type: integer
    BrandTemplatesView:
      type: object
      required: [personaClearance, blockedCount, templates]
      properties:
        personaClearance:
          type: string
        blockedCount:
          type: integer
        templates:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateSummary"
    BrandTemplateDetailView:
      type: object
      required: [personaClearance, blocked, template]
      properties:
        personaClearance:
          type: string
        blocked:
          type: boolean
        template:
          oneOf:
            - $ref: "#/components/schemas/BrandTemplate"
            - type: "null"
    TonePrinciple:
      type: object
      required: [id, title, guidance, dos, donts]
      properties:
        id:
          type: string
        title:
          type: string
        guidance:
          type: string
        dos:
          type: array
          items:
            type: string
        donts:
          type: array
          items:
            type: string
    BrandRule:
      type: object
      required: [id, rule, severity, detail]
      properties:
        id:
          type: string
        rule:
          type: string
        severity:
          type: string
        detail:
          type: string
    ProhibitedPhrase:
      type: object
      required: [id, phrase, reason, rewrite]
      properties:
        id:
          type: string
        phrase:
          type: string
        reason:
          type: string
        rewrite:
          type: string
    SpellingPref:
      type: object
      required: [american, european]
      properties:
        american:
          type: string
        european:
          type: string
    BrandToneView:
      type: object
      required: [principles, rules, prohibited, spelling]
      properties:
        principles:
          type: array
          items:
            $ref: "#/components/schemas/TonePrinciple"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/BrandRule"
        prohibited:
          type: array
          items:
            $ref: "#/components/schemas/ProhibitedPhrase"
        spelling:
          type: array
          items:
            $ref: "#/components/schemas/SpellingPref"
    BrandResource:
      type: object
      required: [id, name, category, description, detail, format, clearance, validity]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        detail:
          type: string
        format:
          type: string
        clearance:
          type: string
        validity:
          type: string
    BrandResourcesView:
      type: object
      required: [personaClearance, blockedCount, resources]
      properties:
        personaClearance:
          type: string
        blockedCount:
          type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/BrandResource"
    BrandCheckInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
    BrandSkill:
      type: object
      required: [content, version, updatedAt, isDefault]
      properties:
        content:
          type: string
          description: The full skill document (Markdown)
        version:
          type: integer
        updatedAt:
          type: string
        isDefault:
          type: boolean
          description: True when the content matches the governed default
    BrandSkillUpdate:
      type: object
      required: [content, roleId]
      properties:
        content:
          type: string
          minLength: 1
        roleId:
          type: string
          description: Acting persona — must hold the manage_brand_room capability
    GenerationJob:
      type: object
      required: [id, mode, stage, status, createdAt]
      properties:
        id:
          type: string
        mode:
          type: string
          description: generate | refine
        stage:
          type: string
          description: retrieving | composing | guardian | done
        status:
          type: string
          description: running | done | error
        draft:
          $ref: "#/components/schemas/GeneratedDraft"
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable refusal code, e.g. editorial_review_required
      required:
        - error

    AskTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: user | assistant
        content:
          type: string
        citedDocIds:
          type: array
          items:
            type: string
          description: >
            Doc ids cited by this (assistant) turn. Used only to seed the
            document-generation pipeline's retrieval; the server re-validates
            every id against the current persona's clearance.

    AskFilters:
      type: object
      description: Retrieval scope applied BEFORE retrieval. Absent/empty means "all data".
      properties:
        market:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        period:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        axis:
          type: ["string", "null"]

    AskAttachment:
      type: object
      description: Working-context document. Never enters the corpus unless ingest is true.
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
        ingest:
          type: boolean

    AskInput:
      type: object
      required: [question, area, roleId]
      properties:
        question:
          type: string
          minLength: 1
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        roleId:
          type: string
          description: The active permission scope / persona id
        history:
          type: array
          description: Prior conversation turns, oldest first.
          items:
            $ref: "#/components/schemas/AskTurn"
        filters:
          oneOf:
            - $ref: "#/components/schemas/AskFilters"
            - type: "null"
        attachment:
          oneOf:
            - $ref: "#/components/schemas/AskAttachment"
            - type: "null"
        lang:
          type: string
          enum: [es, en, de, pt]
          description: >
            Preferred answer language. When present, the agent composes its
            answer in this language regardless of the question's language.
            Absent means mirror the question's language.

    AskDocumentSummary:
      type: object
      description: >
        A document generated during an Ask turn by the doc-gen Superflow. All
        labels (status, Guardian outcome, downloadable formats) are the
        server's own — never the model's claim.
      required:
        [id, title, shape, templateName, status, guardianStatus, guardianSummary, formats, language, audience, confidentiality, citationsCount, historic, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        shape:
          type: string
        templateName:
          type: string
        status:
          type: string
          description: drafted | no_evidence | permission_blocked
        guardianStatus:
          type: string
          description: pass | block
        guardianSummary:
          type: string
        formats:
          type: array
          items:
            type: string
        language:
          type: string
        audience:
          type: string
        confidentiality:
          type: string
        citationsCount:
          type: integer
        historic:
          type: boolean
        note:
          type: ["string", "null"]
        createdAt:
          type: string

    AskDocumentPreview:
      type: object
      description: >
        Full content of an Ask-generated document for inline rendering in the
        workspace artifact panel. Sections and citations come straight from
        the server-registered draft — never from the model's chat text.
      required:
        [id, title, shape, templateName, status, guardianStatus, guardianSummary, guardianFindings, formats, language, audience, confidentiality, historic, sections, citations, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        shape:
          type: string
        templateName:
          type: string
        status:
          type: string
          description: drafted | no_evidence | permission_blocked
        guardianStatus:
          type: string
          description: pass | block
        guardianSummary:
          type: string
        guardianFindings:
          type: array
          items:
            $ref: "#/components/schemas/GuardianFinding"
        formats:
          type: array
          items:
            type: string
        language:
          type: string
        audience:
          type: string
        confidentiality:
          type: string
        historic:
          type: boolean
        note:
          type: ["string", "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/DraftSection"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        createdAt:
          type: string

    AskResult:
      type: object
      required: [status, answer, citations, historic, axisIds]
      properties:
        status:
          type: string
          description: answered | no_evidence | permission_blocked | conflict
        auditId:
          type: ["string", "null"]
          description: >
            Retrieval-audit id of this turn (F3 log). Sent back with answer
            feedback so the exact retrieval trace is attached to the report.
            Null on conversational turns that never retrieved.
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        historic:
          type: boolean
        historicNote:
          type: ["string", "null"]
        historicPointer:
          type: ["string", "null"]
          description: Pointer to the current/superseding series when the answer is historic.
        permissionNote:
          type: ["string", "null"]
        conflictNote:
          type: ["string", "null"]
        resolutionPath:
          type: ["string", "null"]
          description: Where to resolve a conflict, e.g. "wiki".
        lowConfidence:
          type: boolean
        lowConfidenceNote:
          type: ["string", "null"]
        corroborationCount:
          type: ["integer", "null"]
          description: Number of permitted sources that agree on the headline figure.
        corroborationNote:
          type: ["string", "null"]
        axisIds:
          type: array
          items:
            type: string
        numeric:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
        adjacentDatum:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
          description: Closest adjacent/historic datum offered on a no-evidence result.
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AskDocumentSummary"
          description: Documents generated during this turn via the doc-gen Superflow.
        relatedEntities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        suggestedNext:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedNext"
        retrievalModes:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalMode"
        attachmentAck:
          type: ["string", "null"]
        externalSources:
          type: array
          items:
            $ref: "#/components/schemas/ExternalWebSource"
          description: >
            External web coverage collected server-side while the agent used its
            web_search tool (Perplexity). Ungoverned B-channel material — shown
            separately, never counted as governed citations and never used for
            numeric facts.

    ExternalWebSource:
      type: object
      required: [title, source, url, excerpt]
      properties:
        title:
          type: string
        source:
          type: string
          description: Outlet / publisher name
        url:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        excerpt:
          type: string

    SuggestedNext:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        rationale:
          type: ["string", "null"]

    RetrievalMode:
      type: object
      required: [mode, label, used]
      properties:
        mode:
          type: string
          description: semantic | agentic | graph | keyword
        label:
          type: string
        used:
          type: boolean
        detail:
          type: ["string", "null"]

    Citation:
      type: object
      required: [id, docId, docTitle, sourceLoc, version, owner, confidence, confidentiality, validity, snippet]
      properties:
        id:
          type: string
          description: Marker referenced in the answer, e.g. S1
        docId:
          type: string
        docTitle:
          type: string
        sourceLoc:
          type: string
          description: Human-readable location, e.g. "Q1 2026 Results › slide 12"
        version:
          type: string
        owner:
          type: string
        validUntil:
          type: ["string", "null"]
        confidence:
          type: number
        relevance:
          type: ["number", "null"]
          description: Retrieval relevance score (idf coverage) for this source.
        corroboration:
          type: ["integer", "null"]
          description: How many permitted sources agree with this source's headline figure.
        confidentiality:
          type: string
          description: public | private | confidential | off_the_record
        validity:
          type: string
          description: approved | historic | review | superseded
        conflicting:
          type: boolean
          description: True when this source materially disagrees with another cited source.
        snippet:
          type: string
        value:
          type: ["string", "null"]
          description: Optional headline figure for numeric evidence
        period:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        topics:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string

    NumericFact:
      type: object
      required: [label, value, unit, period, source]
      properties:
        label:
          type: string
        value:
          type: string
        unit:
          type: string
        period:
          type: string
        source:
          type: string

    ModuleUsage:
      type: object
      required: [module, calls, inputTokens, outputTokens]
      properties:
        module:
          type: string
          description: ask | generate | kpis | planning | wiki | data
        calls:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        lastCallAt:
          type: string
          nullable: true

    UsageMeter:
      type: object
      required: [since, modules, totals]
      properties:
        since:
          type: string
          description: When metering started (first boot of the counter store)
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleUsage"
        totals:
          type: object
          required: [calls, inputTokens, outputTokens]
          properties:
            calls:
              type: integer
            inputTokens:
              type: integer
            outputTokens:
              type: integer

    CapabilitySet:
      type: object
      description: >
        Capability levels for one profile, cell by cell from the
        source-of-truth access matrix (5 profiles x 9 capabilities).
        full | partial | none — partial is bounded by the persona's own
        sub-profile (their area and clearance).
      required:
        [
          configure_backend,
          manage_data_center,
          ingest_documents,
          manage_brand_room,
          manage_access_control,
          manage_users_roles,
          use_modules,
          approve_sensitive,
          view_audit,
        ]
      properties:
        configure_backend:
          type: string
          enum: [full, partial, none]
          description: Configure backend — sources, agents, models
        manage_data_center:
          type: string
          enum: [full, partial, none]
          description: Manage Data Center — connections and taxonomy schema
        ingest_documents:
          type: string
          enum: [full, partial, none]
          description: Ingest documents and assign/edit metadata
        manage_brand_room:
          type: string
          enum: [full, partial, none]
          description: Manage the Brand Room
        manage_access_control:
          type: string
          enum: [full, partial, none]
          description: Manage access control
        manage_users_roles:
          type: string
          enum: [full, partial, none]
          description: Manage users and roles
        use_modules:
          type: string
          enum: [full, partial, none]
          description: Use / generate in the four workspace modules
        approve_sensitive:
          type: string
          enum: [full, partial, none]
