openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hub SSoT — governed, agentic Single Source of Truth for Telefónica
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ask
    description: Cited agentic question answering
  - name: knowledge
    description: Governed knowledge corpus, axes, roles
  - name: admin
    description: Administration backend — profiles, users, schedules, audit
  - name: kpis
    description: Governed KPI / objective tracking
  - name: wiki
    description: Wiki / Knowledge surface — map, compiled pages, sources, compiled-layer ask
  - name: data
    description: Data Center — sources, ingestion pipeline, validation queue, freshness
  - name: brand-room
    description: Brand Room — templates, tone of voice, governed resources, live Brand Guardian
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ask:
    post:
      operationId: ask
      tags: [ask]
      summary: Ask a question over the governed knowledge core
      description: >
        Runs the Hub SSoT agent. Resolves the user's permission scope, retrieves
        permission-filtered evidence, and composes a cited answer — or returns an
        honest "no evidence" or "permission blocked" result. The model never sees
        a chunk the user cannot access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [ask]
      summary: Suggested starter questions
      description: Example questions, including ones that showcase no-evidence, permission blocks, and historic flags.
      responses:
        "200":
          description: Suggested questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedQuery"

  /axes:
    get:
      operationId: listAxes
      tags: [knowledge]
      summary: The five Transform & Grow strategic axes
      responses:
        "200":
          description: Strategic axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicAxis"

  /roles:
    get:
      operationId: listRoles
      tags: [knowledge]
      summary: Selectable permission scopes (demo personas)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /documents:
    get:
      operationId: listDocuments
      tags: [knowledge]
      summary: Governed corpus documents with their metadata contract
      responses:
        "200":
          description: Corpus documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorpusDocument"

  /corpus/stats:
    get:
      operationId: getCorpusStats
      tags: [knowledge]
      summary: Corpus governance overview (counts and breakdowns)
      description: >
        Governance overview of the corpus. When roleId is supplied, counts and
        breakdowns are filtered to what the persona's clearance may see
        (fail-closed). When omitted, the full governed corpus is reported.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Optional persona id to scope stats by clearance
      responses:
        "200":
          description: Corpus statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusStats"

  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [knowledge]
      summary: Preview counts for the four Home app cards
      description: >
        Returns one live preview number per app (Generate, KPIs, Planning, Ask),
        scoped to what the active persona's clearance may see (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"

  /radar:
    get:
      operationId: listRadar
      tags: [knowledge]
      summary: Permission-aware radar of what changed
      description: >
        Things that moved — external signals, knowledge events, and the
        persona's own queue — filtered to the persona's clearance (fail-closed)
        and ordered most-recent-first.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Radar items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarItem"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [knowledge]
      summary: A single document with its extracted chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/profiles:
    get:
      operationId: listAdminProfiles
      tags: [admin]
      summary: The four platform access profiles and their scopes
      responses:
        "200":
          description: Access profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProfile"

  /admin/users:
    get:
      operationId: listPlatformUsers
      tags: [admin]
      summary: Registered platform users with area, profile and confidentiality tier
      responses:
        "200":
          description: Platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"

  /admin/schedules:
    get:
      operationId: listScheduledDocuments
      tags: [admin]
      summary: Recurring document schedules (source-resolved status)
      responses:
        "200":
          description: Scheduled documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledDocument"

  /admin/audit:
    get:
      operationId: listAuditEntries
      tags: [admin]
      summary: Read-only audit trail of permission changes and scheduled runs
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /admin/visibility/{userId}:
    get:
      operationId: getUserVisibilityMatrix
      tags: [admin]
      summary: Per-document visibility matrix for a platform user
      description: >
        Resolves, for every governed document, whether the given user can see
        it and — when blocked — which axis blocks it (clearance or area).
        Access is the intersection of area and confidentiality, resolved by
        the same engine every retrieval path uses.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visibility matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityMatrix"
        "404":
          description: Unknown user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/taxonomy:
    get:
      operationId: getTaxonomyState
      tags: [governance]
      summary: Current taxonomy configuration version and applied version history
      responses:
        "200":
          description: Taxonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonomyState"

  /governance/retag/propose:
    post:
      operationId: proposeRetag
      tags: [governance]
      summary: Step 1-3 of the governed re-tagging pipeline
      description: >
        Takes a taxonomy edit (axis rename / redefinition), builds the mapping
        table of affected documents and produces per-document re-classification
        proposals (LLM zero-shot against the edited axis, with a deterministic
        fallback when the model is unavailable). Nothing is applied — a human
        validates each proposal before apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetagProposeInput"
      responses:
        "200":
          description: Re-tagging proposals awaiting human validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetagProposeResult"
        "404":
          description: Unknown axis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/retag/apply:
    post:
      operationId: applyRetag
      tags: [governance]
      summary: Step 4 — apply human-validated re-tagging as a new taxonomy version
      description: >
        Only accepted decisions are applied. Creates a new persisted taxonomy
        version (metadata only — no re-embedding, no redeploy) and writes an
        audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetagApplyInput"
      responses:
        "200":
          description: Applied taxonomy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetagApplyResult"

  /kpis/query:
    post:
      operationId: queryKpis
      tags: [kpis]
      summary: Governed KPI cards for the active persona and filters
      description: >
        Returns the KPI cards a persona is cleared to see, scoped by clearance and
        area, with the selected reporting period applied. A KPI whose internal
        evidence is above the persona's clearance is withheld (fail closed). Also
        returns the available filter facets across the persona's visible KPIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiQueryInput"
      responses:
        "200":
          description: KPI cards and facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiQueryResult"

  /kpis/ask:
    post:
      operationId: askKpis
      tags: [kpis]
      summary: Ask a question over the KPIs currently in view
      description: >
        Runs the KPI-scoped agent. Retrieval is seeded from the evidence behind the
        KPIs in view (internal source chunks and external mentions), permission
        filtered before the model, and returns a cited answer — or an honest
        no-evidence / permission-blocked result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /kpis/detail:
    post:
      operationId: getKpiDetail
      tags: [kpis]
      summary: Drill-down detail for a single KPI
      description: >
        Returns the time series, breakdowns and composing sources for one KPI,
        scoped to the active persona. Withheld (403) if the persona is not cleared
        for the KPI or its evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiDetailInput"
      responses:
        "200":
          description: KPI detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"
        "403":
          description: Not permitted or not found for this persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/overview:
    get:
      operationId: getPlanningOverview
      tags: [planning]
      summary: Planning surface overview (connected source calendars + anchor date)
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningOverview"

  /planning/events:
    get:
      operationId: listPlanningEvents
      tags: [planning]
      summary: Permission-scoped calendar events for a range and filters
      description: >
        Returns events the active persona is cleared to see. Events above the
        persona's clearance are returned as redacted "busy/blocked" stubs with
        no detail.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: axis
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningEvent"

  /planning/event:
    get:
      operationId: getPlanningEvent
      tags: [planning]
      summary: A single event with its overlapping siblings
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningEventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/insights:
    get:
      operationId: getPlanningInsights
      tags: [planning]
      summary: Conflicts, gaps, predictions and external signals for a range
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: axis
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningInsights"

  /planning/ask:
    post:
      operationId: planningAsk
      tags: [planning]
      summary: Scoped natural-language question over the governed calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningAskInput"
      responses:
        "200":
          description: Cited planning answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningAskResult"

  /planning/forecast:
    post:
      operationId: planningForecast
      tags: [planning]
      summary: Generate a cited 10-day forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningForecastInput"
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningForecast"

  /generate:
    post:
      operationId: generate
      tags: [generate]
      summary: Generate a governed document (messaging, press+Q&A, or multi-format)
      description: >
        Runs the document-generation engine. Resolves the persona's clearance,
        applies the audience gate (external caps sources to public BEFORE
        retrieval), retrieves permission-filtered evidence, composes a cited
        draft, and runs the Brand Guardian. Returns an honest no_evidence /
        permission_blocked state when nothing can be safely produced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: A generated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"

  /generate/refine:
    post:
      operationId: refineDocument
      tags: [generate]
      summary: Refine an existing draft with a natural-language instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "200":
          description: The refined draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"

  /generate/check:
    post:
      operationId: checkDocument
      tags: [generate]
      summary: Re-run the Brand Guardian on a (possibly edited) draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInput"
      responses:
        "200":
          description: Guardian verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResult"

  /generate/shapes:
    get:
      operationId: listShapes
      tags: [generate]
      summary: The document shapes / templates the engine can produce
      responses:
        "200":
          description: Document shapes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentShape"

  /generate/assets:
    get:
      operationId: listAssets
      tags: [generate]
      summary: Governed assets (approved claims, quotes, boilerplate, disclaimers, glossary)
      responses:
        "200":
          description: Governed assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedAssets"

  /generate/schedules:
    get:
      operationId: listSchedules
      tags: [generate]
      summary: Scheduled document definitions
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [generate]
      summary: Create a scheduled document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleInput"
      responses:
        "200":
          description: The created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /generate/schedules/{id}/run:
    post:
      operationId: runSchedule
      tags: [generate]
      summary: Run a schedule now and place the result in the review inbox
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The review item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/inbox:
    get:
      operationId: listReviewItems
      tags: [generate]
      summary: The human review inbox for scheduled documents
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"

  /generate/inbox/{id}/approve:
    post:
      operationId: approveReviewItem
      tags: [generate]
      summary: Approve a review item (requires a passing Brand Guardian verdict)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveInput"
      responses:
        "200":
          description: The approved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Guardian has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/versions:
    get:
      operationId: listVersions
      tags: [generate]
      summary: Saved document versions (file-backed; survive restarts)
      responses:
        "200":
          description: Saved versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedVersion"
    post:
      operationId: saveVersion
      tags: [generate]
      summary: Save a draft as a version (requires a passing Brand Guardian verdict)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveVersionInput"
      responses:
        "200":
          description: The saved version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedVersion"
        "409":
          description: Guardian has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/export:
    post:
      operationId: exportDocument
      tags: [generate]
      summary: Export a guardian-passed draft as a real .docx, .pptx or .pdf file
      description: >
        Renders the draft into a Telefónica-templated binary document with
        embedded on-brand charts. Governance is enforced server-side before any
        byte is rendered: the Brand Guardian is re-run, scheduled drafts must
        match their approved content hash, and an external destination refuses
        any non-public content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDocumentInput"
      responses:
        "200":
          description: The rendered document (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "409":
          description: Export refused by a governance gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/editorial-review:
    post:
      operationId: recordEditorialReview
      tags: [generate]
      summary: Record a mandatory editorial review of a press release
      description: >
        Registers a human editorial sign-off for a press release, bound to the
        exact content reviewed (server-side content hash). Press exports are
        refused until a review exists for the current content; any later edit
        voids the review. The Brand Guardian must pass before a review can be
        recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReviewInput"
      responses:
        "200":
          description: The recorded review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReviewRecord"
        "409":
          description: Guardian failed or the draft is not reviewable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/suggest-template:
    post:
      operationId: suggestTemplate
      tags: [generate]
      summary: Suggest a governed document shape from a natural-language description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestTemplateInput"
      responses:
        "200":
          description: Suggested template with a pre-filled brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSuggestion"

  /generate/brief-chat:
    post:
      operationId: briefChat
      tags: [generate]
      summary: Guided-chat parameter capture for the document brief
      description: >
        Extracts brief fields from the conversation so far and returns the one
        next question to ask, or completes when enough is captured. Capture
        only — never retrieves evidence or composes content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefChatInput"
      responses:
        "200":
          description: Captured fields and the next question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefChatResult"

  /generate/notifications:
    get:
      operationId: listNotifications
      tags: [generate]
      summary: Notifications for the scheduled-draft review flow
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"
    post:
      operationId: markNotificationsRead
      tags: [generate]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Notifications after marking read
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"

  /generate/jobs:
    post:
      operationId: startGenerateJob
      tags: [generate]
      summary: Start a generation job (observable, staged pipeline)
      description: >
        Starts the same governed compose pipeline as /generate but returns a job
        immediately so the client can poll GET /generate/jobs/{id} and watch the
        real backend phases (retrieving -> composing -> guardian -> done).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "202":
          description: The started job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /generate/refine/jobs:
    post:
      operationId: startRefineJob
      tags: [generate]
      summary: Start a refine job (observable, staged pipeline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "202":
          description: The started job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /generate/jobs/{id}:
    get:
      operationId: getGenerationJob
      tags: [generate]
      summary: Poll the state of a generation/refine job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wiki/graph:
    get:
      operationId: getWikiGraph
      tags: [wiki]
      summary: Permission-filtered knowledge map (nodes and edges)
      description: >
        Returns the knowledge graph shaped for the Map view — axes, compiled
        pages, documents, figures and entities with citation/relationship edges.
        Nodes above the active persona's clearance are surfaced as existence-only
        (locked, contents hidden). Figures fail closed on their source document.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
          description: The active permission scope / persona id
      responses:
        "200":
          description: Wiki graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiGraph"

  /wiki/pages:
    get:
      operationId: listWikiPages
      tags: [wiki]
      summary: Compiled corporate-memory pages (permission-filtered summaries)
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compiled page summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiPageSummary"

  /wiki/page:
    get:
      operationId: getWikiPage
      tags: [wiki]
      summary: A single compiled page with its defended position and evidence
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compiled page detail (locked when above clearance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wiki/lineage:
    get:
      operationId: listWikiLineage
      tags: [wiki]
      summary: Source inspector — ingestion lineage and validation trail per document
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document lineage entries (locked when above clearance)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiLineage"

  /wiki/stats:
    get:
      operationId: getWikiStats
      tags: [wiki]
      summary: Compounding-memory counter (facts resolved, conflicts settled, pages refined)
      responses:
        "200":
          description: Wiki stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiStats"

  /wiki/search:
    post:
      operationId: searchWiki
      tags: [wiki]
      summary: Ask the compiled layer a question and get a cited answer
      description: >
        Reasons over the compiled corporate-memory pages the persona may access.
        Returns a synthesised answer with evidence chips and wiki-links to lit-up
        pages/nodes — or an honest no-evidence / permission-blocked result. Pages
        above the persona's clearance never reach the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WikiSearchInput"
      responses:
        "200":
          description: Compiled-layer answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSearchResult"

  /data/sources:
    get:
      operationId: listDataSources
      tags: [data]
      summary: Connected sources and connectors with status, cadence and doc count
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"

  /data/ingestion:
    get:
      operationId: getIngestionSnapshot
      tags: [data]
      summary: The 7-stage ingestion pipeline snapshot with quarantine
      responses:
        "200":
          description: Ingestion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionSnapshot"

  /data/relevance-filter:
    get:
      operationId: getRelevanceFilter
      tags: [data]
      summary: Pre-ingestion relevance filter for external sources — rules and recent kept/dropped mentions
      responses:
        "200":
          description: Relevance filter snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelevanceFilterSnapshot"

  /data/validation:
    get:
      operationId: listValidationItems
      tags: [data]
      summary: The validation queue with proposed three-layer classification
      responses:
        "200":
          description: Validation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationItem"

  /data/freshness:
    get:
      operationId: listDocumentFreshness
      tags: [data]
      summary: Per-document SLA and freshness with review-overdue nudges
      responses:
        "200":
          description: Document freshness
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocFreshness"

  /brand/templates:
    get:
      operationId: getBrandTemplates
      tags: [brand-room]
      summary: Governed document templates, permission-filtered by persona clearance
      description: >
        The brand-approved document templates. Templates are internal brand
        governance material, so a lower-clearance persona receives an empty set
        with a blocked count rather than the templates themselves (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandTemplatesView"

  /brand/template:
    get:
      operationId: getBrandTemplate
      tags: [brand-room]
      summary: One governed template's full structure, permission-filtered
      description: >
        The full section blueprint and required disclaimers for a single
        template. Fails closed: an existing but above-clearance template is
        reported as blocked with no content; an unknown id returns 404.
      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
          description: Template id to expand
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandTemplateDetailView"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /brand/tone:
    get:
      operationId: getBrandTone
      tags: [brand-room]
      summary: Tone-of-voice principles, hard rules, prohibited phrases and spelling
      responses:
        "200":
          description: Tone of voice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandToneView"

  /brand/resources:
    get:
      operationId: getBrandResources
      tags: [brand-room]
      summary: Governed brand resources, permission-filtered by persona clearance
      description: >
        Corporate brand resources across identity, messaging, legal and
        reference. Each resource carries its own clearance and is filtered to
        what the persona may see before it is returned (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResourcesView"

  /brand/export-templates:
    get:
      operationId: getExportTemplates
      tags: [brand-room]
      summary: Export template library for governed document downloads
      description: >
        The Telefónica export templates the export engine can render — talking
        points, press release, Q&A briefing, generic report, KPI report and the
        10-day forecast — with their structure and an illustrative preview.
      responses:
        "200":
          description: Export templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportTemplate"

  /brand/check:
    post:
      operationId: checkBrandText
      tags: [brand-room]
      summary: Run the live Brand Guardian over arbitrary text
      description: >
        Deterministic brand check over pasted prose — emoji, unapproved
        superlatives, shouted lines, American spelling and uncited figures —
        returning the same verdict shape as the document export gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCheckInput"
      responses:
        "200":
          description: Guardian verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResult"

components:
  schemas:
    BrandTemplateSection:
      type: object
      required: [key, label, kind, perAxis]
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
        perAxis:
          type: boolean
    BrandTemplateDisclaimer:
      type: object
      required: [id, name, text]
      properties:
        id:
          type: string
        name:
          type: string
        text:
          type: string
    BrandTemplate:
      type: object
      required:
        [id, shape, name, description, purpose, format, owner, version, validity, clearance, sections, disclaimers]
      properties:
        id:
          type: string
        shape:
          type: string
        name:
          type: string
        description:
          type: string
        purpose:
          type: string
        format:
          type: string
        owner:
          type: string
        version:
          type: string
        validity:
          type: string
          description: approved | historic | review | superseded
        clearance:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateSection"
        disclaimers:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateDisclaimer"
    BrandTemplateSummary:
      type: object
      required:
        [id, shape, name, description, purpose, format, owner, version, validity, clearance, sectionCount]
      properties:
        id:
          type: string
        shape:
          type: string
        name:
          type: string
        description:
          type: string
        purpose:
          type: string
        format:
          type: string
        owner:
          type: string
        version:
          type: string
        validity:
          type: string
          description: approved | historic | review | superseded
        clearance:
          type: string
        sectionCount:
          type: integer
    BrandTemplatesView:
      type: object
      required: [personaClearance, blockedCount, templates]
      properties:
        personaClearance:
          type: string
        blockedCount:
          type: integer
        templates:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateSummary"
    BrandTemplateDetailView:
      type: object
      required: [personaClearance, blocked, template]
      properties:
        personaClearance:
          type: string
        blocked:
          type: boolean
        template:
          oneOf:
            - $ref: "#/components/schemas/BrandTemplate"
            - type: "null"
    TonePrinciple:
      type: object
      required: [id, title, guidance, dos, donts]
      properties:
        id:
          type: string
        title:
          type: string
        guidance:
          type: string
        dos:
          type: array
          items:
            type: string
        donts:
          type: array
          items:
            type: string
    BrandRule:
      type: object
      required: [id, rule, severity, detail]
      properties:
        id:
          type: string
        rule:
          type: string
        severity:
          type: string
        detail:
          type: string
    ProhibitedPhrase:
      type: object
      required: [id, phrase, reason, rewrite]
      properties:
        id:
          type: string
        phrase:
          type: string
        reason:
          type: string
        rewrite:
          type: string
    SpellingPref:
      type: object
      required: [american, european]
      properties:
        american:
          type: string
        european:
          type: string
    BrandToneView:
      type: object
      required: [principles, rules, prohibited, spelling]
      properties:
        principles:
          type: array
          items:
            $ref: "#/components/schemas/TonePrinciple"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/BrandRule"
        prohibited:
          type: array
          items:
            $ref: "#/components/schemas/ProhibitedPhrase"
        spelling:
          type: array
          items:
            $ref: "#/components/schemas/SpellingPref"
    BrandResource:
      type: object
      required: [id, name, category, description, detail, format, clearance, validity]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        detail:
          type: string
        format:
          type: string
        clearance:
          type: string
        validity:
          type: string
    BrandResourcesView:
      type: object
      required: [personaClearance, blockedCount, resources]
      properties:
        personaClearance:
          type: string
        blockedCount:
          type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/BrandResource"
    BrandCheckInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
    GenerationJob:
      type: object
      required: [id, mode, stage, status, createdAt]
      properties:
        id:
          type: string
        mode:
          type: string
          description: generate | refine
        stage:
          type: string
          description: retrieving | composing | guardian | done
        status:
          type: string
          description: running | done | error
        draft:
          $ref: "#/components/schemas/GeneratedDraft"
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable refusal code, e.g. editorial_review_required
      required:
        - error

    AskTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: user | assistant
        content:
          type: string

    AskFilters:
      type: object
      description: Retrieval scope applied BEFORE retrieval. Absent/empty means "all data".
      properties:
        market:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        period:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        axis:
          type: ["string", "null"]

    AskAttachment:
      type: object
      description: Working-context document. Never enters the corpus unless ingest is true.
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
        ingest:
          type: boolean

    AskInput:
      type: object
      required: [question, area, roleId]
      properties:
        question:
          type: string
          minLength: 1
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        roleId:
          type: string
          description: The active permission scope / persona id
        history:
          type: array
          description: Prior conversation turns, oldest first.
          items:
            $ref: "#/components/schemas/AskTurn"
        filters:
          oneOf:
            - $ref: "#/components/schemas/AskFilters"
            - type: "null"
        attachment:
          oneOf:
            - $ref: "#/components/schemas/AskAttachment"
            - type: "null"

    AskResult:
      type: object
      required: [status, answer, citations, historic, axisIds]
      properties:
        status:
          type: string
          description: answered | no_evidence | permission_blocked | conflict
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        historic:
          type: boolean
        historicNote:
          type: ["string", "null"]
        historicPointer:
          type: ["string", "null"]
          description: Pointer to the current/superseding series when the answer is historic.
        permissionNote:
          type: ["string", "null"]
        conflictNote:
          type: ["string", "null"]
        resolutionPath:
          type: ["string", "null"]
          description: Where to resolve a conflict, e.g. "wiki".
        lowConfidence:
          type: boolean
        lowConfidenceNote:
          type: ["string", "null"]
        corroborationCount:
          type: ["integer", "null"]
          description: Number of permitted sources that agree on the headline figure.
        corroborationNote:
          type: ["string", "null"]
        axisIds:
          type: array
          items:
            type: string
        numeric:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
        adjacentDatum:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
          description: Closest adjacent/historic datum offered on a no-evidence result.
        relatedEntities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        suggestedNext:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedNext"
        retrievalModes:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalMode"
        attachmentAck:
          type: ["string", "null"]

    SuggestedNext:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        rationale:
          type: ["string", "null"]

    RetrievalMode:
      type: object
      required: [mode, label, used]
      properties:
        mode:
          type: string
          description: semantic | agentic | graph | keyword
        label:
          type: string
        used:
          type: boolean
        detail:
          type: ["string", "null"]

    Citation:
      type: object
      required: [id, docId, docTitle, sourceLoc, version, owner, confidence, confidentiality, validity, snippet]
      properties:
        id:
          type: string
          description: Marker referenced in the answer, e.g. S1
        docId:
          type: string
        docTitle:
          type: string
        sourceLoc:
          type: string
          description: Human-readable location, e.g. "Q1 2026 Results › slide 12"
        version:
          type: string
        owner:
          type: string
        validUntil:
          type: ["string", "null"]
        confidence:
          type: number
        relevance:
          type: ["number", "null"]
          description: Retrieval relevance score (idf coverage) for this source.
        corroboration:
          type: ["integer", "null"]
          description: How many permitted sources agree with this source's headline figure.
        confidentiality:
          type: string
          description: public | internal | confidential | restricted
        validity:
          type: string
          description: approved | historic | review | superseded
        conflicting:
          type: boolean
          description: True when this source materially disagrees with another cited source.
        snippet:
          type: string
        value:
          type: ["string", "null"]
          description: Optional headline figure for numeric evidence
        period:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        topics:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string

    NumericFact:
      type: object
      required: [label, value, unit, period, source]
      properties:
        label:
          type: string
        value:
          type: string
        unit:
          type: string
        period:
          type: string
        source:
          type: string

    AdminProfile:
      type: object
      required: [id, label, scope, detail]
      properties:
        id:
          type: string
          description: superadmin | admin | editor | audit
        label:
          type: string
        scope:
          type: string
        detail:
          type: string

    PlatformUser:
      type: object
      required: [id, name, email, area, profileId, clearance]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        profileId:
          type: string
          description: superadmin | admin | editor | audit
        clearance:
          type: string
          description: public | internal | confidential | restricted

    ScheduledDocument:
      type: object
      required: [id, template, frequency, languages, owner, reviewFolder, sourceDocId, status]
      properties:
        id:
          type: string
        template:
          type: string
        frequency:
          type: string
        languages:
          type: array
          items:
            type: string
        owner:
          type: string
        reviewFolder:
          type: string
        sourceDocId:
          type: ["string", "null"]
        sourceTitle:
          type: ["string", "null"]
        status:
          type: string
          description: active | paused | orphaned

    AuditEntry:
      type: object
      required: [id, actor, action, target, kind, timestamp, detail]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        kind:
          type: string
          description: permission | user | schedule | run
        timestamp:
          type: string
        detail:
          type: string

    GraphEntity:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: market | brand | executive | axis
        relation:
          type: ["string", "null"]

    SuggestedQuery:
      type: object
      required: [id, text, kind]
      properties:
        id:
          type: string
        text:
          type: string
        kind:
          type: string
          description: cited | no_evidence | permission | historic

    StrategicAxis:
      type: object
      required: [id, name, color, description]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        description:
          type: string

    Role:
      type: object
      required: [id, label, clearance, area, description]
      properties:
        id:
          type: string
        label:
          type: string
        clearance:
          type: string
          description: public | internal | confidential | restricted
        area:
          type: string
        description:
          type: string

    CorpusDocument:
      type: object
      required:
        [id, title, country, brand, entity, quarter, type, confidentiality, owner, validity, language, topics, axisIds, summary, chunkCount, sourceFormat, connector]
      properties:
        id:
          type: string
        title:
          type: string
        country:
          type: string
        brand:
          type: string
        entity:
          type: string
        quarter:
          type: string
        type:
          type: string
        confidentiality:
          type: string
        owner:
          type: string
        validity:
          type: string
        validUntil:
          type: ["string", "null"]
        language:
          type: string
        topics:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string
        summary:
          type: string
        chunkCount:
          type: integer
        sourceFormat:
