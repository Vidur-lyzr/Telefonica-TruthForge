            - $ref: "#/components/schemas/TaxonomyAxisEdit"
            - type: "null"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/RetagDecision"

    RetagApplyResult:
      type: object
      required: [version, appliedCount, rejectedCount]
      properties:
        version:
          type: integer
        appliedCount:
          type: integer
        rejectedCount:
          type: integer
