openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hub SSoT — governed, agentic Single Source of Truth for Telefónica
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ask
    description: Cited agentic question answering
  - name: knowledge
    description: Governed knowledge corpus, axes, roles
  - name: admin
    description: Administration backend — profiles, users, schedules, audit
  - name: kpis
    description: Governed KPI / objective tracking
  - name: wiki
    description: Wiki / Knowledge surface — map, compiled pages, sources, compiled-layer ask
  - name: data
    description: Data Center — sources, ingestion pipeline, validation queue, freshness
  - name: brand-room
    description: Brand Room — templates, tone of voice, governed resources, live Brand Guardian
  - name: quality
    description: Quality & feedback — golden-set evaluation runs, answer feedback, triage queue
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ask:
    post:
      operationId: ask
      tags: [ask]
      summary: Ask a question over the governed knowledge core
      description: >
        Runs the Hub SSoT agent. Resolves the user's permission scope, retrieves
        permission-filtered evidence, and composes a cited answer — or returns an
        honest "no evidence" or "permission blocked" result. The model never sees
        a chunk the user cannot access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [ask]
      summary: Suggested starter questions
      description: Example questions, including ones that showcase no-evidence, permission blocks, and historic flags.
      responses:
        "200":
          description: Suggested questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedQuery"

  /axes:
    get:
      operationId: listAxes
      tags: [knowledge]
      summary: The five Transform & Grow strategic axes
      responses:
        "200":
          description: Strategic axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicAxis"

  /roles:
    get:
      operationId: listRoles
      tags: [knowledge]
      summary: Selectable permission scopes (demo personas)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /documents:
    get:
      operationId: listDocuments
      tags: [knowledge]
      summary: Governed corpus documents with their metadata contract
      responses:
        "200":
          description: Corpus documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorpusDocument"

  /corpus/stats:
    get:
      operationId: getCorpusStats
      tags: [knowledge]
      summary: Corpus governance overview (counts and breakdowns)
      description: >
        Governance overview of the corpus. When roleId is supplied, counts and
        breakdowns are filtered to what the persona's clearance may see
        (fail-closed). When omitted, the full governed corpus is reported.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Optional persona id to scope stats by clearance
      responses:
        "200":
          description: Corpus statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusStats"

  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [knowledge]
      summary: Preview counts for the four Home app cards
      description: >
        Returns one live preview number per app (Generate, KPIs, Planning, Ask),
        scoped to what the active persona's clearance may see (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"

  /radar:
    get:
      operationId: listRadar
      tags: [knowledge]
      summary: Permission-aware radar of what changed
      description: >
        Things that moved — external signals, knowledge events, and the
        persona's own queue — filtered to the persona's clearance (fail-closed)
        and ordered most-recent-first.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Radar items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarItem"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [knowledge]
      summary: A single document with its extracted chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/profiles:
    get:
      operationId: listAdminProfiles
      tags: [admin]
      summary: The five platform access profiles with their capability-matrix rows
      responses:
        "200":
          description: Access profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProfile"

  /admin/users:
    get:
      operationId: listPlatformUsers
      tags: [admin]
      summary: Registered platform users with area, profile and confidentiality tier
      description: >
        Requires the manage_users_roles capability. Admins (partial) see only
        the users of their own area; the Superadmin sees everyone.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"
        "403":
          description: Persona lacks the manage_users_roles capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/schedules:
    get:
      operationId: listScheduledDocuments
      tags: [admin]
      summary: Recurring document schedules (source-resolved status)
      description: Requires the ingest_documents capability.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scheduled documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledDocument"
        "403":
          description: Persona lacks the ingest_documents capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/audit:
    get:
      operationId: listAuditEntries
      tags: [admin]
      summary: Read-only audit trail of permission changes and scheduled runs
      description: >
        Requires the view_audit capability. Superadmin and Auditor see the full
        trail; Admins (partial) see entries related to their own area.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/retrieval-log:
    get:
      operationId: listRetrievalLog
      tags: [admin]
      summary: Per-query retrieval audit log (who retrieved what, under which filter)
      description: >
        Every governed retrieval — Ask and Generate — appends an entry recording
        the persona, the effective governance filter, and the chunk ids and
        scores returned. Never chunk text. Filterable by document (who accessed
        doc X) and by persona. Requires the view_audit capability — the acting
        persona is viewerRoleId; Admins (partial) see only retrievals made by
        personas of their own area.
      parameters:
        - name: viewerRoleId
          in: query
          required: true
          schema:
            type: string
          description: Acting persona — must hold the view_audit capability
        - name: docId
          in: query
          required: false
          schema:
            type: string
        - name: roleId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Retrieval log page (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalLogPage"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/source-sync:
    get:
      operationId: getSourceSyncState
      tags: [admin]
      summary: Simulated source-system sync state (labels, pending deltas, run history)
      description: Requires the manage_data_center capability.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSyncState"
        "403":
          description: Persona lacks the manage_data_center capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/source-sync/label:
    post:
      operationId: setSourceLabel
      tags: [admin]
      summary: Change a document's confidentiality label in the simulated source system
      description: >
        Upgrades (more restrictive) propagate immediately, like a source webhook.
        Downgrades (less restrictive) become pending deltas applied only by the
        next batch sync run — fail closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSourceLabelInput"
      responses:
        "200":
          description: Updated source sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSyncState"
        "404":
          description: Unknown document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No-op label change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/source-sync/run:
    post:
      operationId: runSourceSync
      tags: [admin]
      summary: Run a batch sync, applying all pending downgrade deltas
      description: >
        Requires the manage_data_center capability at FULL level — batch sync
        applies label downgrades platform-wide, so it is Superadmin-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActingRoleInput"
      responses:
        "200":
          description: Updated source sync state after the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSyncState"
        "403":
          description: Persona lacks full manage_data_center (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/visibility:
    get:
      operationId: getUserVisibilityMatrix
      tags: [admin]
      summary: Per-document visibility matrix for a platform user
      description: >
        Resolves, for every governed document, whether the given user can see
        it and — when blocked — which axis blocks it (clearance or area).
        Access is the intersection of area and confidentiality, resolved by
        the same engine every retrieval path uses. Requires the
        manage_access_control capability; Admins (partial) may only inspect
        users of their own area.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: string
          description: Acting persona — must hold the manage_access_control capability
      responses:
        "200":
          description: Visibility matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityMatrix"
        "403":
          description: Persona lacks the manage_access_control capability, or the target user is outside their area (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/usage:
    get:
      operationId: getUsageMeter
      tags: [admin]
      summary: Per-module counters of the platform's own agent calls and tokens
      description: Requires the view_audit capability (usage is traceability).
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMeter"
        "403":
          description: Persona lacks the view_audit capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/agent/overview:
    get:
      operationId: getAgentOverview
      tags: [admin]
      summary: The live GitAgent identity, parsed from the real agent repo on disk
      description: >
        Reads agent.yaml, the skill catalog and the .gitagent session state from
        the agent repo directory at request time. Nothing is hardcoded; this is
        the same brain the Ask chat runs on. Requires the configure_backend
        capability (Superadmin only).
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOverview"
        "403":
          description: Persona lacks the configure_backend capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/agent/tools:
    get:
      operationId: getAgentTools
      tags: [admin]
      summary: The real tool catalog the runtime binds into the agent
      description: >
        Serialised from the same GCToolDefinition objects the ask pipeline
        injects per run (name, description, input schema), plus the tools
        declared in agent.yaml — not a parallel hand-written list. Requires
        the configure_backend capability (Superadmin only).
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "403":
          description: Persona lacks the configure_backend capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Tool catalog
          content:
            application/json:
              schema:
                type: object
                required: [tools]
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentTool"

  /admin/agent/files:
    get:
      operationId: listAgentFiles
      tags: [admin]
      summary: Flat file listing of the GitAgent repo (tree is built client-side)
      description: Requires the configure_backend capability (Superadmin only).
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "403":
          description: Persona lacks the configure_backend capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: File listing
          content:
            application/json:
              schema:
                type: object
                required: [rootLabel, files]
                properties:
                  rootLabel:
                    type: string
                    description: Display label for the repo root, e.g. agent/
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentFileEntry"

  /admin/agent/file:
    get:
      operationId: getAgentFile
      tags: [admin]
      summary: Read one file from the GitAgent repo (super-user personas only)
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Relative path inside the agent repo, as returned by listAgentFiles
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFileContent"
        "403":
          description: Persona lacks agent-repo access (code agent_repo_restricted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found or not readable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/taxonomy:
    get:
      operationId: getTaxonomyState
      tags: [governance]
      summary: Current taxonomy configuration version and applied version history
      responses:
        "200":
          description: Taxonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonomyState"

  /governance/retag/propose:
    post:
      operationId: proposeRetag
      tags: [governance]
      summary: Step 1-3 of the governed re-tagging pipeline
      description: >
        Takes a taxonomy edit (axis rename / redefinition), builds the mapping
        table of affected documents and produces per-document re-classification
        proposals (LLM zero-shot against the edited axis, with a deterministic
        fallback when the model is unavailable). Nothing is applied — a human
        validates each proposal before apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetagProposeInput"
      responses:
        "200":
          description: Re-tagging proposals awaiting human validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetagProposeResult"
        "404":
          description: Unknown axis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/retag/apply:
    post:
      operationId: applyRetag
      tags: [governance]
      summary: Step 4 — apply human-validated re-tagging as a new taxonomy version
      description: >
        Only accepted decisions are applied. Creates a new persisted taxonomy
        version (metadata only — no re-embedding, no redeploy) and writes an
        audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetagApplyInput"
      responses:
        "200":
          description: Applied taxonomy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetagApplyResult"

  /governance/axes/{axisId}/affected:
    get:
      operationId: listAxisAffectedDocuments
      tags: [governance]
      summary: Live mapping table — documents carrying an axis, read from the vector index
      description: >
        Scrolls the Qdrant payload index for chunks tagged with the axis and
        aggregates them per document (titles joined from the governed corpus),
        so the mapping table is derived from the live index, not a static list.
        The in-memory corpus count is returned alongside for a cross-check.
        Falls back to the in-memory corpus when no vector index is configured.
      parameters:
        - name: axisId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Documents currently tagged with the axis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AxisAffectedDocuments"
        "404":
          description: Unknown axis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/rollback:
    post:
      operationId: rollbackTaxonomy
      tags: [governance]
      summary: Revert the taxonomy to an earlier version (append-only)
      description: >
        Rebuilds the taxonomy state at the target version (seed configuration
        plus every version up to and including it), diffs it against the
        current state, mirrors the reverted tags into the vector index first
        (payload-only), then commits the revert as a NEW taxonomy version —
        history is never rewritten. Runtime-ingested documents outside the
        seed snapshot are never touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxonomyRollbackInput"
      responses:
        "200":
          description: Rollback committed as a new taxonomy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonomyRollbackResult"
        "400":
          description: Unknown or invalid target version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kpis/query:
    post:
      operationId: queryKpis
      tags: [kpis]
      summary: Governed KPI cards for the active persona and filters
      description: >
        Returns the KPI cards a persona is cleared to see, scoped by clearance and
        area, with the selected reporting period applied. A KPI whose internal
        evidence is above the persona's clearance is withheld (fail closed). Also
        returns the available filter facets across the persona's visible KPIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiQueryInput"
      responses:
        "200":
          description: KPI cards and facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiQueryResult"

  /ask/stream:
    post:
      operationId: askStream
      tags: [ask]
      summary: Ask with live progress streaming (Server-Sent Events)
      description: >
        Same governed run as /ask, streamed. Emits SSE events as they genuinely
        happen: `step` (real run milestones — scope resolution, retrieval,
        permission/conflict checks, tool calls, composition), `token` (the
        model's own text deltas), then a terminal `result` event carrying the
        full AskResult (citations always land last), then `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /kpis/ask/stream:
    post:
      operationId: askKpisStream
      tags: [kpis]
      summary: KPI-scoped ask with live progress streaming (Server-Sent Events)
      description: >
        Same governed run as /kpis/ask, streamed. Emits SSE events as they
        genuinely happen: `step` (scope resolution, KPI data read, evidence
        retrieval, composition), `token` (the model's own text deltas), then a
        terminal `result` event carrying the full KpiAskResult, then `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAskInput"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /kpis/ask:
    post:
      operationId: askKpis
      tags: [kpis]
      summary: Ask a question over the KPIs currently in view
      description: >
        Runs the KPI-scoped agent. Retrieval is seeded from the evidence behind the
        KPIs in view (internal source chunks and external mentions), permission
        filtered before the model, and returns a cited answer — or an honest
        no-evidence / permission-blocked result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /kpis/detail:
    post:
      operationId: getKpiDetail
      tags: [kpis]
      summary: Drill-down detail for a single KPI
      description: >
        Returns the time series, breakdowns and composing sources for one KPI,
        scoped to the active persona. Withheld (403) if the persona is not cleared
        for the KPI or its evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiDetailInput"
      responses:
        "200":
          description: KPI detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"
        "403":
          description: Not permitted or not found for this persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kpis/definitions:
    get:
      operationId: listKpiDefinitions
      tags: [kpis]
      summary: Versioned KPI definitions (configuration-as-data)
      description: >
        The full versioned KPI definition registry the calculation engine runs
        on. Seed definitions come from the governed corpus (version 1); admin
        edits append immutable new versions. Intended for the administration
        backend.
      responses:
        "200":
          description: KPI definition records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KpiDefinitionRecord"
    post:
      operationId: upsertKpiDefinition
      tags: [kpis]
      summary: Create a KPI or append a new version of an existing definition
      description: >
        Saves an admin-edited KPI definition. When id is provided, a new
        immutable version is appended to that definition's history; when null,
        a new KPI is created with a deterministic synthetic series. The panel
        always renders the latest version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiDefinitionInput"
      responses:
        "200":
          description: Updated definition record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDefinitionRecord"
        "400":
          description: Invalid definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kpis/options:
    get:
      operationId: listKpiDefinitionOptions
      tags: [kpis]
      summary: Valid values for the KPI definition editor
      description: >
        The governed vocabularies an administrator can compose a KPI from:
        objectives, strategic axes, markets, brands, initiative types, areas,
        directions and confidentiality levels.
      responses:
        "200":
          description: Definition editor options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDefinitionOptions"

