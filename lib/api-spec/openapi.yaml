        description:
          type: string
        owner:
          type: string
        version:
          type: string
        shapes:
          type: array
          items:
            type: string
          description: Draft shapes this template accepts; empty accepts any.
        formats:
          type: array
          items:
            type: string
            enum: [docx, pptx, pdf, txt, md]
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ExportTemplateBlock"
        preview:
          $ref: "#/components/schemas/ExportTemplatePreview"
        design:
          $ref: "#/components/schemas/ExportTemplateDesign"
        customized:
          type: boolean
          description: True when a saved edit currently replaces the corporate standard.
        rev:
          type: integer
          description: Monotonic revision counter — bumps on every save or reset, used to bust cached previews.

