    ExportTemplateDesign:
      type: object
      description: >
        The deterministic Telefónica design spec the renderers follow for this
        template — cover layout, accent colour role, heading treatment, table
        header style and footer label. Every value maps onto the shared export
        theme tokens; renderers never invent design values.
      required: [coverStyle, accent, headingStyle, tableHeader, footerLabel, tone]
      properties:
        coverStyle:
          type: string
          enum: [navy-full, brand-full, brand-band, masthead, split, minimal]
          description: Cover page layout variant.
        accent:
          type: string
          enum: [brand, navy]
          description: Which theme colour drives heading rules and emphasis.
        headingStyle:
          type: string
          enum: [bar, rule, block]
          description: Section heading treatment — left bar, bottom hairline rule, or tinted block.
        tableHeader:
          type: string
          enum: [navy, brand, light]
          description: Table header row style.
        footerLabel:
          type: string
          description: Template-specific footer wording on every content page.
        tone:
          type: string
          description: One-line voice guidance shown with the template.

