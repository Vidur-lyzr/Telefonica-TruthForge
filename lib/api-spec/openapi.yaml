          type: string
          minLength: 1
        roleId:
          type: string
          description: Active persona id (drives clearance)
        audience:
          type: string
          description: internal | external
        language:
          type: string
          description: BCP-47-ish code, e.g. en, es
        confidentiality:
          type: string
          description: Destination confidentiality of the document
        format:
          type: string
          description: Output format hint, e.g. document, email, note
