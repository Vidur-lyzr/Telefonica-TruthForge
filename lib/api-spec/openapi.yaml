            application/json:
              schema:
                $ref: "#/components/schemas/PlanningAskResult"

  /planning/forecast:
    post:
      operationId: planningForecast
      tags: [planning]
      summary: Generate a cited 10-day forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningForecastInput"
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningForecast"

  /generate:
    post:
      operationId: generate
      tags: [generate]
      summary: Generate a governed document (messaging, press+Q&A, or multi-format)
      description: >
        Runs the document-generation engine. Resolves the persona's clearance,
        applies the audience gate (external caps sources to public BEFORE
        retrieval), retrieves permission-filtered evidence, composes a cited
        draft, and runs the Brand Guardian. Returns an honest no_evidence /
        permission_blocked state when nothing can be safely produced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: A generated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"

  /generate/refine:
    post:
      operationId: refineDocument
      tags: [generate]
      summary: Refine an existing draft with a natural-language instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "200":
          description: The refined draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"

  /generate/check:
    post:
      operationId: checkDocument
      tags: [generate]
      summary: Re-run the Brand Guardian on a (possibly edited) draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInput"
      responses:
        "200":
          description: Guardian verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResult"

  /generate/canvas/suggestions:
    post:
      operationId: canvasSuggestions
      tags: [generate]
      summary: Governed contextual suggestions for one draft block
      description: >
        Derives the contextual agent actions for a single block from live
        corpus state — sibling-period figures in the numeric store, superseded
        or historic cited sources, contradiction links, uncited figures,
        non-public citations and missing required disclaimers. A suggestion is
        only returned when its condition is true right now; no dead buttons.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasSuggestionsInput"
      responses:
        "200":
          description: Contextual suggestions for the block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasSuggestionsResult"

  /generate/canvas/edit:
    post:
      operationId: canvasEditBlock
      tags: [generate]
      summary: Apply a governed, block-scoped agent edit to one draft section
      description: >
        Rewrites ONLY the addressed block under the full governance chain:
        retrieval through the shared access resolver at the persona clearance
        capped by the destination (external audiences retrieve public-only),
        citation markers verified against actually retrieved sources, Brand
        Guardian re-run on the result (an error-severity finding blocks the
        edit), and an audit entry recording persona, block, prompt, filter
        expression, retrieved sources with access decisions and before/after
        content. Locked blocks (boilerplate, contact, logo) are refused with
        409 block_locked. Every other block stays byte-identical.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanvasEditInput"
      responses:
        "200":
          description: Edit outcome — applied, guardian-blocked, or honest no-evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasEditResult"
        "409":
          description: The block is locked and cannot be edited by the agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/canvas/audit:
    get:
      operationId: listCanvasEdits
      tags: [generate]
      summary: Audit trail of governed canvas block edits
      responses:
        "200":
          description: Canvas edit audit entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasEditAuditList"

  /generate/shapes:
    get:
      operationId: listShapes
      tags: [generate]
      summary: The document shapes / templates the engine can produce
      responses:
        "200":
          description: Document shapes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentShape"

  /generate/assets:
    get:
      operationId: listAssets
      tags: [generate]
      summary: Governed assets (approved claims, quotes, boilerplate, disclaimers, glossary)
      responses:
        "200":
          description: Governed assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedAssets"

  /generate/schedules:
    get:
      operationId: listSchedules
      tags: [generate]
      summary: Scheduled document definitions
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [generate]
      summary: Create a scheduled document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleInput"
      responses:
        "200":
          description: The created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /generate/schedules/{id}/run:
    post:
      operationId: runSchedule
      tags: [generate]
      summary: Run a schedule now and place the result in the review inbox
      description: Requires the approve_sensitive capability (schedule runs feed the review inbox).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActingRoleInput"
      responses:
        "200":
          description: The review item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "403":
          description: Persona lacks the approve_sensitive capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/inbox:
    get:
      operationId: listReviewItems
      tags: [generate]
      summary: The human review inbox for scheduled documents
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"

  /generate/inbox/{id}/approve:
    post:
      operationId: approveReviewItem
      tags: [generate]
      summary: Approve a review item (requires a passing Brand Guardian verdict)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveInput"
      responses:
        "200":
          description: The approved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Guardian has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/inbox/{id}/publish:
    post:
      operationId: publishReviewItem
      tags: [generate]
      summary: Publish an approved review item into the governed corpus as an E document
      description: >
        Server-authoritative write-back. Requires the item to be approved and
        its content hash to still match the approved hash. Creates a versioned
        category-E corpus document (v1, or vN+1 superseding the previous
        publication of the same schedule), chunks it per section, upserts it to
        the vector index with durable payloads, and makes it immediately
        retrievable and citable in Ask.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActingRoleInput"
      responses:
        "200":
          description: Publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishReviewItemResult"
        "403":
          description: Persona lacks the approve_sensitive capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not approved, hash mismatch, or already published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/versions:
    get:
      operationId: listVersions
      tags: [generate]
      summary: Saved document versions (file-backed; survive restarts)
      description: >-
        When roleId is supplied, the list is scoped to versions saved from that
        persona's own drafts (fail-closed: an unknown roleId is rejected). This
        keeps persona-scoped surfaces such as Planning from exposing versions
        authored under a different clearance.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Optional persona id; scopes the list to that persona's own saved versions
      responses:
        "200":
          description: Saved versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedVersion"
    post:
      operationId: saveVersion
      tags: [generate]
      summary: Save a draft as a version (requires a passing Brand Guardian verdict)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveVersionInput"
      responses:
        "200":
          description: The saved version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedVersion"
        "409":
          description: Guardian has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/export:
    post:
      operationId: exportDocument
      tags: [generate]
      summary: Export a guardian-passed draft as a real .docx, .pptx or .pdf file
      description: >
        Renders the draft into a Telefónica-templated binary document with
        embedded on-brand charts. Governance is enforced server-side before any
        byte is rendered: the Brand Guardian is re-run, scheduled drafts must
        match their approved content hash, and an external destination refuses
        any non-public content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDocumentInput"
      responses:
        "200":
          description: The rendered document (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "409":
          description: Export refused by a governance gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/export/pack:
    post:
      operationId: exportDocumentPack
      tags: [generate]
      summary: Export a guardian-passed draft as a ZIP bundle of several formats
      description: >
        Renders the draft in each requested format (or every format the bound
        template offers) and bundles them into one ZIP. Every governance gate of
        a single-format export runs per rendered file — a pack can never bypass
        a refusal a single download would hit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPackInput"
      responses:
        "200":
          description: The ZIP bundle (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "409":
          description: Export refused by a governance gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/export-preview:
    post:
      operationId: exportDocumentPreview
      tags: [generate]
      summary: WYSIWYG preview of the exact document an export would download
      description: >
        Renders the draft through the SAME export pipeline and template engine
        as a real download and returns the rendition as a PDF (base64) for
        on-screen display. The PDF preview is the exact engine output a
        download would produce; DOCX and PPTX previews are drawn with the same
        theme, geometry and layout rules as their renderers (print-preview
        approximation — Word/PowerPoint reflow can differ slightly).
        Confidentiality gates run exactly as on export: an external
        destination strips internal-only material and refuses any non-public
        content. Release gates (Brand Guardian, scheduled approval, editorial
        review) do not block the preview — their would-block status is
        reported so the UI can flag that the document cannot be exported yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPreviewInput"
      responses:
        "200":
          description: Preview rendition, or a structured refusal with gate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPreviewResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ask/documents/export:
    post:
      operationId: exportAskDocument
      tags: [ask]
      summary: Download a document generated from an Ask conversation
      description: >
        Renders one format of a document the doc-gen Superflow registered during
        an Ask turn. The full export governance stack runs server-side (Brand
        Guardian re-run, destination gates, external stripping) — a chat-born
        document obeys exactly the same rules as a Generate export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskDocumentExportInput"
      responses:
        "200":
          description: The rendered document (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown document id (documents do not survive a server restart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Export refused by a governance gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ask/documents/export-pack:
    post:
      operationId: exportAskDocumentPack
      tags: [ask]
      summary: Download an Ask-generated document as a ZIP of several formats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskDocumentPackInput"
      responses:
        "200":
          description: The ZIP bundle (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown document id (documents do not survive a server restart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Export refused by a governance gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ask/documents/{documentId}/preview:
    get:
      operationId: getAskDocumentPreview
      tags: [ask]
      summary: Full content of an Ask-generated document for the artifact panel
      description: >
        Returns the composed sections and citations of a document the doc-gen
        Superflow registered during an Ask turn, so the workspace can render it
        inline. Content is served even when the Brand Guardian blocked the
        draft (the panel shows the findings; downloads stay gated server-side
        by the export routes). Documents are in-memory and do not survive a
        server restart.
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskDocumentPreview"
        "404":
          description: Unknown document id (documents do not survive a server restart)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/editorial-review:
    post:
      operationId: recordEditorialReview
      tags: [generate]
      summary: Record a mandatory editorial review of a press release
      description: >
        Registers a human editorial sign-off for a press release, bound to the
        exact content reviewed (server-side content hash). Press exports are
        refused until a review exists for the current content; any later edit
        voids the review. The Brand Guardian must pass before a review can be
        recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReviewInput"
      responses:
        "200":
          description: The recorded review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReviewRecord"
        "409":
          description: Guardian failed or the draft is not reviewable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/suggest-template:
    post:
      operationId: suggestTemplate
      tags: [generate]
      summary: Suggest a governed document shape from a natural-language description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestTemplateInput"
      responses:
        "200":
          description: Suggested template with a pre-filled brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSuggestion"

  /generate/brief-chat:
    post:
      operationId: briefChat
      tags: [generate]
      summary: Guided-chat parameter capture for the document brief
      description: >
        Extracts brief fields from the conversation so far and returns the one
        next question to ask, or completes when enough is captured. Capture
        only — never retrieves evidence or composes content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefChatInput"
      responses:
        "200":
          description: Captured fields and the next question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefChatResult"

  /generate/deliveries:
    get:
      operationId: listDeliveries
      tags: [generate]
      summary: Simulated Teams/email delivery records for scheduled drafts
      description: >
        When a scheduled run lands a draft in the review inbox, the Hub records
        a simulated Teams message and email to the schedule owner. No real
        message is sent — these records make the hand-off auditable.
      responses:
        "200":
          description: Delivery records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryRecord"

  /generate/notifications:
    get:
      operationId: listNotifications
      tags: [generate]
      summary: Notifications for the scheduled-draft review flow
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"
    post:
      operationId: markNotificationsRead
      tags: [generate]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Notifications after marking read
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"

  /generate/jobs:
    post:
      operationId: startGenerateJob
      tags: [generate]
      summary: Start a generation job (observable, staged pipeline)
      description: >
        Starts the same governed compose pipeline as /generate but returns a job
        immediately so the client can poll GET /generate/jobs/{id} and watch the
        real backend phases (retrieving -> composing -> guardian -> done).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "202":
          description: The started job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /generate/refine/jobs:
    post:
      operationId: startRefineJob
      tags: [generate]
      summary: Start a refine job (observable, staged pipeline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "202":
          description: The started job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /generate/jobs/{id}:
    get:
      operationId: getGenerationJob
      tags: [generate]
      summary: Poll the state of a generation/refine job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wiki/graph:
    get:
      operationId: getWikiGraph
      tags: [wiki]
      summary: Permission-filtered knowledge map (nodes and edges)
      description: >
        Returns the knowledge graph shaped for the Map view — axes, compiled
        pages, documents, figures and entities with citation/relationship edges.
        Nodes above the active persona's clearance are surfaced as existence-only
        (locked, contents hidden). Figures fail closed on their source document.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
          description: The active permission scope / persona id
      responses:
        "200":
          description: Wiki graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiGraph"

  /wiki/pages:
    get:
      operationId: listWikiPages
      tags: [wiki]
      summary: Compiled corporate-memory pages (permission-filtered summaries)
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compiled page summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiPageSummary"

  /wiki/page:
    get:
      operationId: getWikiPage
      tags: [wiki]
      summary: A single compiled page with its defended position and evidence
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compiled page detail (locked when above clearance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPageDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wiki/lineage:
    get:
      operationId: listWikiLineage
      tags: [wiki]
      summary: Source inspector — ingestion lineage and validation trail per document
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document lineage entries (locked when above clearance)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiLineage"

  /wiki/stats:
    get:
      operationId: getWikiStats
      tags: [wiki]
      summary: Compounding-memory counter (facts resolved, conflicts settled, pages refined)
      responses:
        "200":
          description: Wiki stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiStats"

  /wiki/search:
    post:
      operationId: searchWiki
      tags: [wiki]
      summary: Ask the compiled layer a question and get a cited answer
      description: >
        Reasons over the compiled corporate-memory pages the persona may access.
        Returns a synthesised answer with evidence chips and wiki-links to lit-up
        pages/nodes — or an honest no-evidence / permission-blocked result. Pages
        above the persona's clearance never reach the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WikiSearchInput"
      responses:
        "200":
          description: Compiled-layer answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSearchResult"

  /data/sources:
    get:
      operationId: listDataSources
      tags: [data]
      summary: Connected sources and connectors with status, cadence and doc count
      responses:
        "200":
          description: Data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"

  /data/ingestion:
    get:
      operationId: getIngestionSnapshot
      tags: [data]
      summary: The 7-stage ingestion pipeline snapshot with quarantine
      responses:
        "200":
          description: Ingestion snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionSnapshot"

  /data/relevance-filter:
    get:
      operationId: getRelevanceFilter
      tags: [data]
      summary: Pre-ingestion relevance filter for external sources — rules and recent kept/dropped mentions
      responses:
        "200":
          description: Relevance filter snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelevanceFilterSnapshot"

  /data/ingest/search:
    post:
      operationId: liveIngestSearch
      tags: [data]
      summary: Live public-data (B) capture — Perplexity search constrained by the pre-ingest filter
      description: >
        Runs a live Perplexity web search restricted to what the editor's
        filter-before-ingest rule matches (keywords / competitors / executives
        / topics). Returns candidate mentions with +/- flags for human review —
        nothing is ingested by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestSearchInput"
      responses:
        "200":
          description: Candidate mentions for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveIngestSearchResult"

  /data/ingest/accept:
    post:
      operationId: liveIngestAccept
      tags: [data]
      summary: Ingest reviewer-accepted public mentions as B-category documents
      description: >
        Accepted candidates become B-category documents with full provenance
        metadata and ingest-filter lineage, are chunked, embedded once, and
        upserted to the vector index like any other governed document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestAcceptInput"
      responses:
        "200":
          description: Created documents and index proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveIngestAcceptResult"

  /data/upload:
    post:
      operationId: manualUpload
      tags: [data]
      summary: Manual document upload — extract, chunk, embed and index a real file
      description: >
        Accepts a real file (PDF, Word .docx, plain text or Markdown), extracts
        its text server-side, splits it into governed chunks, creates an
        A-category corpus document with the metadata the documentalist supplied,
        and upserts the chunks into the vector index. The document is
        immediately retrievable by the Ask agent under the same governance
        filters as any other corpus document, and survives restarts via the
        index payload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ManualUploadForm"
      responses:
        "200":
          description: The created document and index proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualUploadResult"

  /data/validation:
    get:
      operationId: listValidationItems
      tags: [data]
      summary: The validation queue with proposed three-layer classification
      responses:
        "200":
          description: Validation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationItem"

  /data/freshness:
    get:
      operationId: listDocumentFreshness
      tags: [data]
      summary: Per-document SLA and freshness with review-overdue nudges
      responses:
        "200":
          description: Document freshness
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocFreshness"

  /brand/templates:
    get:
      operationId: getBrandTemplates
      tags: [brand-room]
      summary: Governed document templates, permission-filtered by persona clearance
      description: >
        The brand-approved document templates. Templates are internal brand
        governance material, so a lower-clearance persona receives an empty set
        with a blocked count rather than the templates themselves (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandTemplatesView"

  /brand/template:
    get:
      operationId: getBrandTemplate
      tags: [brand-room]
      summary: One governed template's full structure, permission-filtered
      description: >
        The full section blueprint and required disclaimers for a single
        template. Fails closed: an existing but above-clearance template is
        reported as blocked with no content; an unknown id returns 404.
      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
          description: Template id to expand
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandTemplateDetailView"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

  /brand/tone:
    get:
      operationId: getBrandTone
      tags: [brand-room]
      summary: Tone-of-voice principles, hard rules, prohibited phrases and spelling
      responses:
        "200":
          description: Tone of voice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandToneView"

  /brand/resources:
    get:
      operationId: getBrandResources
      tags: [brand-room]
      summary: Governed brand resources, permission-filtered by persona clearance
      description: >
        Corporate brand resources across identity, messaging, legal and
        reference. Each resource carries its own clearance and is filtered to
        what the persona may see before it is returned (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResourcesView"

  /brand/export-templates:
    get:
      operationId: getExportTemplates
      tags: [brand-room]
      summary: Export template library for governed document downloads
      description: >
        The Telefónica export templates the export engine can render — talking
        points, press release, Q&A briefing, generic report, KPI report and the
        10-day forecast — with their structure and an illustrative preview.
      responses:
        "200":
          description: Export templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportTemplate"

  /brand/export-template-preview:
    get:
      operationId: getExportTemplatePreview
      tags: [brand-room]
      summary: Server-rendered page preview of an export template
      description: >
        A deterministic PNG rendering of one page (cover or body) of the given
        export template, drawn from the same theme tokens, chart engine and
