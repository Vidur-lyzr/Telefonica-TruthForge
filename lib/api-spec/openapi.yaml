      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCheckInput"
      responses:
        "200":
          description: Guardian verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResult"

