          items:
            $ref: "#/components/schemas/TaxonomyAxisOp"
          description: Structural axis operations (create/retire/rename) committed with this version.

    RetagApplyResult:
      type: object
      required: [version, appliedCount, rejectedCount]
      properties:
        version:
          type: integer
        appliedCount:
          type: integer
        rejectedCount:
          type: integer
        qdrant:
          oneOf:
            - $ref: "#/components/schemas/RetagQdrantProof"
            - type: "null"
          description: Proof that the re-tag was a metadata-only Qdrant payload update — vectors untouched
        proof:
          oneOf:
            - $ref: "#/components/schemas/RetagProof"
            - type: "null"
          description: Anti-fakeness instrumentation (embed counter, vector hashes, filter flips).

    RetagQdrantProof:
      type: object
      description: Evidence that Apply issued set_payload only — no re-embedding, no re-ingestion
      required: [updatedDocs, pointsBefore, pointsAfter]
      properties:
        updatedDocs:
          type: integer
          description: Documents whose Qdrant chunk payloads were updated in place
        pointsBefore:
          type: integer
          description: Vector point count before Apply
        pointsAfter:
          type: integer
          description: Vector point count after Apply (identical — nothing re-embedded)

    RetagVectorHashCheck:
      type: object
      description: Hash of ALL stored dense vectors of one re-tagged document, before and after the payload write.
      required: [docId, pointCount, before, after, identical]
      properties:
        docId:
          type: string
        pointCount:
          type: integer
        before:
          type: string
        after:
          type: string
        identical:
          type: boolean

    RetagFilterCheck:
      type: object
      description: Exact Qdrant count for docId AND axisId, before and after the payload write.
      required: [docId, axisId, expectation, beforeCount, afterCount, passed]
      properties:
        docId:
          type: string
        axisId:
          type: string
        expectation:
          type: string
          description: removed | added | kept
        beforeCount:
          type: integer
        afterCount:
          type: integer
        passed:
          type: boolean

    RetagProof:
      type: object
      description: >
        Anti-fakeness instrumentation gathered during Apply: the embedding
        call counter must not move, dense vector hashes must be identical
        before and after, and the axis payload filter must genuinely flip.
      required: [embedCallsBefore, embedCallsAfter, embedCallsDelta, vectorHashes, filterChecks]
      properties:
        embedCallsBefore:
          type: integer
        embedCallsAfter:
          type: integer
        embedCallsDelta:
          type: integer
          description: Must be 0 — re-tagging never computes an embedding.
        vectorHashes:
          type: array
          items:
            $ref: "#/components/schemas/RetagVectorHashCheck"
        filterChecks:
          type: array
          items:
            $ref: "#/components/schemas/RetagFilterCheck"

    AxisAffectedDocument:
      type: object
      required: [docId, title, type, confidentiality, axisIds, topics, pointCount]
      properties:
        docId:
          type: string
        title:
          type: string
        type:
          type: string
        confidentiality:
          type: string
        axisIds:
          type: array
          items:
            type: string
        topics:
          type: array
          items:
            type: string
        pointCount:
          type: integer
          description: Chunk points in the vector index carrying this axis for this document.

    AxisAffectedDocuments:
      type: object
      required: [axisId, axisName, source, docs, memoryDocCount, qdrantDocCount, totalPoints, countsMatch]
      properties:
        axisId:
          type: string
        axisName:
          type: string
        source:
          type: string
          description: qdrant | memory
        docs:
          type: array
          items:
            $ref: "#/components/schemas/AxisAffectedDocument"
        memoryDocCount:
          type: integer
          description: Documents carrying the axis in the in-memory working set.
        qdrantDocCount:
          type: ["integer", "null"]
          description: Distinct documents carrying the axis in the vector index (null without an index).
        totalPoints:
          type: ["integer", "null"]
          description: Chunk points carrying the axis in the vector index.
        countsMatch:
          type: boolean
          description: Whether the index-derived document count equals the in-memory count.

    TaxonomyRollbackInput:
      type: object
      required: [toVersion, actor, roleId]
      properties:
        toVersion:
          type: integer
        actor:
          type: string
        roleId:
          type: string
          description: Acting persona — must hold the manage_data_center capability at full level

    TaxonomyRollbackResult:
      type: object
      required: [version, toVersion, revertedDocs, axesChanged]
      properties:
        version:
          type: integer
          description: The NEW version number the rollback was committed as.
        toVersion:
          type: integer
        revertedDocs:
          type: integer
        axesChanged:
          type: integer
          description: Axes whose name/description/retired state changed in the revert.
        qdrant:
          oneOf:
            - $ref: "#/components/schemas/RetagQdrantProof"
            - type: "null"

    QualityGolden:
      type: object
      required: [id, question, roleId, lang, expectedStatus, rationale]
      properties:
        id:
          type: string
        question:
          type: string
        roleId:
          type: string
          description: Persona the question is asked as — governance is part of what is tested.
        lang:
          type: string
          description: en | es | de | pt
        expectedStatus:
          type: string
          description: answered | no_evidence | permission_blocked | conflict
        expectedDocIds:
          type: array
          items:
            type: string
          description: For answered goldens, at least one of these must be cited.
        expectHistoric:
          type: boolean
        rationale:
          type: string

    QualityGoldenSet:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityGolden"

    QualityEvalMetrics:
      type: object
      required:
        [total, passed, failed, accuracy, hallucinationRate, p50LatencyMs, p95LatencyMs]
      properties:
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        accuracy:
          type: number
          description: 0..1 — goldens fully passed.
        citationCorrectness:
          type: ["number", "null"]
          description: 0..1 — cited sources grounded in the audited retrieval; null when no row carried citations.
        hallucinationRate:
          type: number
          description: 0..1 — rows with fabricated evidence, i.e. a citation outside the row's own audited retrieval. Refusal misses count against accuracy, not here.
        p50LatencyMs:
          type: number
        p95LatencyMs:
          type: number

    QualityEvalResultRow:
      type: object
      required:
        [
          goldenId,
          question,
          roleId,
          lang,
          expectedStatus,
          citedDocIds,
          citationsTotal,
          citationsGrounded,
          hallucinated,
          pass,
          latencyMs,
        ]
      properties:
        goldenId:
          type: string
        question:
          type: string
        roleId:
          type: string
        lang:
          type: string
        expectedStatus:
          type: string
        actualStatus:
          type: ["string", "null"]
          description: Null when the golden errored before a status was produced.
        citedDocIds:
          type: array
          items:
            type: string
        expectedDocCited:
          type: ["boolean", "null"]
          description: Whether at least one expected doc was cited; null when not applicable.
        historicOk:
          type: ["boolean", "null"]
        citationsTotal:
          type: integer
        citationsGrounded:
          type: integer
        hallucinated:
          type: boolean
        pass:
          type: boolean
        latencyMs:
          type: number
        error:
          type: ["string", "null"]

    QualityEvalRunSummary:
      type: object
      required:
        [id, trigger, startedAt, status, progressDone, progressTotal]
      properties:
        id:
          type: string
        trigger:
          type: string
          description: scheduled | manual | reeval
        reevalOfFeedbackId:
          type: ["string", "null"]
        startedAt:
          type: string
        finishedAt:
          type: ["string", "null"]
        status:
          type: string
          description: running | completed | failed
        progressDone:
          type: integer
        progressTotal:
          type: integer
        metrics:
          oneOf:
            - $ref: "#/components/schemas/QualityEvalMetrics"
            - type: "null"
        error:
          type: ["string", "null"]

    QualityEvalRun:
      allOf:
        - $ref: "#/components/schemas/QualityEvalRunSummary"
        - type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/QualityEvalResultRow"

    QualityRunsPage:
      type: object
      required: [nextEvalAt, running, items]
      properties:
        nextEvalAt:
          type: ["string", "null"]
          description: When the weekly scheduled evaluation fires next.
        running:
          type: boolean
          description: Whether a run is currently in flight.
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityEvalRunSummary"

    QualityRunStartBody:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          description: Acting persona — must hold the approve_sensitive capability at full level.

    QualityRunStarted:
      type: object
      required: [runId]
      properties:
        runId:
          type: string

    QualityFeedbackBody:
      type: object
      required: [roleId, verdict, question, answer, status]
      properties:
        roleId:
          type: string
          description: Acting persona — must hold the use_modules capability.
        verdict:
          type: string
          description: correct | partial | incorrect | fabricated
        question:
          type: string
        answer:
          type: string
          description: The answer text as shown; only a preview is stored.
        status:
          type: string
          description: The answer's governance status (answered | no_evidence | permission_blocked | conflict).
        citedDocIds:
          type: array
          items:
            type: string
        auditId:
          type: ["string", "null"]
          description: The turn's retrieval-audit id, when it had one.
        note:
          type: ["string", "null"]
        lang:
          type: ["string", "null"]

    QualityFeedbackTriage:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: open | classified | resolved
        errorClass:
          type: ["string", "null"]
          description: retrieval_miss | stale_source | bad_citation | model_error | permission_gap | not_an_error
        correctiveAction:
          type: ["string", "null"]
        classifiedByRoleId:
          type: ["string", "null"]
        classifiedAt:
          type: ["string", "null"]
        reevalRunId:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]

    QualityFeedbackEntry:
      type: object
      required:
        [id, createdAt, verdict, question, answerPreview, answerStatus, citedDocIds, roleId, triage]
      properties:
        id:
          type: string
        createdAt:
          type: string
        verdict:
          type: string
          description: correct | partial | incorrect | fabricated
        note:
          type: ["string", "null"]
        question:
          type: string
        answerPreview:
          type: string
        answerStatus:
          type: string
        citedDocIds:
          type: array
          items:
            type: string
        roleId:
          type: string
        lang:
          type: ["string", "null"]
        auditId:
          type: ["string", "null"]
        triage:
          $ref: "#/components/schemas/QualityFeedbackTriage"

    QualityFeedbackDetail:
      allOf:
        - $ref: "#/components/schemas/QualityFeedbackEntry"
        - type: object
          properties:
            retrievalTrace:
              oneOf:
                - $ref: "#/components/schemas/RetrievalLogEntry"
                - type: "null"
              description: Snapshot of the audited retrieval taken at feedback time.

    QualityFeedbackPage:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityFeedbackEntry"

    QualityClassifyBody:
      type: object
      required: [roleId, feedbackId, errorClass, correctiveAction]
      properties:
        roleId:
          type: string
          description: Acting persona — must hold the approve_sensitive capability at full level.
        feedbackId:
          type: string
        errorClass:
          type: string
          description: retrieval_miss | stale_source | bad_citation | model_error | permission_gap | not_an_error
        correctiveAction:
          type: string
          description: What was done about it — free text, shown in the queue and the audit trail.

    QualityReevalBody:
      type: object
      required: [roleId, feedbackId]
      properties:
        roleId:
          type: string
          description: Acting persona — must hold the approve_sensitive capability at full level.
        feedbackId:
          type: string
