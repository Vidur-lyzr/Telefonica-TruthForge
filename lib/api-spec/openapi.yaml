      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportTemplateOverrideRequest"
      responses:
        "200":
          description: The effective template after the save or reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportTemplateOverrideResponse"
        "400":
          description: Invalid edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

