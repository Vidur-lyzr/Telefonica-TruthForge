        "200":
          description: Current skill document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandSkill"
    put:
      operationId: updateBrandSkill
      tags: [brand-room]
      summary: Update the Brand Guardian skill document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandSkillUpdate"
      responses:
        "200":
          description: Updated skill document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandSkill"

