      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: true
          schema:
            type: string
            enum: [cover, body]
      responses:
        "200":
          description: The rendered preview page
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brand/export-template-rendition:
    post:
      operationId: renderExportTemplateRendition
      tags: [brand-room]
      summary: Full-document rendition of an export template's sample content
      description: >
        Renders the template's built-in illustrative sample through the same
        renderers the real export uses and returns a PDF rendition. For pdf the
        bytes come from the exact export renderer; for docx and pptx the PDF is
        a faithful print rendition of the same template, content and layout.
        An optional unsaved edit can be applied so the editor previews changes
        before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportTemplateRenditionRequest"
      responses:
        "200":
          description: PDF rendition of the template sample
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportTemplateRenditionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brand/export-template-override:
    post:
      operationId: saveExportTemplateOverride
      tags: [brand-room]
      summary: Save or reset a governed edit of an export template
      description: >
