openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hub SSoT — governed, agentic Single Source of Truth for Telefónica
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ask
    description: Cited agentic question answering
  - name: knowledge
    description: Governed knowledge corpus, axes, roles
  - name: admin
    description: Administration backend — profiles, users, schedules, audit
  - name: kpis
    description: Governed KPI / objective tracking
  - name: wiki
    description: Wiki / Knowledge surface — map, compiled pages, sources, compiled-layer ask
  - name: data
    description: Data Center — sources, ingestion pipeline, validation queue, freshness
  - name: brand-room
    description: Brand Room — templates, tone of voice, governed resources, live Brand Guardian
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ask:
    post:
      operationId: ask
      tags: [ask]
      summary: Ask a question over the governed knowledge core
      description: >
        Runs the Hub SSoT agent. Resolves the user's permission scope, retrieves
        permission-filtered evidence, and composes a cited answer — or returns an
        honest "no evidence" or "permission blocked" result. The model never sees
        a chunk the user cannot access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [ask]
      summary: Suggested starter questions
      description: Example questions, including ones that showcase no-evidence, permission blocks, and historic flags.
      responses:
        "200":
          description: Suggested questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedQuery"

  /axes:
    get:
      operationId: listAxes
      tags: [knowledge]
      summary: The five Transform & Grow strategic axes
      responses:
        "200":
          description: Strategic axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicAxis"

  /roles:
    get:
      operationId: listRoles
      tags: [knowledge]
      summary: Selectable permission scopes (demo personas)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /documents:
    get:
      operationId: listDocuments
      tags: [knowledge]
      summary: Governed corpus documents with their metadata contract
      responses:
        "200":
          description: Corpus documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorpusDocument"

  /corpus/stats:
    get:
      operationId: getCorpusStats
      tags: [knowledge]
      summary: Corpus governance overview (counts and breakdowns)
      description: >
        Governance overview of the corpus. When roleId is supplied, counts and
        breakdowns are filtered to what the persona's clearance may see
        (fail-closed). When omitted, the full governed corpus is reported.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Optional persona id to scope stats by clearance
      responses:
        "200":
          description: Corpus statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusStats"

  /home/summary:
    get:
      operationId: getHomeSummary
      tags: [knowledge]
      summary: Preview counts for the four Home app cards
      description: >
        Returns one live preview number per app (Generate, KPIs, Planning, Ask),
        scoped to what the active persona's clearance may see (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Home summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeSummary"

  /radar:
    get:
      operationId: listRadar
      tags: [knowledge]
      summary: Permission-aware radar of what changed
      description: >
        Things that moved — external signals, knowledge events, and the
        persona's own queue — filtered to the persona's clearance (fail-closed)
        and ordered most-recent-first.
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
        - name: area
          in: query
          required: false
          schema:
            type: string
          description: Active area — Comunicación | Marca | Gabinete
      responses:
        "200":
          description: Radar items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadarItem"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [knowledge]
      summary: A single document with its extracted chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/profiles:
    get:
      operationId: listAdminProfiles
      tags: [admin]
      summary: The four platform access profiles and their scopes
      responses:
        "200":
          description: Access profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProfile"

  /admin/users:
    get:
      operationId: listPlatformUsers
      tags: [admin]
      summary: Registered platform users with area, profile and confidentiality tier
      responses:
        "200":
          description: Platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"

  /admin/schedules:
    get:
      operationId: listScheduledDocuments
      tags: [admin]
      summary: Recurring document schedules (source-resolved status)
      responses:
        "200":
          description: Scheduled documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledDocument"

  /admin/audit:
    get:
      operationId: listAuditEntries
      tags: [admin]
      summary: Read-only audit trail of permission changes and scheduled runs
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /admin/retrieval-log:
    get:
      operationId: listRetrievalLog
      tags: [admin]
      summary: Per-query retrieval audit log (who retrieved what, under which filter)
      description: >
        Every governed retrieval — Ask and Generate — appends an entry recording
        the persona, the effective governance filter, and the chunk ids and
        scores returned. Never chunk text. Filterable by document (who accessed
        doc X) and by persona.
      parameters:
        - name: docId
          in: query
          required: false
          schema:
            type: string
        - name: roleId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Retrieval log page (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalLogPage"

  /admin/source-sync:
    get:
      operationId: getSourceSyncState
      tags: [admin]
      summary: Simulated source-system sync state (labels, pending deltas, run history)
      responses:
        "200":
          description: Source sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSyncState"

  /admin/source-sync/label:
    post:
      operationId: setSourceLabel
      tags: [admin]
      summary: Change a document's confidentiality label in the simulated source system
      description: >
        Upgrades (more restrictive) propagate immediately, like a source webhook.
        Downgrades (less restrictive) become pending deltas applied only by the
        next batch sync run — fail closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSourceLabelInput"
      responses:
        "200":
          description: Updated source sync state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSyncState"
        "404":
          description: Unknown document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No-op label change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/source-sync/run:
    post:
      operationId: runSourceSync
      tags: [admin]
      summary: Run a batch sync, applying all pending downgrade deltas
      responses:
        "200":
          description: Updated source sync state after the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSyncState"

  /admin/visibility/{userId}:
    get:
      operationId: getUserVisibilityMatrix
      tags: [admin]
      summary: Per-document visibility matrix for a platform user
      description: >
        Resolves, for every governed document, whether the given user can see
        it and — when blocked — which axis blocks it (clearance or area).
        Access is the intersection of area and confidentiality, resolved by
        the same engine every retrieval path uses.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Visibility matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibilityMatrix"
        "404":
          description: Unknown user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/usage:
    get:
      operationId: getUsageMeter
      tags: [admin]
      summary: Per-module counters of the platform's own agent calls and tokens
      responses:
        "200":
          description: Usage counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageMeter"

  /governance/taxonomy:
    get:
      operationId: getTaxonomyState
      tags: [governance]
      summary: Current taxonomy configuration version and applied version history
      responses:
        "200":
          description: Taxonomy state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxonomyState"

  /governance/retag/propose:
    post:
      operationId: proposeRetag
      tags: [governance]
      summary: Step 1-3 of the governed re-tagging pipeline
      description: >
        Takes a taxonomy edit (axis rename / redefinition), builds the mapping
        table of affected documents and produces per-document re-classification
        proposals (LLM zero-shot against the edited axis, with a deterministic
        fallback when the model is unavailable). Nothing is applied — a human
        validates each proposal before apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetagProposeInput"
      responses:
        "200":
          description: Re-tagging proposals awaiting human validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetagProposeResult"
        "404":
          description: Unknown axis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /governance/retag/apply:
    post:
      operationId: applyRetag
      tags: [governance]
      summary: Step 4 — apply human-validated re-tagging as a new taxonomy version
      description: >
        Only accepted decisions are applied. Creates a new persisted taxonomy
        version (metadata only — no re-embedding, no redeploy) and writes an
        audit entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetagApplyInput"
      responses:
        "200":
          description: Applied taxonomy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetagApplyResult"

  /kpis/query:
    post:
      operationId: queryKpis
      tags: [kpis]
      summary: Governed KPI cards for the active persona and filters
      description: >
        Returns the KPI cards a persona is cleared to see, scoped by clearance and
        area, with the selected reporting period applied. A KPI whose internal
        evidence is above the persona's clearance is withheld (fail closed). Also
        returns the available filter facets across the persona's visible KPIs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiQueryInput"
      responses:
        "200":
          description: KPI cards and facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiQueryResult"

  /ask/stream:
    post:
      operationId: askStream
      tags: [ask]
      summary: Ask with live progress streaming (Server-Sent Events)
      description: >
        Same governed run as /ask, streamed. Emits SSE events as they genuinely
        happen: `step` (real run milestones — scope resolution, retrieval,
        permission/conflict checks, tool calls, composition), `token` (the
        model's own text deltas), then a terminal `result` event carrying the
        full AskResult (citations always land last), then `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /kpis/ask:
    post:
      operationId: askKpis
      tags: [kpis]
      summary: Ask a question over the KPIs currently in view
      description: >
        Runs the KPI-scoped agent. Retrieval is seeded from the evidence behind the
        KPIs in view (internal source chunks and external mentions), permission
        filtered before the model, and returns a cited answer — or an honest
        no-evidence / permission-blocked result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /kpis/detail:
    post:
      operationId: getKpiDetail
      tags: [kpis]
      summary: Drill-down detail for a single KPI
      description: >
        Returns the time series, breakdowns and composing sources for one KPI,
        scoped to the active persona. Withheld (403) if the persona is not cleared
        for the KPI or its evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiDetailInput"
      responses:
        "200":
          description: KPI detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDetail"
        "403":
          description: Not permitted or not found for this persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kpis/definitions:
    get:
      operationId: listKpiDefinitions
      tags: [kpis]
      summary: Versioned KPI definitions (configuration-as-data)
      description: >
        The full versioned KPI definition registry the calculation engine runs
        on. Seed definitions come from the governed corpus (version 1); admin
        edits append immutable new versions. Intended for the administration
        backend.
      responses:
        "200":
          description: KPI definition records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KpiDefinitionRecord"
    post:
      operationId: upsertKpiDefinition
      tags: [kpis]
      summary: Create a KPI or append a new version of an existing definition
      description: >
        Saves an admin-edited KPI definition. When id is provided, a new
        immutable version is appended to that definition's history; when null,
        a new KPI is created with a deterministic synthetic series. The panel
        always renders the latest version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiDefinitionInput"
      responses:
        "200":
          description: Updated definition record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDefinitionRecord"
        "400":
          description: Invalid definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /kpis/options:
    get:
      operationId: listKpiDefinitionOptions
      tags: [kpis]
      summary: Valid values for the KPI definition editor
      description: >
        The governed vocabularies an administrator can compose a KPI from:
        objectives, strategic axes, markets, brands, initiative types, areas,
        directions and confidentiality levels.
      responses:
        "200":
          description: Definition editor options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDefinitionOptions"

  /kpis/alerts:
    post:
      operationId: listKpiAlerts
      tags: [kpis]
      summary: Threshold and deviation alerts for the persona's visible KPIs
      description: >
        Deterministically recomputed threshold-breach and forecast-deviation
        alerts, recorded per KPI owner with a simulated Teams/email delivery
        channel. Fail closed — a persona only sees alerts for KPIs it could
        open itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAlertListInput"
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KpiAlert"

  /kpis/alerts/ack:
    post:
      operationId: acknowledgeKpiAlert
      tags: [kpis]
      summary: Acknowledge an alert (records who and when in the trail)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiAlertAckInput"
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiAlert"
        "404":
          description: Unknown alert or not visible to this persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/overview:
    get:
      operationId: getPlanningOverview
      tags: [planning]
      summary: Planning surface overview (connected source calendars + anchor date)
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningOverview"

  /planning/events:
    get:
      operationId: listPlanningEvents
      tags: [planning]
      summary: Permission-scoped calendar events for a range and filters
      description: >
        Returns events the active persona is cleared to see. Events above the
        persona's clearance are returned as redacted "busy/blocked" stubs with
        no detail.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: axis
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningEvent"

  /planning/event:
    get:
      operationId: getPlanningEvent
      tags: [planning]
      summary: A single event with its overlapping siblings
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningEventDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/insights:
    get:
      operationId: getPlanningInsights
      tags: [planning]
      summary: Conflicts, gaps, predictions and external signals for a range
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: area
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: axis
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningInsights"

  /planning/events/create:
    post:
      operationId: createPlanningEvent
      tags: [planning]
      summary: Create a calendar activity (permission-checked, synced back to its source)
      description: >
        Creates a new activity in the Hub calendar. The persona must be cleared
        for the requested confidentiality and belong to the activity's area,
        otherwise the request is refused with an honest explanation. Every
        creation produces a simulated write-back record to the origin source,
        labelled pending confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningEventCreateInput"
      responses:
        "200":
          description: Created event and its sync record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningMutationResult"
        "403":
          description: Permission refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/events/update:
    post:
      operationId: updatePlanningEvent
      tags: [planning]
      summary: Edit or move a calendar activity (permission-checked, synced back)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningEventUpdateInput"
      responses:
        "200":
          description: Updated event and its sync record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningMutationResult"
        "403":
          description: Permission refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/sync:
    get:
      operationId: listPlanningSync
      tags: [planning]
      summary: Simulated write-back records to the origin source calendars
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
        - name: eventId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sync records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningSyncRecord"

  /planning/simulate:
    post:
      operationId: simulatePlanningMove
      tags: [planning]
      summary: What-if cascade simulation for moving an activity to a new date
      description: >
        Deterministically reports what moving a permitted activity to a new
        start date would resolve and what it would newly disturb — overlaps,
        near misses and external signals — without changing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningSimulateInput"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningMoveSimulation"
        "404":
          description: Not found or not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /planning/alerts:
    get:
      operationId: listPlanningAlerts
      tags: [planning]
      summary: Deterministic per-owner alerts (milestones, conflicts, deviations)
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Alerts over the persona's permitted events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningAlert"

  /planning/forecast/schedule:
    post:
      operationId: schedulePlanningForecast
      tags: [planning]
      summary: Generate the 10-day forecast as a document and land it in a review folder
      description: >
        Runs the cited 10-day forecast through the document engine and places
        the resulting draft in the requester's review inbox as a scheduled,
        approval-gated item, with a notification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningForecastScheduleInput"
      responses:
        "200":
          description: Review item created from the forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningForecastScheduleResult"

  /planning/forecast/schedules:
    get:
      operationId: listPlanningForecastSchedules
      tags: [planning]
      summary: List the persona's recurring forecast schedules
      description: >
        Returns the recurring 10-day-forecast schedules owned by the persona.
        Any schedule whose interval has elapsed is run on read (a fresh cited
        forecast lands in the review folder) before the list is returned.
      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recurring forecast schedules for this persona
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"

  /planning/forecast/schedules/create:
    post:
      operationId: createPlanningForecastSchedule
      tags: [planning]
      summary: Create a recurring forecast schedule and run its first occurrence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningRecurringForecastInput"
      responses:
        "200":
          description: Recurring schedule created; first forecast landed in the review folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningRecurringForecastResult"

  /planning/forecast/schedules/cancel:
    post:
      operationId: cancelPlanningForecastSchedule
      tags: [planning]
      summary: Cancel a recurring forecast schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningRecurringForecastCancelInput"
      responses:
        "200":
          description: Schedule cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningRecurringForecastCancelResult"

  /planning/ask:
    post:
      operationId: planningAsk
      tags: [planning]
      summary: Scoped natural-language question over the governed calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningAskInput"
      responses:
        "200":
          description: Cited planning answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningAskResult"

  /planning/forecast:
    post:
      operationId: planningForecast
      tags: [planning]
      summary: Generate a cited 10-day forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningForecastInput"
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningForecast"

  /generate:
    post:
      operationId: generate
      tags: [generate]
      summary: Generate a governed document (messaging, press+Q&A, or multi-format)
      description: >
        Runs the document-generation engine. Resolves the persona's clearance,
        applies the audience gate (external caps sources to public BEFORE
        retrieval), retrieves permission-filtered evidence, composes a cited
        draft, and runs the Brand Guardian. Returns an honest no_evidence /
        permission_blocked state when nothing can be safely produced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: A generated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"

  /generate/refine:
    post:
      operationId: refineDocument
      tags: [generate]
      summary: Refine an existing draft with a natural-language instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "200":
          description: The refined draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDraft"

  /generate/check:
    post:
      operationId: checkDocument
      tags: [generate]
      summary: Re-run the Brand Guardian on a (possibly edited) draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInput"
      responses:
        "200":
          description: Guardian verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResult"

  /generate/shapes:
    get:
      operationId: listShapes
      tags: [generate]
      summary: The document shapes / templates the engine can produce
      responses:
        "200":
          description: Document shapes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentShape"

  /generate/assets:
    get:
      operationId: listAssets
      tags: [generate]
      summary: Governed assets (approved claims, quotes, boilerplate, disclaimers, glossary)
      responses:
        "200":
          description: Governed assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedAssets"

  /generate/schedules:
    get:
      operationId: listSchedules
      tags: [generate]
      summary: Scheduled document definitions
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      operationId: createSchedule
      tags: [generate]
      summary: Create a scheduled document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleInput"
      responses:
        "200":
          description: The created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /generate/schedules/{id}/run:
    post:
      operationId: runSchedule
      tags: [generate]
      summary: Run a schedule now and place the result in the review inbox
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The review item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/inbox:
    get:
      operationId: listReviewItems
      tags: [generate]
      summary: The human review inbox for scheduled documents
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"

  /generate/inbox/{id}/approve:
    post:
      operationId: approveReviewItem
      tags: [generate]
      summary: Approve a review item (requires a passing Brand Guardian verdict)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveInput"
      responses:
        "200":
          description: The approved review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Guardian has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/inbox/{id}/publish:
    post:
      operationId: publishReviewItem
      tags: [generate]
      summary: Publish an approved review item into the governed corpus as an E document
      description: >
        Server-authoritative write-back. Requires the item to be approved and
        its content hash to still match the approved hash. Creates a versioned
        category-E corpus document (v1, or vN+1 superseding the previous
        publication of the same schedule), chunks it per section, upserts it to
        the vector index with durable payloads, and makes it immediately
        retrievable and citable in Ask.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishReviewItemResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not approved, hash mismatch, or already published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/versions:
    get:
      operationId: listVersions
      tags: [generate]
      summary: Saved document versions (file-backed; survive restarts)
      responses:
        "200":
          description: Saved versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedVersion"
    post:
      operationId: saveVersion
      tags: [generate]
      summary: Save a draft as a version (requires a passing Brand Guardian verdict)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveVersionInput"
      responses:
        "200":
          description: The saved version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedVersion"
        "409":
          description: Guardian has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/export:
    post:
      operationId: exportDocument
      tags: [generate]
      summary: Export a guardian-passed draft as a real .docx, .pptx or .pdf file
      description: >
        Renders the draft into a Telefónica-templated binary document with
        embedded on-brand charts. Governance is enforced server-side before any
        byte is rendered: the Brand Guardian is re-run, scheduled drafts must
        match their approved content hash, and an external destination refuses
        any non-public content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportDocumentInput"
      responses:
        "200":
          description: The rendered document (binary)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "409":
          description: Export refused by a governance gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/editorial-review:
    post:
      operationId: recordEditorialReview
      tags: [generate]
      summary: Record a mandatory editorial review of a press release
      description: >
        Registers a human editorial sign-off for a press release, bound to the
        exact content reviewed (server-side content hash). Press exports are
        refused until a review exists for the current content; any later edit
        voids the review. The Brand Guardian must pass before a review can be
        recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReviewInput"
      responses:
        "200":
          description: The recorded review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReviewRecord"
        "409":
          description: Guardian failed or the draft is not reviewable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /generate/suggest-template:
    post:
      operationId: suggestTemplate
      tags: [generate]
      summary: Suggest a governed document shape from a natural-language description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestTemplateInput"
      responses:
        "200":
          description: Suggested template with a pre-filled brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateSuggestion"

  /generate/brief-chat:
    post:
      operationId: briefChat
      tags: [generate]
      summary: Guided-chat parameter capture for the document brief
      description: >
        Extracts brief fields from the conversation so far and returns the one
        next question to ask, or completes when enough is captured. Capture
        only — never retrieves evidence or composes content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BriefChatInput"
      responses:
        "200":
          description: Captured fields and the next question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefChatResult"

  /generate/deliveries:
    get:
      operationId: listDeliveries
      tags: [generate]
      summary: Simulated Teams/email delivery records for scheduled drafts
      description: >
        When a scheduled run lands a draft in the review inbox, the Hub records
        a simulated Teams message and email to the schedule owner. No real
        message is sent — these records make the hand-off auditable.
      responses:
        "200":
          description: Delivery records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryRecord"

  /generate/notifications:
    get:
      operationId: listNotifications
      tags: [generate]
      summary: Notifications for the scheduled-draft review flow
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"
    post:
      operationId: markNotificationsRead
      tags: [generate]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Notifications after marking read
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationRecord"

  /generate/jobs:
    post:
      operationId: startGenerateJob
      tags: [generate]
      summary: Start a generation job (observable, staged pipeline)
      description: >
        Starts the same governed compose pipeline as /generate but returns a job
        immediately so the client can poll GET /generate/jobs/{id} and watch the
        real backend phases (retrieving -> composing -> guardian -> done).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "202":
          description: The started job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /generate/refine/jobs:
    post:
      operationId: startRefineJob
      tags: [generate]
      summary: Start a refine job (observable, staged pipeline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefineInput"
      responses:
        "202":
          description: The started job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"

  /generate/jobs/{id}:
    get:
      operationId: getGenerationJob
      tags: [generate]
      summary: Poll the state of a generation/refine job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationJob"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

