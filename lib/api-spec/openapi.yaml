      type: object
      required: [documentId, format]
      properties:
        documentId:
          type: string
        format:
          type: string
          enum: [docx, pptx, pdf, txt, md]
        destination:
          type: string
          enum: [internal, external]
          description: Defaults to internal; external strips internal-only material and refuses non-public content.

    AskDocumentPackInput:
      type: object
      required: [documentId]
      properties:
        documentId:
          type: string
        formats:
          type: array
          items:
            type: string
            enum: [docx, pptx, pdf, txt, md]
          description: Formats to bundle; empty/absent bundles every format the template offers.
        destination:
          type: string
          enum: [internal, external]

