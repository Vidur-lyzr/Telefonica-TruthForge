openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hub SSoT — governed, agentic Single Source of Truth for Telefónica
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ask
    description: Cited agentic question answering
  - name: knowledge
    description: Governed knowledge corpus, axes, roles
  - name: admin
    description: Administration backend — profiles, users, schedules, audit
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ask:
    post:
      operationId: ask
      tags: [ask]
      summary: Ask a question over the governed knowledge core
      description: >
        Runs the Hub SSoT agent. Resolves the user's permission scope, retrieves
        permission-filtered evidence, and composes a cited answer — or returns an
        honest "no evidence" or "permission blocked" result. The model never sees
        a chunk the user cannot access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Agent result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResult"

  /suggestions:
    get:
      operationId: listSuggestions
      tags: [ask]
      summary: Suggested starter questions
      description: Example questions, including ones that showcase no-evidence, permission blocks, and historic flags.
      responses:
        "200":
          description: Suggested questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SuggestedQuery"

  /axes:
    get:
      operationId: listAxes
      tags: [knowledge]
      summary: The five Transform & Grow strategic axes
      responses:
        "200":
          description: Strategic axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicAxis"

  /roles:
    get:
      operationId: listRoles
      tags: [knowledge]
      summary: Selectable permission scopes (demo personas)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /documents:
    get:
      operationId: listDocuments
      tags: [knowledge]
      summary: Governed corpus documents with their metadata contract
      responses:
        "200":
          description: Corpus documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorpusDocument"

  /corpus/stats:
    get:
      operationId: getCorpusStats
      tags: [knowledge]
      summary: Corpus governance overview (counts and breakdowns)
      responses:
        "200":
          description: Corpus statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusStats"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [knowledge]
      summary: A single document with its extracted chunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorpusDocumentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/profiles:
    get:
      operationId: listAdminProfiles
      tags: [admin]
      summary: The four platform access profiles and their scopes
      responses:
        "200":
          description: Access profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProfile"

  /admin/users:
    get:
      operationId: listPlatformUsers
      tags: [admin]
      summary: Registered platform users with area, profile and confidentiality tier
      responses:
        "200":
          description: Platform users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"

  /admin/schedules:
    get:
      operationId: listScheduledDocuments
      tags: [admin]
      summary: Recurring document schedules (source-resolved status)
      responses:
        "200":
          description: Scheduled documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledDocument"

  /admin/audit:
    get:
      operationId: listAuditEntries
      tags: [admin]
      summary: Read-only audit trail of permission changes and scheduled runs
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AskInput:
      type: object
      required: [question, area, roleId]
      properties:
        question:
          type: string
          minLength: 1
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        roleId:
          type: string
          description: The active permission scope / persona id

    AskResult:
      type: object
      required: [status, answer, citations, historic, axisIds]
      properties:
        status:
          type: string
          description: answered | no_evidence | permission_blocked
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        historic:
          type: boolean
        historicNote:
          type: ["string", "null"]
        permissionNote:
          type: ["string", "null"]
        axisIds:
          type: array
          items:
            type: string
        numeric:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
        relatedEntities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"

    Citation:
      type: object
      required: [id, docId, docTitle, sourceLoc, version, owner, confidence, confidentiality, validity, snippet]
      properties:
        id:
          type: string
          description: Marker referenced in the answer, e.g. S1
        docId:
          type: string
        docTitle:
          type: string
        sourceLoc:
          type: string
          description: Human-readable location, e.g. "Q1 2026 Results › slide 12"
        version:
          type: string
        owner:
          type: string
        validUntil:
          type: ["string", "null"]
        confidence:
          type: number
        confidentiality:
          type: string
          description: public | internal | confidential | restricted
        validity:
          type: string
          description: approved | historic | review | superseded
        snippet:
          type: string
        value:
          type: ["string", "null"]
          description: Optional headline figure for numeric evidence
        country:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        axisIds:
          type: array
          items:
            type: string

    NumericFact:
      type: object
      required: [label, value, unit, period, source]
      properties:
        label:
          type: string
        value:
          type: string
        unit:
          type: string
        period:
          type: string
        source:
          type: string

    AdminProfile:
      type: object
      required: [id, label, scope, detail]
      properties:
        id:
          type: string
          description: superadmin | admin | editor | audit
        label:
          type: string
        scope:
          type: string
        detail:
          type: string

    PlatformUser:
      type: object
      required: [id, name, email, area, profileId, clearance]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        profileId:
          type: string
          description: superadmin | admin | editor | audit
        clearance:
          type: string
          description: public | internal | confidential | restricted

    ScheduledDocument:
      type: object
      required: [id, template, frequency, languages, owner, reviewFolder, sourceDocId, status]
      properties:
        id:
          type: string
        template:
          type: string
        frequency:
          type: string
        languages:
          type: array
          items:
            type: string
        owner:
          type: string
        reviewFolder:
          type: string
        sourceDocId:
          type: ["string", "null"]
        sourceTitle:
          type: ["string", "null"]
        status:
          type: string
          description: active | paused | orphaned

    AuditEntry:
      type: object
      required: [id, actor, action, target, kind, timestamp, detail]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        kind:
          type: string
          description: permission | user | schedule | run
        timestamp:
          type: string
        detail:
          type: string

    GraphEntity:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: market | brand | executive | axis
        relation:
          type: ["string", "null"]

    SuggestedQuery:
      type: object
      required: [id, text, kind]
      properties:
        id:
          type: string
        text:
          type: string
        kind:
          type: string
          description: cited | no_evidence | permission | historic

    StrategicAxis:
      type: object
      required: [id, name, color, description]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        description:
          type: string

    Role:
      type: object
      required: [id, label, clearance, area, description]
      properties:
        id:
          type: string
        label:
          type: string
        clearance:
          type: string
          description: public | internal | confidential | restricted
        area:
          type: string
        description:
          type: string

    CorpusDocument:
      type: object
      required:
        [id, title, country, brand, entity, quarter, type, confidentiality, owner, validity, language, topics, axisIds, summary, chunkCount]
      properties:
        id:
          type: string
        title:
          type: string
        country:
          type: string
        brand:
          type: string
        entity:
          type: string
        quarter:
          type: string
        type:
          type: string
        confidentiality:
          type: string
        owner:
          type: string
        validity:
          type: string
        validUntil:
          type: ["string", "null"]
        language:
          type: string
        topics:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string
        summary:
          type: string
        chunkCount:
          type: integer

    CorpusDocumentDetail:
      type: object
      required: [document, chunks]
      properties:
        document:
          $ref: "#/components/schemas/CorpusDocument"
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"

    DocumentChunk:
      type: object
      required: [id, breadcrumb, heading, text]
      properties:
        id:
          type: string
        breadcrumb:
          type: string
        heading:
          type: string
        text:
          type: string

    CountBucket:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer

    AxisCount:
      type: object
      required: [axisId, count]
      properties:
        axisId:
          type: string
        count:
          type: integer

    CorpusStats:
      type: object
      required:
        [totalDocuments, totalChunks, quarantined, byCountry, byType, byConfidentiality, byValidity, byAxis]
      properties:
        totalDocuments:
          type: integer
        totalChunks:
          type: integer
        quarantined:
          type: integer
        byCountry:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byType:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byConfidentiality:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byValidity:
          type: array
          items:
            $ref: "#/components/schemas/CountBucket"
        byAxis:
          type: array
          items:
            $ref: "#/components/schemas/AxisCount"
