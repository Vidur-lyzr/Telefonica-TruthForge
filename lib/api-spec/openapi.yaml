        draft:
          $ref: "#/components/schemas/GeneratedDraft"
        format:
          type: string
          enum: [docx, pptx, pdf, txt, md]
        destination:
          type: string
          enum: [internal, external]
          description: >
            Export destination. "external" strips internal-only material and
            refuses any non-public content (default internal).
        templateId:
          type: ["string", "null"]
          description: Export template id; defaults to the draft shape's template.

    ExportPackInput:
      type: object
      required: [draft]
      properties:
        draft:
          $ref: "#/components/schemas/GeneratedDraft"
        formats:
          type: array
          items:
            type: string
            enum: [docx, pptx, pdf, txt, md]
          description: Formats to bundle; empty/absent bundles every format the template offers.
        destination:
          type: string
          enum: [internal, external]
        templateId:
          type: ["string", "null"]

    ExportPreviewInput:
      type: object
      required: [draft, format]
      properties:
        draft:
          $ref: "#/components/schemas/GeneratedDraft"
        format:
          type: string
          enum: [pdf, docx, pptx]
        destination:
          type: string
          enum: [internal, external]
          description: >
            Preview destination. "external" strips internal-only material and
            refuses any non-public content — exactly as the real export would.
        templateId:
          type: ["string", "null"]
          description: Export template id; defaults to the draft shape's template.

    ExportPreviewGate:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
        message:
          type: ["string", "null"]

    ExportPreviewGates:
      type: object
      required: [guardian, approval, editorial]
      description: >
        Would-block status of the release gates a real export enforces. The
        preview still renders when one is blocked — the UI flags that the
        document cannot be exported yet.
      properties:
        guardian:
          $ref: "#/components/schemas/ExportPreviewGate"
        approval:
          $ref: "#/components/schemas/ExportPreviewGate"
        editorial:
          $ref: "#/components/schemas/ExportPreviewGate"

    ExportPreviewResponse:
      type: object
      required: [status, gates]
      properties:
        status:
          type: string
          enum: [ok, refused]
        format:
          type: string
          enum: [pdf, docx, pptx]
        pdfBase64:
          type: string
          nullable: true
          description: The rendition as PDF bytes (base64); present when status is ok.
        exact:
          type: boolean
          description: >
            True when the preview bytes come from the very renderer the
            download uses (pdf); false for the docx/pptx print-preview
            approximations.
        templateId:
          type: string
          nullable: true
        gates:
          $ref: "#/components/schemas/ExportPreviewGates"
        refusedCode:
          type: string
          nullable: true
          description: Machine-readable refusal code when status is refused.
        refusedMessage:
          type: string
          nullable: true

