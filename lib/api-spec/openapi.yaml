      parameters:
        - name: roleId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document lineage entries (locked when above clearance)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiLineage"

  /wiki/stats:
    get:
      operationId: getWikiStats
      tags: [wiki]
