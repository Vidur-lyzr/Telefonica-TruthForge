        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActingRoleInput"
      responses:
        "200":
          description: Skill document restored to the governed default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandSkill"
        "403":
          description: Persona lacks the manage_brand_room capability (code capability_blocked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brand/check:
