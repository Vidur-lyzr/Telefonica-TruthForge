      operationId: liveIngestAccept
      tags: [data]
      summary: Ingest reviewer-accepted public mentions as B-category documents
      description: >
        Accepted candidates become B-category documents with full provenance
        metadata and ingest-filter lineage, are chunked, embedded once, and
        upserted to the vector index like any other governed document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestAcceptInput"
      responses:
        "200":
          description: Created documents and index proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveIngestAcceptResult"

  /data/validation:
    get:
      operationId: listValidationItems
      tags: [data]
      summary: The validation queue with proposed three-layer classification
      responses:
        "200":
          description: Validation items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationItem"

  /data/freshness:
    get:
      operationId: listDocumentFreshness
      tags: [data]
      summary: Per-document SLA and freshness with review-overdue nudges
      responses:
        "200":
          description: Document freshness
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocFreshness"

