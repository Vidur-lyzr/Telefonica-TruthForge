    get:
      operationId: getBrandTemplates
      tags: [brand-room]
      summary: Governed document templates, permission-filtered by persona clearance
      description: >
        The brand-approved document templates. Templates are internal brand
        governance material, so a lower-clearance persona receives an empty set
        with a blocked count rather than the templates themselves (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandTemplatesView"

  /brand/template:
    get:
      operationId: getBrandTemplate
      tags: [brand-room]
      summary: One governed template's full structure, permission-filtered
      description: >
        The full section blueprint and required disclaimers for a single
        template. Fails closed: an existing but above-clearance template is
        reported as blocked with no content; an unknown id returns 404.
      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
          description: Template id to expand
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandTemplateDetailView"
        "404":
          description: Unknown template
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string

