    get:
      operationId: getBrandTone
      tags: [brand-room]
      summary: Tone-of-voice principles, hard rules, prohibited phrases and spelling
      responses:
        "200":
          description: Tone of voice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandToneView"

  /brand/resources:
    get:
      operationId: getBrandResources
      tags: [brand-room]
      summary: Governed brand resources, permission-filtered by persona clearance
      description: >
        Corporate brand resources across identity, messaging, legal and
        reference. Each resource carries its own clearance and is filtered to
        what the persona may see before it is returned (fail-closed).
      parameters:
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: Active persona id (permission scope)
      responses:
        "200":
          description: Permission-scoped resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandResourcesView"

  /brand/export-templates:
    get:
      operationId: getExportTemplates
      tags: [brand-room]
      summary: Export template library for governed document downloads
      description: >
        The Telefónica export templates the export engine can render — talking
        points, press release, Q&A briefing, generic report, KPI report and the
        10-day forecast — with their structure and an illustrative preview.
      responses:
        "200":
          description: Export templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportTemplate"

  /brand/check:
    post:
      operationId: checkBrandText
      tags: [brand-room]
      summary: Run the live Brand Guardian over arbitrary text
      description: >
        Deterministic brand check over pasted prose — emoji, unapproved
        superlatives, shouted lines, American spelling and uncited figures —
        returning the same verdict shape as the document export gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCheckInput"
      responses:
        "200":
          description: Guardian verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResult"

components:
  schemas:
    BrandTemplateSection:
      type: object
      required: [key, label, kind, perAxis]
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          type: string
        perAxis:
          type: boolean
    BrandTemplateDisclaimer:
      type: object
      required: [id, name, text]
      properties:
        id:
          type: string
        name:
          type: string
        text:
          type: string
    BrandTemplate:
      type: object
      required:
        [id, shape, name, description, purpose, format, owner, version, validity, clearance, sections, disclaimers]
      properties:
        id:
          type: string
        shape:
          type: string
        name:
          type: string
        description:
          type: string
        purpose:
          type: string
        format:
          type: string
        owner:
          type: string
        version:
          type: string
        validity:
          type: string
          description: approved | historic | review | superseded
        clearance:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateSection"
        disclaimers:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateDisclaimer"
    BrandTemplateSummary:
      type: object
      required:
        [id, shape, name, description, purpose, format, owner, version, validity, clearance, sectionCount]
      properties:
        id:
          type: string
        shape:
          type: string
        name:
          type: string
        description:
          type: string
        purpose:
          type: string
        format:
          type: string
        owner:
          type: string
        version:
          type: string
        validity:
          type: string
          description: approved | historic | review | superseded
        clearance:
          type: string
        sectionCount:
          type: integer
    BrandTemplatesView:
      type: object
      required: [personaClearance, blockedCount, templates]
      properties:
        personaClearance:
          type: string
        blockedCount:
          type: integer
        templates:
          type: array
          items:
            $ref: "#/components/schemas/BrandTemplateSummary"
    BrandTemplateDetailView:
      type: object
      required: [personaClearance, blocked, template]
      properties:
        personaClearance:
          type: string
        blocked:
          type: boolean
        template:
          oneOf:
            - $ref: "#/components/schemas/BrandTemplate"
            - type: "null"
    TonePrinciple:
      type: object
      required: [id, title, guidance, dos, donts]
      properties:
        id:
          type: string
        title:
          type: string
        guidance:
          type: string
        dos:
          type: array
          items:
            type: string
        donts:
          type: array
          items:
            type: string
    BrandRule:
      type: object
      required: [id, rule, severity, detail]
      properties:
        id:
          type: string
        rule:
          type: string
        severity:
          type: string
        detail:
          type: string
    ProhibitedPhrase:
      type: object
      required: [id, phrase, reason, rewrite]
      properties:
        id:
          type: string
        phrase:
          type: string
        reason:
          type: string
        rewrite:
          type: string
    SpellingPref:
      type: object
      required: [american, european]
      properties:
        american:
          type: string
        european:
          type: string
    BrandToneView:
      type: object
      required: [principles, rules, prohibited, spelling]
      properties:
        principles:
          type: array
          items:
            $ref: "#/components/schemas/TonePrinciple"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/BrandRule"
        prohibited:
          type: array
          items:
            $ref: "#/components/schemas/ProhibitedPhrase"
        spelling:
          type: array
          items:
            $ref: "#/components/schemas/SpellingPref"
    BrandResource:
      type: object
      required: [id, name, category, description, detail, format, clearance, validity]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        detail:
          type: string
        format:
          type: string
        clearance:
          type: string
        validity:
          type: string
    BrandResourcesView:
      type: object
      required: [personaClearance, blockedCount, resources]
      properties:
        personaClearance:
          type: string
        blockedCount:
          type: integer
        resources:
          type: array
          items:
            $ref: "#/components/schemas/BrandResource"
    BrandCheckInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
    GenerationJob:
      type: object
      required: [id, mode, stage, status, createdAt]
      properties:
        id:
          type: string
        mode:
          type: string
          description: generate | refine
        stage:
          type: string
          description: retrieving | composing | guardian | done
        status:
          type: string
          description: running | done | error
        draft:
          $ref: "#/components/schemas/GeneratedDraft"
          nullable: true
        error:
          type: string
          nullable: true
        createdAt:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable refusal code, e.g. editorial_review_required
      required:
        - error

    AskTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          description: user | assistant
        content:
          type: string

    AskFilters:
      type: object
      description: Retrieval scope applied BEFORE retrieval. Absent/empty means "all data".
      properties:
        market:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        period:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        axis:
          type: ["string", "null"]

    AskAttachment:
      type: object
      description: Working-context document. Never enters the corpus unless ingest is true.
      required: [name, content]
      properties:
        name:
          type: string
        content:
          type: string
        ingest:
          type: boolean

    AskInput:
      type: object
      required: [question, area, roleId]
      properties:
        question:
          type: string
          minLength: 1
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        roleId:
          type: string
          description: The active permission scope / persona id
        history:
          type: array
          description: Prior conversation turns, oldest first.
          items:
            $ref: "#/components/schemas/AskTurn"
        filters:
          oneOf:
            - $ref: "#/components/schemas/AskFilters"
            - type: "null"
        attachment:
          oneOf:
            - $ref: "#/components/schemas/AskAttachment"
            - type: "null"
        lang:
          type: string
          enum: [es, en, de, pt]
          description: >
            Preferred answer language. When present, the agent composes its
            answer in this language regardless of the question's language.
            Absent means mirror the question's language.

    AskResult:
      type: object
      required: [status, answer, citations, historic, axisIds]
      properties:
        status:
          type: string
          description: answered | no_evidence | permission_blocked | conflict
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        historic:
          type: boolean
        historicNote:
          type: ["string", "null"]
        historicPointer:
          type: ["string", "null"]
          description: Pointer to the current/superseding series when the answer is historic.
        permissionNote:
          type: ["string", "null"]
        conflictNote:
          type: ["string", "null"]
        resolutionPath:
          type: ["string", "null"]
          description: Where to resolve a conflict, e.g. "wiki".
        lowConfidence:
          type: boolean
        lowConfidenceNote:
          type: ["string", "null"]
        corroborationCount:
          type: ["integer", "null"]
          description: Number of permitted sources that agree on the headline figure.
        corroborationNote:
          type: ["string", "null"]
        axisIds:
          type: array
          items:
            type: string
        numeric:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
        adjacentDatum:
          oneOf:
            - $ref: "#/components/schemas/NumericFact"
            - type: "null"
          description: Closest adjacent/historic datum offered on a no-evidence result.
        relatedEntities:
          type: array
          items:
            $ref: "#/components/schemas/GraphEntity"
        suggestedNext:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedNext"
        retrievalModes:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalMode"
        attachmentAck:
          type: ["string", "null"]

    SuggestedNext:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
        rationale:
          type: ["string", "null"]

    RetrievalMode:
      type: object
      required: [mode, label, used]
      properties:
        mode:
          type: string
          description: semantic | agentic | graph | keyword
        label:
          type: string
        used:
          type: boolean
        detail:
          type: ["string", "null"]

    Citation:
      type: object
      required: [id, docId, docTitle, sourceLoc, version, owner, confidence, confidentiality, validity, snippet]
      properties:
        id:
          type: string
          description: Marker referenced in the answer, e.g. S1
        docId:
          type: string
        docTitle:
          type: string
        sourceLoc:
          type: string
          description: Human-readable location, e.g. "Q1 2026 Results › slide 12"
        version:
          type: string
        owner:
          type: string
        validUntil:
          type: ["string", "null"]
        confidence:
          type: number
        relevance:
          type: ["number", "null"]
          description: Retrieval relevance score (idf coverage) for this source.
        corroboration:
          type: ["integer", "null"]
          description: How many permitted sources agree with this source's headline figure.
        confidentiality:
          type: string
          description: public | private | confidential | off_the_record
        validity:
          type: string
          description: approved | historic | review | superseded
        conflicting:
          type: boolean
          description: True when this source materially disagrees with another cited source.
        snippet:
          type: string
        value:
          type: ["string", "null"]
          description: Optional headline figure for numeric evidence
        period:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        topics:
          type: array
          items:
            type: string
        entities:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string

    NumericFact:
      type: object
      required: [label, value, unit, period, source]
      properties:
        label:
          type: string
        value:
          type: string
        unit:
          type: string
        period:
          type: string
        source:
          type: string

    ModuleUsage:
      type: object
      required: [module, calls, inputTokens, outputTokens]
      properties:
        module:
          type: string
          description: ask | generate | kpis | planning | wiki | data
        calls:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        lastCallAt:
          type: string
          nullable: true

    UsageMeter:
      type: object
      required: [since, modules, totals]
      properties:
        since:
          type: string
          description: When metering started (first boot of the counter store)
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleUsage"
        totals:
          type: object
          required: [calls, inputTokens, outputTokens]
          properties:
            calls:
              type: integer
            inputTokens:
              type: integer
            outputTokens:
              type: integer

    AdminProfile:
      type: object
      required: [id, label, scope, detail]
      properties:
        id:
          type: string
          description: superadmin | admin | editor | audit
        label:
          type: string
        scope:
          type: string
        detail:
          type: string

    PlatformUser:
      type: object
      required: [id, name, email, area, profileId, clearance]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        area:
          type: string
          description: Comunicación | Marca | Gabinete
        profileId:
          type: string
          description: superadmin | admin | editor | audit
        clearance:
          type: string
          description: public | private | confidential | off_the_record

    ScheduledDocument:
      type: object
      required: [id, template, frequency, languages, owner, reviewFolder, sourceDocId, status]
      properties:
        id:
          type: string
        template:
          type: string
        frequency:
          type: string
        languages:
          type: array
          items:
            type: string
        owner:
          type: string
        reviewFolder:
          type: string
        sourceDocId:
          type: ["string", "null"]
        sourceTitle:
          type: ["string", "null"]
        status:
          type: string
          description: active | paused | orphaned

    AuditEntry:
      type: object
      required: [id, actor, action, target, kind, timestamp, detail]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        kind:
          type: string
          description: permission | user | schedule | run
        timestamp:
          type: string
        detail:
          type: string

    RetrievalLogHit:
      type: object
      required: [chunkId, docId, score, accessible]
      properties:
        chunkId:
          type: string
        docId:
          type: string
        score:
          type: number
        accessible:
          type: boolean

    RetrievalLogEvent:
      type: object
      required: [engine, query, filterExpr, hits]
      properties:
        engine:
          type: string
          description: qdrant | native
        query:
          type: string
          description: Truncated retrieval query (max 120 chars) — never chunk text
        filterExpr:
          type: string
          description: Human-readable governance filter applied inside the search
        hits:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalLogHit"

    RetrievalLogEntry:
      type: object
      required:
        [id, timestamp, surface, roleId, roleLabel, clearance, area, status, events]
      properties:
        id:
          type: string
        timestamp:
          type: string
        surface:
          type: string
          description: ask | generate
        roleId:
          type: ["string", "null"]
        roleLabel:
          type: ["string", "null"]
        clearance:
          type: string
        area:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          description: Final outcome set by the agent (answered, no_evidence, permission_blocked, drafted, ...)
        events:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalLogEvent"

    RetrievalLogPage:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalLogEntry"

    SourceSyncDelta:
      type: object
      required:
        [id, docId, docTitle, from, to, kind, requestedAt, requestedBy, appliedAt, mode]
      properties:
        id:
          type: string
        docId:
          type: string
        docTitle:
          type: string
        from:
          type: string
        to:
          type: string
        kind:
          type: string
          description: upgrade | downgrade
        requestedAt:
          type: string
        requestedBy:
          type: string
        appliedAt:
          type: ["string", "null"]
        mode:
          type: ["string", "null"]
          description: webhook (immediate upgrade) | batch (applied by a sync run) | null while pending

    SourceSyncRun:
      type: object
      required: [id, ranAt, actor, appliedCount]
      properties:
        id:
          type: string
        ranAt:
          type: string
        actor:
          type: string
        appliedCount:
          type: integer

    SourceSyncDocState:
      type: object
      required: [docId, title, type, category, indexLabel, sourceLabel, pending]
      properties:
        docId:
          type: string
        title:
          type: string
        type:
          type: string
        category:
          type: string
        indexLabel:
          type: string
          description: Confidentiality currently enforced by retrieval
        sourceLabel:
          type: string
          description: Confidentiality asserted by the simulated source system
        pending:
          type: boolean

    SourceSyncState:
      type: object
      required: [connector, docs, pendingDeltas, appliedDeltas, runs]
      properties:
        connector:
          type: string
        docs:
          type: array
          items:
            $ref: "#/components/schemas/SourceSyncDocState"
        pendingDeltas:
          type: array
          items:
            $ref: "#/components/schemas/SourceSyncDelta"
        appliedDeltas:
          type: array
          items:
            $ref: "#/components/schemas/SourceSyncDelta"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/SourceSyncRun"

    SetSourceLabelInput:
      type: object
      required: [docId, confidentiality]
      properties:
        docId:
          type: string
        confidentiality:
          type: string
          description: public | internal | private | confidential | off_the_record
        actor:
          type: string

    PublishReviewItemResult:
      type: object
      required: [docId, title, version, upsertedChunks, supersededDocId]
      properties:
        docId:
          type: string
        title:
          type: string
        version:
          type: integer
        upsertedChunks:
          type: integer
        supersededDocId:
          type: ["string", "null"]

    GraphEntity:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: market | brand | executive | axis
        relation:
          type: ["string", "null"]

    SuggestedQuery:
      type: object
      required: [id, text, kind]
      properties:
        id:
          type: string
        text:
          type: string
        kind:
          type: string
          description: cited | no_evidence | permission | historic

    StrategicAxis:
      type: object
      required: [id, name, color, description]
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        description:
          type: string

    Role:
      type: object
      required: [id, name, label, clearance, area, description]
      properties:
        id:
          type: string
        name:
          type: string
          description: Fictional person name for the demo persona
        label:
          type: string
        clearance:
          type: string
          description: public | private | confidential | off_the_record
        area:
          type: string
        description:
          type: string

    CorpusDocument:
      type: object
      required:
        [id, category, title, country, brand, entity, quarter, type, confidentiality, owner, validity, language, topics, axisIds, summary, chunkCount, sourceFormat, connector]
      properties:
        id:
          type: string
        category:
          type: string
          enum: [A, B, E]
          description: RFP data-universe branch — A = internal, B = external/public, E = SSoT-generated output
        title:
          type: string
        country:
          type: string
        brand:
          type: string
        entity:
          type: string
        quarter:
          type: string
        type:
          type: string
        confidentiality:
          type: string
        owner:
          type: string
        validity:
          type: string
        validUntil:
          type: ["string", "null"]
        language:
          type: string
        topics:
          type: array
          items:
            type: string
        axisIds:
          type: array
          items:
            type: string
        summary:
          type: string
        chunkCount:
          type: integer
        sourceFormat:
          type: string
          description: Simulated source format (structured Word, Excel numeric, PDF, self-explanatory PPT, API feed, manual form, SharePoint dump)
        connector:
          type: string
          description: Simulated connector / provenance the document arrived through
        frequency:
          type: ["string", "null"]
          description: Refresh cadence of the source (quarterly, ~48h, near-real-time, ad hoc...)
        version:
          type: ["string", "null"]
          description: Version label for versioned material (mostly SSoT-generated outputs)
        ingestFilter:
          oneOf:
            - $ref: "#/components/schemas/IngestFilter"
            - type: "null"
          description: Present only on external docs — what the pre-ingest filter matched
        supersedes:
          type: ["string", "null"]
          description: Id of the older document this version replaces (version lineage)
        supersededBy:
          type: ["string", "null"]
          description: Id of the newer document that replaces this one (derived)
        lineageSourceDocIds:
          type: array
          items:
            type: string
          description: For SSoT-generated docs — the governed source docs this output was generated from

    LiveIngestFilterInput:
      type: object
      description: The editor-defined pre-ingest filter for a live capture run
      required: [keywords, competitors, executives, topics]
      properties:
        keywords:
          type: array
          items:
            type: string
        competitors:
          type: array
          items:
            type: string
        executives:
          type: array
          items:
            type: string
        topics:
          type: array
          items:
            type: string

    LiveIngestSearchInput:
      type: object
      required: [filter]
      properties:
        filter:
          $ref: "#/components/schemas/LiveIngestFilterInput"

    LiveIngestCandidate:
      type: object
      description: A public mention matched by the pre-ingest filter, awaiting human review
      required: [id, title, source, excerpt, sentiment, matchedTerms]
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
          description: Publication / outlet name
        url:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        excerpt:
          type: string
        sentiment:
          type: string
          enum: [positive, negative, mixed, neutral]
        matchedTerms:
          type: array
          items:
            type: string
          description: Which filter terms this mention matched — why it passed the pre-ingest gate

    LiveIngestSearchResult:
      type: object
      required: [items, filter]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveIngestCandidate"
        filter:
          $ref: "#/components/schemas/LiveIngestFilterInput"

    LiveIngestAcceptInput:
      type: object
      description: >
        Accepts by server-issued candidate id only — the content and the
        filter provenance are taken from the server's own search results,
        never from the client, so arbitrary text cannot be injected past the
        pre-ingest gate.
      required: [acceptedIds]
      properties:
        acceptedIds:
          type: array
          minItems: 1
          items:
            type: string
        filter:
          $ref: "#/components/schemas/LiveIngestFilterInput"
        accepted:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LiveIngestCandidate"

    LiveIngestAcceptResult:
      type: object
      required: [createdDocs, upsertedChunks, pointsBefore, pointsAfter]
      properties:
        createdDocs:
          type: array
          items:
            type: object
            required: [docId, title]
            properties:
              docId:
                type: string
              title:
                type: string
        upsertedChunks:
          type: integer
        pointsBefore:
          type: integer
          description: Vector point count before ingestion
        pointsAfter:
          type: integer
          description: Vector point count after ingestion (grew by upsertedChunks)

    IngestFilter:
      type: object
      description: Filter-before-ingest provenance for external sources (keywords / competitors / executives / topics, with a +/- mention flag)
      required: [keywords, competitors, executives, topics, sentiment]
      properties:
        keywords:
          type: array
          items:
