          type: array
          items:
            type: string
        spokesperson:
          type: ["string", "null"]
          description: Named spokesperson for quotes and spokesperson notes
        eventDate:
          type: ["string", "null"]
          description: Event or publication date framing the document
        kpiContext:
          description: >
            Structured KPI panel context handed over from the KPIs page.
            Carries the active filters only — the engine recomputes every
            figure server-side under the persona's clearance (fail closed)
            before any of it reaches the composer.
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/KpiReportContext"
        askContext:
          description: >
            Structured Ask answer handoff from the Ask page. Carries the
            original question, the cited document ids and honest status flags
            only — never snippets or answer text. The engine re-derives every
            cited source's accessibility server-side under the CURRENT
            persona's clearance and the destination gate (fail closed), so a
            tampered or stale payload can never surface content the persona
            could not retrieve itself.
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/AskHandoffContext"
        attachments:
          description: >
            User-provided brief attachments (pasted brief/data and governed
            source links). Passed to the composer as clearly labeled
            user-provided context only — never treated as governed evidence,
            never cited, and never folded into retrieval.
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/BriefAttachments"

